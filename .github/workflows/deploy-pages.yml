name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel an in-flight production deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The virtual LAN's internet uplink settings (PPP server and login), which the
      # collection page loads from examples/uplink.json. Kept out of git (see
      # .gitignore) and stored as a repository secret; skipped if it isn't set.
      - name: Write uplink settings
        env:
          UPLINK_JSON: ${{ secrets.UPLINK_JSON }}
        run: |
          if [ -n "$UPLINK_JSON" ]; then
            printf '%s' "$UPLINK_JSON" > examples/uplink.json
            jq -e .url examples/uplink.json > /dev/null
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
