/* Edit a title's info. open(item) shows it for that item. */
class EditDialog extends HTMLElement {
  connectedCallback() {
    if (this.dialog) return;
    this.innerHTML = `
      <dialog class="edit-dialog">
        <button class="close-dialog" title="Close">✕</button>
        <h3>Edit software</h3>
        <label>Title <input type="text" name="edit-title"></label>
        <label class="edit-exe-field">Program to run <input type="text" name="edit-exe" placeholder="GAMEDIR/GAME.EXE"></label>
        <label class="edit-url-field">URL <input type="url" name="edit-url"></label>
        <label>Thumbnail URL <input type="url" name="edit-thumb" placeholder="https://archive.org/services/img/..."></label>
        <label class="edit-core-field">Emulator core <select name="edit-core"></select></label>
        <label class="edit-capture-field"><input type="checkbox" name="edit-capture"> Capture the mouse when the screen is clicked (Esc releases it)</label>
        <label class="edit-network-field"><input type="checkbox" name="edit-network"> Connect to the local network (shared by every machine running in this browser)</label>
        <label class="edit-network-field">Host name on the network <input type="text" name="edit-hostname"></label>
        <fieldset class="edit-media-field">
          <legend>Disks</legend>
          <div class="disk-list"></div>
          <div class="disk-add">
            <button class="disk-add-file">＋ Add disk images or zips…</button>
            <input type="file" class="disk-file" multiple hidden>
            <button class="disk-add-folder">＋ Add a folder…</button>
            <input type="file" class="disk-folder" webkitdirectory hidden>
            <input type="url" name="disk-url" placeholder="…or a disk image or zip URL">
            <button class="disk-add-url">Add</button>
          </div>
          <p class="field-hint">Floppies and CDs for this title. A zip or folder becomes a floppy or CD, whichever drive it's put in. "In drive" ones are inserted at power on; swap them from the 💿 menu while playing. Disk changes are saved right away.</p>
          <p class="error-note disk-error"></p>
        </fieldset>
        <button class="primary edit-save">Save changes</button>
      </dialog>`;
    this.dialog = this.querySelector('dialog');
    this.querySelector('.close-dialog').addEventListener('click', () => this.dialog.close());
    this.querySelector('.edit-save').addEventListener('click', () => this.save());
    let fileInput = this.querySelector('.disk-file'), folderInput = this.querySelector('.disk-folder');
    this.querySelector('.disk-add-file').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => this.diskAction(async () => {
      for (let disk of await CollectionItem.groupFiles(fileInput.files)) await this.item.addDisk(disk);
      fileInput.value = '';
    }));
    this.querySelector('.disk-add-folder').addEventListener('click', () => folderInput.click());
    folderInput.addEventListener('change', () => this.diskAction(async () => {
      if (folderInput.files.length) await this.item.addDisk(CollectionItem.folderDisk(folderInput.files));
      folderInput.value = '';
    }));
    this.querySelector('.disk-add-url').addEventListener('click', () => this.diskAction(async () => {
      let url = this.field('disk-url').value.trim();
      if (!url) return;
      let name = decodeURIComponent(new URL(url, location.href).pathname.split('/').pop()) || url;
      await this.item.addDisk({ name, url });
      this.field('disk-url').value = '';
    }));
  }
  /* Run a disk-list change, then show the list as it now is */
  async diskAction(fn) {
    this.querySelector('.disk-error').textContent = '';
    try { await fn(); }
    catch (e) { console.error(e); this.querySelector('.disk-error').textContent = e.message; }
    this.renderDisks();
  }
  renderDisks() {
    let item = this.item, drives = item.constructor.mediaDrives;
    let list = this.querySelector('.disk-list');
    if (!drives) { list.replaceChildren(); return; }
    list.replaceChildren(...item.disks.map(disk => {
      let row = document.createElement('div');
      row.className = 'disk-row';
      row.innerHTML = `
        <input type="text" class="disk-name" title="Name">
        <select class="disk-drive" title="Drive"></select>
        <label class="disk-inserted" title="Inserted at power on"><input type="checkbox"> In drive</label>
        <button class="disk-remove" title="Remove this disk">✕</button>`;
      let name = row.querySelector('.disk-name');
      name.value = disk.name;
      name.addEventListener('change', () => this.diskAction(() => item.updateDisk(disk.id, { name: name.value.trim() || disk.name })));
      let drive = row.querySelector('.disk-drive');
      drive.replaceChildren(...Object.entries(drives).map(([id, d]) => new Option(d.label, id)));
      drive.value = disk.drive;
      drive.addEventListener('change', () => this.diskAction(() => item.updateDisk(disk.id, { drive: drive.value })));
      let inserted = row.querySelector('.disk-inserted input');
      inserted.checked = item.inserted[disk.drive] == disk.id;
      inserted.addEventListener('change', () => this.diskAction(() => item.setInserted(disk.drive, inserted.checked ? disk.id : null)));
      row.querySelector('.disk-remove').addEventListener('click', () => this.diskAction(() => item.removeDisk(disk.id)));
      return row;
    }));
    if (!item.disks.length) list.innerHTML = '<p class="field-hint">No disks yet.</p>';
  }
  field(name) { return this.querySelector(`[name="${name}"]`); }
  open(item) {
    let r = item.record;
    this.item = item;
    this.field('edit-title').value = r.title || '';
    this.field('edit-exe').value = r.exe || '';
    this.field('edit-url').value = r.url || '';
    this.field('edit-thumb').value = r.thumb || '';
    this.field('edit-capture').checked = !!r.captureMouse;
    let cores = item.constructor.cores;
    this.querySelector('.edit-core-field').style.display = cores ? '' : 'none';
    if (cores) {
      let select = this.field('edit-core');
      select.replaceChildren(...Object.entries(cores).map(([id, label]) => new Option(label, id)));
      select.value = r.core || Object.keys(cores)[0];
    }
    this.field('edit-network').checked = r.network == 'lan';
    this.field('edit-hostname').value = r.hostname || '';
    this.field('edit-hostname').placeholder = item.hostname;
    this.querySelector('.edit-exe-field').style.display = item.constructor.exeField ? '' : 'none';
    this.querySelector('.edit-capture-field').style.display = item.constructor.captureMouseField ? '' : 'none';
    this.querySelectorAll('.edit-network-field').forEach(el => { el.style.display = item.constructor.networkField ? '' : 'none'; });
    this.querySelector('.edit-url-field').style.display = r.source == 'url' ? '' : 'none';
    let drives = item.constructor.mediaDrives;
    this.querySelector('.edit-media-field').style.display = drives ? '' : 'none';
    if (drives) {
      this.querySelector('.disk-file').accept = [...new Set(Object.values(item.constructor.mediaAccept).join(',').split(','))].join(',');
      this.querySelector('.disk-error').textContent = '';
      this.renderDisks();
    }
    this.dialog.showModal();
  }
  save() {
    let r = this.item.record;
    let fields = {
      title: this.field('edit-title').value.trim() || r.title,
      exe: this.field('edit-exe').value.trim(),
      thumb: this.field('edit-thumb').value.trim() || undefined,
    };
    if (r.source == 'url') fields.url = this.field('edit-url').value.trim() || r.url;
    if (this.item.constructor.captureMouseField) fields.captureMouse = this.field('edit-capture').checked || undefined;
    if (this.item.constructor.cores) fields.core = this.field('edit-core').value;
    if (this.item.constructor.networkField) {
      fields.network = this.field('edit-network').checked ? 'lan' : undefined;
      fields.hostname = this.field('edit-hostname').value.trim() || undefined;
    }
    this.item.update(fields);
    this.dialog.close();
  }
}
customElements.define('emularity-edit-dialog', EditDialog);

/* Make a new instance of a title: a fresh copy with its own saves (and for machines,
   its own disk changes and network name), optionally with a bigger hard disk.
   open(item) shows it; instances are made through the `collection` it belongs to. */
class InstanceDialog extends HTMLElement {
  collection = null;

  connectedCallback() {
    if (this.dialog) return;
    this.innerHTML = `
      <dialog class="instance-dialog">
        <button class="close-dialog" title="Close">✕</button>
        <h3>New instance</h3>
        <p class="field-hint">A fresh copy of <b class="instance-of"></b> as it was originally, with its own saved changes.</p>
        <label>Title <input type="text" name="instance-title"></label>
        <label class="instance-disk-field">Hard disk size <select name="instance-disk"></select></label>
        <p class="field-hint instance-disk-hint">A bigger disk is built by copying the original's files onto it, which reads the whole original once. Only the space that gets used is stored.</p>
        <button class="primary instance-create">Create</button>
      </dialog>`;
    this.dialog = this.querySelector('dialog');
    this.querySelector('.close-dialog').addEventListener('click', () => this.dialog.close());
    this.querySelector('.instance-create').addEventListener('click', () => this.create());
  }
  async open(item) {
    this.item = item;
    this.querySelector('.instance-of').textContent = item.record.title;
    let title = this.querySelector('[name="instance-title"]');
    title.value = this.collection.instanceTitle(item);
    let resizable = !!item.canResizeDisk;
    for (let el of this.querySelectorAll('.instance-disk-field, .instance-disk-hint')) el.style.display = resizable ? '' : 'none';
    if (resizable) {
      let { maxDiskSize } = await import('../src/emulators/fat-repack.js');
      let current = item.hardDiskSize, max = maxDiskSize();
      let select = this.querySelector('[name="instance-disk"]');
      let options = [new Option('Same as the original' + (current ? ' (' + Format.bytes(current) + ')' : ''), '')];
      for (let mb of [512, 1024, 1536]) {
        if (!current || mb * 1048576 > current * 1.1) options.push(new Option(Format.bytes(mb * 1048576), mb * 1048576));
      }
      options.push(new Option(Format.bytes(max) + ' (the most FAT16 allows)', max));
      select.replaceChildren(...options);
    }
    this.dialog.showModal();
    title.select();
  }
  create() {
    let title = this.querySelector('[name="instance-title"]').value.trim();
    let diskSize = this.item.canResizeDisk ? +this.querySelector('[name="instance-disk"]').value || 0 : 0;
    this.dialog.close();
    this.collection.newInstance(this.item, { title, diskSize });
  }
}
customElements.define('emularity-instance-dialog', InstanceDialog);

/* Add software to the collection: from one of the platform's sources (see
   SoftwareSource), a URL, or an upload. open(platform) shows it for a platform's item
   class; new items are added through the `collection` it belongs to. */
class AddDialog extends HTMLElement {
  collection = null;

  connectedCallback() {
    if (this.dialog) return;
    this.innerHTML = `
      <dialog>
        <button class="close-dialog" title="Close">✕</button>
        <h3>Add software</h3>
        <div class="add-tabs">
          <span class="source-tabs"></span>
          <button data-tab="url">From URL</button>
          <button data-tab="upload">Upload</button>
        </div>

        <div class="tab-panel" data-panel="search">
          <div class="search-row">
            <span class="search-filter" title="Results are filtered to software for this platform"></span>
            <input type="search" name="query" placeholder="Search titles...">
          </div>
          <p class="field-hint source-hint"></p>
          <div class="search-results"></div>
        </div>

        <div class="tab-panel" data-panel="url" style="display: none">
          <label>Title <input type="text" name="title"></label>
          <label>URL <input type="url" name="url" placeholder="https://example.com/game.zip"></label>
          <p class="field-hint url-hint"></p>
          <label class="exe-field">Program to run <input type="text" name="exe" placeholder="GAMEDIR/GAME.EXE"></label>
          <button class="primary add-url">Add to collection</button>
        </div>

        <div class="tab-panel" data-panel="upload" style="display: none">
          <label>Title <input type="text" name="uploadtitle"></label>
          <label>File <input type="file" name="file"></label>
          <p class="field-hint upload-hint"></p>
          <label class="exe-field">Program to run <input type="text" name="uploadexe" placeholder="GAMEDIR/GAME.EXE"></label>
          <button class="primary add-upload">Add to collection</button>
        </div>
        <p class="error-note"></p>
        <p class="added-note" aria-live="polite"></p>
      </dialog>`;
    this.dialog = this.querySelector('dialog');
    this.results = this.querySelector('.search-results');

    this.querySelector('.close-dialog').addEventListener('click', () => this.dialog.close());
    this.querySelectorAll('.add-tabs > button').forEach(btn => btn.addEventListener('click', () => this.showTab(btn)));
    let query = this.field('query');
    // Debounce as-you-type searches so we don't hit the network on every keystroke
    query.addEventListener('input', () => {
      clearTimeout(this.searchTimer);
      this.searchTimer = setTimeout(() => this.search(), 500);
    });
    query.addEventListener('keydown', ev => {
      if (ev.key == 'Enter') { clearTimeout(this.searchTimer); this.search(); }
    });
    // Infinite scroll: fetch the next page as the list nears the bottom
    this.results.addEventListener('scroll', () => {
      let el = this.results;
      if (el.scrollTop + el.clientHeight >= el.scrollHeight - 150) this.loadMore();
    });
    // Shift+click adds without closing, to add several titles in a row
    this.querySelector('.add-url').addEventListener('click', ev => this.addFromURL(ev.shiftKey));
    this.querySelector('.add-upload').addEventListener('click', ev => this.addFromUpload(ev.shiftKey));
  }
  field(name) { return this.querySelector(`[name="${name}"]`); }
  setError(msg) { this.querySelector('.error-note').textContent = msg || ''; }

  open(platform) {
    this.platform = platform;
    this.setError('');
    this.querySelector('.url-hint').textContent = platform.hint;
    this.querySelector('.upload-hint').textContent = platform.hint;
    this.field('file').accept = platform.accept;
    this.querySelectorAll('.exe-field').forEach(el => { el.style.display = platform.exeField ? '' : 'none'; });
    // One tab per source, all sharing the search panel
    let tabs = this.querySelector('.source-tabs');
    tabs.replaceChildren(...platform.sources.map(source => {
      let btn = document.createElement('button');
      btn.dataset.tab = 'search';
      btn.textContent = source.label;
      btn.source = source;
      btn.addEventListener('click', () => this.showTab(btn));
      return btn;
    }));
    this.dialog.showModal();
    this.showTab(tabs.firstElementChild || this.querySelector('[data-tab="url"]'));
  }
  showTab(btn) {
    this.querySelectorAll('.add-tabs button').forEach(b => b.classList.toggle('active', b == btn));
    this.querySelectorAll('.tab-panel').forEach(p => { p.style.display = (p.dataset.panel == btn.dataset.tab) ? '' : 'none'; });
    if (btn.source) this.useSource(btn.source);
  }
  useSource(source) {
    this.source = source;
    this.querySelector('.added-note').textContent = '';
    let filter = this.querySelector('.search-filter');
    filter.textContent = source.filter;
    filter.style.display = source.filter ? '' : 'none';
    this.querySelector('.source-hint').textContent = source.hint + ' Shift+click to add several.';
    this.field('query').value = '';
    this.results.innerHTML = '';
    this.field('query').focus();
    this.search(); // pre-populate with what the source has
  }

  /* ----- Searching the current source ----- */

  appendResults(found) {
    found.forEach(result => {
      let row = document.createElement('div');
      row.className = 'search-result';
      row.innerHTML = '<img loading="lazy"><div><div class="result-title"></div><div class="result-detail"></div></div>';
      let img = row.querySelector('img');
      if (result.thumb) img.src = result.thumb; else img.remove();
      row.querySelector('.result-title').textContent = result.title;
      row.querySelector('.result-detail').textContent = result.detail || '';
      row.addEventListener('click', ev => this.addFromSource(result, row, ev.shiftKey));
      this.results.appendChild(row);
    });
  }
  async search() {
    let results = this.results, source = this.source;
    let text = this.field('query').value.trim();
    let state = this.searchState = { source, text, page: 1, total: Infinity, loading: true };
    if (!results.children.length) results.innerHTML = '<p class="field-hint">Searching...</p>';
    results.classList.add('loading');
    this.setError('');
    try {
      let { results: found, total } = await source.search(text, 1);
      if (state != this.searchState) return; // a newer search superseded this one
      results.classList.remove('loading');
      results.innerHTML = '';
      state.total = total;
      state.loading = false;
      if (!found.length) { results.innerHTML = '<p class="field-hint">No results.</p>'; return; }
      this.appendResults(found);
      results.scrollTop = 0;
    } catch (e) {
      if (state != this.searchState) return;
      console.error(e);
      results.classList.remove('loading');
      results.innerHTML = '';
      this.setError('Search failed: ' + e.message);
    }
  }
  async loadMore() {
    let state = this.searchState;
    if (!state || state.loading) return;
    if (this.results.querySelectorAll('.search-result').length >= state.total) return; // all loaded
    state.loading = true;
    let loader = document.createElement('div');
    loader.className = 'search-more';
    loader.textContent = 'Loading more...';
    this.results.appendChild(loader);
    try {
      let { results: found } = await state.source.search(state.text, state.page + 1);
      if (state != this.searchState) return; // superseded by a newer search
      state.page++;
      this.appendResults(found);
    } catch (e) {
      console.error(e);
    } finally {
      loader.remove();
      state.loading = false;
    }
  }

  /* ----- Adding ----- */

  add(record) {
    return this.collection.addItem(Object.assign({ platform: this.platform.key }, record));
  }
  /* After adding: close, or with `keepOpen` (shift+click) stay open for more */
  added(title, keepOpen) {
    if (!keepOpen) return this.dialog.close();
    this.setError('');
    this.querySelector('.added-note').textContent = 'Added "' + title + '".';
  }
  async addFromSource(result, row, keepOpen) {
    this.setError('');
    row.style.opacity = .5;
    try {
      this.add(await this.source.toRecord(result));
      if (keepOpen) row.classList.add('added');
      this.added(result.title, keepOpen);
    } catch (e) {
      console.error(e);
      this.setError(`Couldn't add ${result.title}: ${e.message}`);
    } finally {
      row.style.opacity = '';
    }
  }
  addFromURL(keepOpen) {
    let url = this.field('url').value.trim();
    if (!url) return this.setError('A URL is required.');
    let filename = url.split('?')[0].split('/').pop() || 'software';
    let item = this.add({
      title: this.field('title').value.trim() || filename,
      source: 'url',
      url: url,
      filename: filename,
      exe: this.field('exe').value.trim(),
    });
    item.fetchSize(); // fill in size via HEAD in the background
    for (let name of ['url', 'title', 'exe']) this.field(name).value = '';
    this.added(item.record.title, keepOpen);
  }
  async addFromUpload(keepOpen) {
    let input = this.field('file');
    if (!input.files.length) return this.setError('Choose a file to upload.');
    let file = input.files[0];
    let item = this.add({
      title: this.field('uploadtitle').value.trim() || file.name,
      source: 'upload',
      filename: file.name,
      exe: this.field('uploadexe').value.trim(),
      size: file.size,
    });
    try {
      await LocalStore.uploadPut(item.record.id, file);
      for (let name of ['file', 'uploadtitle', 'uploadexe']) this.field(name).value = '';
      this.added(item.record.title, keepOpen);
    } catch (e) {
      console.error(e);
      this.collection.dropItem(item);
      this.setError('Failed to store the file in browser storage: ' + e.message);
    }
  }
}
customElements.define('emularity-add-dialog', AddDialog);


/* ===== Player =====

   Plays one collection item: a bar (back, title, session timer, mouse capture, mute,
   theater, fullscreen) above the item's emulator, and a "powered off" screen when the emulated
   program exits. Set `prefs` ({ muted, theater }, shared with the collection) before
   load(); changes to it are announced with a `prefschange` event. */
class CollectionPlayer extends HTMLElement {
  prefs = { muted: false, theater: false };

  /* Build the item's emulator and the player around it. Throws if the item can't be
     played. */
  async load(item) {
    this.item = item;
    this.emu = await item.buildEmulator();
    this.emu.addEventListener('exit', ev => this.showPoweredOff(ev.detail || {}));
    // Closing the tab (or window, or a stray Ctrl+W, which pages can't intercept) while
    // a machine runs asks first. Our own navigations set `leaving` to skip it.
    this.leaving = false;
    addEventListener('beforeunload', ev => {
      if (this.leaving || this.poweredOff) return;
      ev.preventDefault();
      ev.returnValue = ''; // older browsers need this to show the prompt
    });

    let bar = document.createElement('div');
    bar.className = 'player-bar';
    bar.innerHTML = `
      <button class="pb-back">◀ Back to collection</button>
      <span class="player-title"></span>
      <span class="pb-timer" title="Time played this session">0:00</span>
      <span class="pb-controls">
        <span class="pb-media-wrap">
          <button class="pb-media" title="Disks: insert, swap or eject">💿</button>
          <div class="pb-media-popup" hidden></div>
          <input type="file" class="pb-media-file" multiple hidden>
          <input type="file" class="pb-media-folder" webkitdirectory hidden>
        </span>
        <button class="pb-network" title="Show the machines on the local network">🖧</button>
        <button class="pb-capture" title="Capture mouse (Esc releases it)">🖱</button>
        <button class="pb-mute"></button>
        <button class="pb-theater" title="Theater mode">▭</button>
        <button class="pb-fullscreen" title="Fullscreen">⛶</button>
      </span>`;
    bar.querySelector('.player-title').textContent = item.record.title;
    // To the platform's library (replacing this entry, so Back still behaves); leaving
    // on purpose, so no "leave site?" prompt
    bar.querySelector('.pb-back').addEventListener('click', () => {
      this.leaving = true;
      location.replace('#' + item.record.platform);
    });

    // Count up play time for this session (it ends with the reload that leaving the
    // player triggers).
    let start = Date.now(), timerEl = bar.querySelector('.pb-timer');
    let tick = () => { timerEl.textContent = Format.duration(Date.now() - start); };
    tick();
    this.timer = setInterval(tick, 1000);

    let muteBtn = bar.querySelector('.pb-mute');
    let updateMute = () => { muteBtn.textContent = this.prefs.muted ? '🔇' : '🔊'; muteBtn.title = this.prefs.muted ? 'Unmute' : 'Mute'; };
    updateMute();
    muteBtn.addEventListener('click', () => {
      this.prefs.muted = !this.prefs.muted;
      AudioMute.set(this.prefs.muted);
      updateMute();
      this.dispatchEvent(new CustomEvent('prefschange'));
    });

    let theaterBtn = bar.querySelector('.pb-theater');
    let updateTheater = () => {
      this.classList.toggle('theater', this.prefs.theater);
      theaterBtn.classList.toggle('active', this.prefs.theater);
    };
    updateTheater();
    theaterBtn.addEventListener('click', () => {
      this.prefs.theater = !this.prefs.theater;
      updateTheater();
      this.dispatchEvent(new CustomEvent('prefschange'));
    });

    // Pointer lock, for emulators that support it: raw relative mouse movement
    bar.querySelector('.pb-network').addEventListener('click', () => this.dispatchEvent(new CustomEvent('shownetwork', { bubbles: true })));
    let captureBtn = bar.querySelector('.pb-capture');
    if (typeof this.emu.lockPointer == 'function') {
      captureBtn.addEventListener('click', () => this.emu.lockPointer().catch(e => console.warn('Emularity: pointer lock failed', e)));
    } else {
      captureBtn.remove();
    }

    this.setUpMediaMenu(bar);

    bar.querySelector('.pb-fullscreen').addEventListener('click', () => {
      let c = this.emu.canvas;
      if (document.fullscreenElement) document.exitFullscreen();
      else if (c && c.requestFullscreen) c.requestFullscreen().catch(e => console.warn('Emularity: fullscreen failed', e));
    });

    this.replaceChildren(bar, this.emu);
  }

  /* The 💿 menu: each removable drive, what's in it, and the title's disks that fit */
  setUpMediaMenu(bar) {
    let item = this.item, emu = this.emu;
    let wrap = bar.querySelector('.pb-media-wrap');
    if (!item.constructor.mediaDrives || !('mediaDrives' in emu)) { wrap.remove(); return; }
    let button = wrap.querySelector('.pb-media'), popup = wrap.querySelector('.pb-media-popup');
    let fileInput = wrap.querySelector('.pb-media-file'), folderInput = wrap.querySelector('.pb-media-folder');
    let note = '', fileDrive = null;

    // Keep the title's record in step with the drives, so the same disks are in next
    // time. Disks the title doesn't own (its main image, the machine's own) aren't kept.
    emu.addEventListener('mediachange', ev => {
      let { drive, current } = ev.detail;
      let id = current && item.disks.some(d => d.id == current.id) ? current.id : null;
      if (id || item.inserted[drive]) item.setInserted(drive, id);
      if (!popup.hidden) render();
    });

    let run = async (label, fn) => {
      note = label + '…';
      render();
      try { await fn(); note = ''; }
      catch (e) {
        console.error(e);
        note = e.message;
      }
      render();
    };
    let insert = (drive, disk) => run('Inserting ' + disk.name, async () => {
      // A disk can only be in one drive at a time: take it out of the other
      let elsewhere = emu.mediaDrives.find(d => d.id != drive.id && d.current && d.current.id == disk.id && d.canEject !== false);
      if (elsewhere) await emu.ejectMedia(elsewhere.id);
      try {
        await emu.insertMedia(drive.id, await item.diskMedia(disk, drive.id));
      } catch (e) {
        if (!e.needsRestart) throw e;
        // Takes effect at the next power on
        if (disk.drive != drive.id) item.updateDisk(disk.id, { drive: drive.id });
        item.setInserted(drive.id, disk.id);
        throw e;
      }
    });
    // (Several files can be picked, for a cue sheet and its .bin: the first disk they
    // make goes in the drive, and the rest are kept with the title's disks)
    fileInput.addEventListener('change', () => {
      let picked = [...fileInput.files], drive = fileDrive;
      fileInput.value = '';
      if (!picked.length || !drive) return;
      run('Adding ' + picked[0].name, async () => {
        let disks = await CollectionItem.groupFiles(picked), first;
        for (let d of disks) {
          let disk = await item.addDisk({ ...d, drive: drive.id });
          first ||= disk;
        }
        render();
        await insert(drive, first);
      });
    });

    folderInput.addEventListener('change', () => {
      let drive = fileDrive;
      if (!folderInput.files.length || !drive) return;
      let folder = CollectionItem.folderDisk(folderInput.files);
      folderInput.value = '';
      run('Adding ' + folder.name, async () => {
        let disk = await item.addDisk({ ...folder, drive: drive.id });
        render();
        await insert(drive, disk);
      });
    });

    let render = () => {
      let rows = [];
      for (let drive of emu.mediaDrives) {
        let section = document.createElement('div');
        section.className = 'pbm-drive';
        let head = document.createElement('div');
        head.className = 'pbm-head';
        head.innerHTML = `<b></b> <span></span>`;
        head.querySelector('b').textContent = drive.label;
        head.querySelector('span').textContent = drive.current ? drive.current.name : 'empty';
        section.append(head);
        let fits = item.disks.filter(d => item.diskFits(d, drive.id));
        for (let disk of fits) {
          let current = drive.current && drive.current.id == disk.id;
          let b = document.createElement('button');
          b.textContent = (current ? '● ' : '○ ') + disk.name;
          b.disabled = current;
          let elsewhere = emu.mediaDrives.find(d => d.id != drive.id && d.current && d.current.id == disk.id);
          if (elsewhere && !drive.disks) { b.textContent += ` (move from ${elsewhere.label})`; b.classList.add('pbm-later'); }
          // DOSBox can only swap among disks mounted at power on
          if (drive.disks && !drive.disks.includes(disk.id)) { b.textContent += ' (after restart)'; b.classList.add('pbm-later'); }
          b.addEventListener('click', () => insert(drive, disk));
          section.append(b);
        }
        if (drive.current && drive.canEject !== false) {
          let b = document.createElement('button');
          b.textContent = '⏏ Eject';
          b.addEventListener('click', () => run('Ejecting', () => emu.ejectMedia(drive.id)));
          section.append(b);
        }
        let add = document.createElement('button');
        add.textContent = '＋ Insert a file…';
        add.addEventListener('click', () => {
          fileDrive = drive;
          fileInput.accept = item.constructor.mediaAccept[drive.kind] || '';
          fileInput.click();
        });
        let addFolder = document.createElement('button');
        addFolder.textContent = '＋ Insert a folder…';
        addFolder.addEventListener('click', () => {
          fileDrive = drive;
          folderInput.click();
        });
        section.append(add, addFolder);
        rows.push(section);
      }
      // DOSBox swaps every multi-disk drive at once
      let together = emu.mediaDrives.filter(d => d.disks && d.disks.length > 1);
      if (together.length > 1) {
        let p = document.createElement('p');
        p.className = 'pbm-hint';
        p.textContent = `Changing disks also changes ${together.map(d => d.label).join(' and ')} together — DOSBox swaps every drive at once.`;
        rows.push(p);
      }
      if (note) {
        let p = document.createElement('p');
        p.className = 'pbm-note';
        p.textContent = note;
        rows.push(p);
      }
      popup.replaceChildren(...rows);
    };
    button.addEventListener('click', ev => {
      ev.stopPropagation();
      popup.hidden = !popup.hidden;
      button.classList.toggle('active', !popup.hidden);
      if (!popup.hidden) { note = ''; render(); }
    });
    popup.addEventListener('click', ev => ev.stopPropagation());
    document.addEventListener('click', () => { popup.hidden = true; button.classList.remove('active'); });
  }

  /* `how` is the emulator's exit detail: { shutdown } when an operating system shut the
     machine down */
  showPoweredOff(how = {}) {
    if (this.poweredOff) return;
    this.poweredOff = true;
    clearInterval(this.timer);
    // Give the mouse and keyboard back (leaving fullscreen releases the keyboard lock)
    if (document.pointerLockElement) { try { document.exitPointerLock(); } catch (e) {} }
    if (document.fullscreenElement) { try { document.exitFullscreen(); } catch (e) {} }
    let overlay = document.createElement('div');
    overlay.className = 'powered-off';
    overlay.innerHTML = `
      <div class="po-title"></div>
      <p class="po-sub">The game has powered off.</p>
      <button class="po-power" title="Power on">⏻</button>
      <span class="po-label">Power on</span>`;
    overlay.querySelector('.po-title').textContent = this.item.record.title;
    if (how.shutdown) overlay.querySelector('.po-sub').textContent = 'The machine has shut down.';
    let powerOn = async () => {
      await this.item.beforeLaunch(); // e.g. re-grant folder access within this gesture
      this.leaving = true;
      location.reload();
    };
    overlay.querySelector('.po-power').addEventListener('click', powerOn);
    overlay.querySelector('.po-label').addEventListener('click', powerOn);
    this.appendChild(overlay);
  }
}
customElements.define('emularity-collection-player', CollectionPlayer);


/* ===== Collection =====

   The library: platform tabs, a sortable grid of the platform's items, and the
   add/edit dialogs. Persists the item records and view preferences in localStorage.
   Routes: #<platform> shows that platform's library; #play/<itemId> plays a title. */
class EmularityCollection extends HTMLElement {
  static STORAGE_KEY = 'emularity-collection';
  static SORTS = {
    'added-desc':  { label: 'Recently added', cmp: (a, b) => (b.added || 0) - (a.added || 0) },
    'played-desc': { label: 'Last played',    cmp: (a, b) => (b.lastPlayed || 0) - (a.lastPlayed || 0) },
    'title-asc':   { label: 'Title (A–Z)',    cmp: (a, b) => (a.title || '').localeCompare(b.title || '') },
    'rating-desc': { label: 'Rating',         cmp: (a, b) => (b.rating || 0) - (a.rating || 0) },
  };

  items = [];
  playing = false;

  connectedCallback() {
    let platforms = CollectionItem.platforms;
    let stored = {};
    try { stored = JSON.parse(localStorage.getItem(EmularityCollection.STORAGE_KEY)) || {}; } catch (e) {}
    this.platform = platforms[stored.platform] ? stored.platform : Object.keys(platforms)[0];
    this.sort = EmularityCollection.SORTS[stored.sort] ? stored.sort : 'added-desc';
    this.prefs = { muted: !!stored.muted, theater: !!stored.theater };
    this.x86Seeded = stored.x86Seeded;
    AudioMute.set(this.prefs.muted);

    let changed = false;
    for (let record of stored.items || []) {
      let item = CollectionItem.fromRecord(record);
      if (!item) continue;
      changed = item.normalize() || changed;
      this.adopt(item);
    }
    // One-time x86 starter content. Seeded only if the user has never had any x86
    // items, and remembered so removing them sticks.
    if (!this.x86Seeded && !this.items.some(i => i.record.platform == 'x86')) {
      X86Item.starterRecords().forEach(r => this.adopt(CollectionItem.fromRecord(r)));
      this.x86Seeded = changed = true;
    }
    if (changed) this.save();

    // Close any open card menu when clicking elsewhere
    document.addEventListener('click', () => this.closeMenus());
    this.addEventListener('shownetwork', () => this.showNetwork());
    window.addEventListener('hashchange', () => this.renderRoute());
    if (!location.hash) history.replaceState(null, '', '#' + this.platform);
    this.renderRoute();
    this.fetchMissingRatings();
    this.fetchMissingSizes();
  }

  /* ----- Items ----- */

  adopt(item) {
    item.addEventListener('itemchange', () => { this.save(); this.renderGrid(); });
    item.addEventListener('itemedit', () => this.editDialog.open(item));
    item.addEventListener('iteminstance', () => this.instanceDialog.open(item));
    item.addEventListener('itemremove', () => this.dropItem(item));
    item.addEventListener('menuopen', () => this.closeMenus());
    this.items.push(item);
    return item;
  }
  /* Add a new item from a record (as built by the add dialog) */
  addItem(record) {
    let item = CollectionItem.fromRecord(Object.assign(record, { id: 'sw-' + Date.now() + '-' + this.items.length, added: Date.now() }));
    this.adopt(item);
    this.save();
    this.renderGrid();
    return item;
  }
  /* Another instance of an item: the same software, its own id, so its own saves (and
     for machines, its own disk changes and network name). Numbered after its title. */
  /* The next free numbered title for an instance of an item */
  instanceTitle(item) {
    let base = item.record.title.replace(/ \d+$/, '');
    let taken = new Set(this.items.map(i => i.record.title));
    let n = 2;
    while (taken.has(base + ' ' + n)) n++;
    return base + ' ' + n;
  }
  /* Options: title, and diskSize to give it a bigger hard disk (see X86Item) */
  async newInstance(item, { title, diskSize } = {}) {
    let disk = null;
    if (diskSize) {
      // Can take a while (the whole disk is read): progress shows on the original's card
      try { disk = await item.buildDisk(diskSize, item.progress('Building a ' + Format.bytes(diskSize) + ' disk')); }
      catch (e) {
        console.error(e);
        alert('Failed to build the new hard disk: ' + e.message);
        item.render();
        return null;
      }
      item.render();
    }
    let record = structuredClone(item.record);
    for (let key of ['id', 'added', 'lastPlayed', 'cached', 'cloned', 'diskName', 'installed', 'installDir', 'hostname']) delete record[key];
    record.title = title || this.instanceTitle(item);
    if (disk) record.disk = disk;
    // Uploaded disks are stored by id: give the copy its own
    let copies = [], inserted = { ...(record.inserted || {}) };
    for (let disk of record.media || []) {
      if (!disk.upload) continue;
      let id = 'disk-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
      for (let d in inserted) if (inserted[d] == disk.id) inserted[d] = id;
      copies.push([disk.id, id]);
      disk.id = id;
    }
    record.inserted = inserted;
    for (let [from, to] of copies) {
      try { await LocalStore.uploadPut(to, await LocalStore.uploadGet(from)); } catch (e) { console.error(e); }
    }
    let copy = this.addItem(record);
    if (record.source == 'upload') {
      // Uploads are stored per item
      try { await LocalStore.uploadPut(copy.record.id, await LocalStore.uploadGet(item.record.id)); }
      catch (e) { console.error(e); alert('Failed to copy the uploaded file: ' + e.message); }
    }
    return copy;
  }
  dropItem(item) {
    this.items = this.items.filter(i => i != item);
    // A built hard disk goes with the last instance using it
    let disk = item.record.disk;
    if (disk && !this.items.some(i => i.record.disk && i.record.disk.template == disk.template)) {
      LocalStore.uploadDelete(disk.template).catch(e => console.error(e));
    }
    item.remove();
    this.save();
    this.renderGrid();
  }
  closeMenus() {
    this.items.forEach(i => i.closeMenu());
  }
  save() {
    try {
      localStorage.setItem(EmularityCollection.STORAGE_KEY, JSON.stringify({
        platform: this.platform, sort: this.sort, muted: this.prefs.muted, theater: this.prefs.theater,
        x86Seeded: this.x86Seeded, items: this.items.map(i => i.record),
      }));
    } catch (e) {
      console.error('Failed to save collection', e);
    }
  }
  /* Look up archive.org ratings for archive-sourced items that don't have one yet */
  async fetchMissingRatings() {
    let pending = this.items.filter(i => i.record.rating === undefined && i.archiveId);
    if (!pending.length) return;
    let ratings = {};
    try { ratings = await ArchiveOrg.ratings(pending.map(i => i.archiveId)); }
    catch (e) { console.error('Failed to fetch ratings', e); } // rate as 0 rather than retry endlessly
    pending.forEach(i => { i.record.rating = ratings[i.archiveId] ?? 0; });
    this.save();
    this.renderGrid();
  }
  async fetchMissingSizes() {
    for (let item of this.items) await item.fetchSize();
  }

  /* ----- Library ----- */

  renderRoute() {
    let hash = decodeURIComponent(location.hash.replace(/^#/, ''));
    let slash = hash.indexOf('/');
    let head = slash >= 0 ? hash.slice(0, slash) : hash;
    let rest = slash >= 0 ? hash.slice(slash + 1) : '';

    if (head == 'play' && rest) {
      let item = this.items.find(i => i.record.id == rest);
      if (item) {
        if (!this.playing) this.play(item);
        return;
      }
      // unknown id falls through to the library
    }
    // Leaving a running emulator requires a reload (emscripten runtimes don't tear down
    // cleanly); the hash is already updated, so the library renders after the reload.
    if (this.playing) {
      if (this.player) this.player.leaving = true; // not a stray close: no prompt
      location.reload();
      return;
    }
    if (CollectionItem.platforms[head]) this.platform = head;
    if (!this.querySelector('.platform-tabs')) this.render();
    this.renderTabs();
    this.renderGrid();
    this.save();
  }
  render() {
    this.innerHTML = `
      <header>
        <button class="network-button" title="Show the machines on the local network">🖧 Network</button>
        <img src="../logos/emularity-transparent.png" alt="Emularity">
        <p>Your personal software collection. Pick a platform, add software, click to play.</p>
      </header>
      <div class="platform-tabs"></div>
      <div class="sort-bar"><label>Sort by <select class="sort-select"></select></label></div>
      <div class="game-grid"></div>
      <p class="empty-note" style="display: none">No software installed for this platform yet. Click "Add software" to get started.</p>
      <emularity-add-dialog></emularity-add-dialog>
      <emularity-edit-dialog></emularity-edit-dialog>
      <emularity-instance-dialog></emularity-instance-dialog>`;
    this.instanceDialog = this.querySelector('emularity-instance-dialog');
    this.instanceDialog.collection = this;
    this.addDialog = this.querySelector('emularity-add-dialog');
    this.addDialog.collection = this;
    this.querySelector('.network-button').addEventListener('click', () => this.showNetwork());
    this.editDialog = this.querySelector('emularity-edit-dialog');

    let sel = this.querySelector('.sort-select');
    for (let key in EmularityCollection.SORTS) {
      let opt = document.createElement('option');
      opt.value = key;
      opt.textContent = EmularityCollection.SORTS[key].label;
      sel.appendChild(opt);
    }
    sel.addEventListener('change', () => { this.sort = sel.value; this.save(); this.renderGrid(); });

    this.addCard = document.createElement('div');
    this.addCard.className = 'game-card add-card';
    this.addCard.textContent = '+ Add software';
    this.addCard.addEventListener('click', () => this.addDialog.open(CollectionItem.platforms[this.platform]));
  }
  renderTabs() {
    let tabs = this.querySelector('.platform-tabs');
    tabs.innerHTML = '';
    for (let [key, platform] of Object.entries(CollectionItem.platforms)) {
      let btn = document.createElement('button');
      btn.innerHTML = '<span class="label"></span><span class="sublabel"></span>';
      btn.querySelector('.label').textContent = platform.label;
      btn.querySelector('.sublabel').textContent = platform.sublabel;
      if (key == this.platform) btn.classList.add('active');
      btn.addEventListener('click', () => { location.hash = key; });
      tabs.appendChild(btn);
    }
  }
  /* Show the current platform's items, sorted. Items are long-lived elements, so this
     only reorders them; nothing is rebuilt. */
  renderGrid() {
    let grid = this.querySelector('.game-grid');
    if (this.playing || !grid) return;
    let cmp = (EmularityCollection.SORTS[this.sort] || EmularityCollection.SORTS['added-desc']).cmp;
    let items = this.items.filter(i => i.record.platform == this.platform).sort((a, b) => cmp(a.record, b.record));
    grid.replaceChildren(...items, this.addCard);
    this.querySelector('.sort-select').value = this.sort;
    this.querySelector('.empty-note').style.display = items.length ? 'none' : 'block';
    this.querySelector('.sort-bar').style.display = items.length ? '' : 'none';
  }

  /* The virtual LAN's machines, live, in a dialog. The panel only watches the LAN
     while it's showing. */
  showNetwork() {
    let dialog = document.createElement('dialog');
    dialog.className = 'network-dialog';
    dialog.innerHTML = `
      <button class="close-dialog" title="Close">✕</button>
      <h3>Local network</h3>
      <p class="field-hint">Machines running in this browser with networking enabled, in any tab. They can reach each other by name, e.g. <code>ping name.lan</code>.</p>
      <emularity-lan-panel></emularity-lan-panel>`;
    let uplink = this.getAttribute('uplink');
    if (uplink) dialog.querySelector('emularity-lan-panel').setAttribute('uplink', uplink);
    dialog.querySelector('.close-dialog').addEventListener('click', () => dialog.close());
    dialog.addEventListener('close', () => dialog.remove());
    this.appendChild(dialog);
    dialog.showModal();
  }

  /* ----- Playing ----- */

  async play(item) {
    this.playing = true;
    this.platform = item.record.platform;
    item.update({ lastPlayed: Date.now() });
    let player = this.player = document.createElement('emularity-collection-player');
    player.prefs = this.prefs;
    player.addEventListener('prefschange', () => this.save());
    try {
      await player.load(item);
    } catch (e) {
      console.error(e);
      alert(e.message);
      this.playing = false;
      history.replaceState(null, '', '#' + item.record.platform);
      this.renderRoute();
      return;
    }
    this.classList.add('playing');
    this.replaceChildren(player);
  }
}
customElements.define('emularity-collection', EmularityCollection);
    </script>
  </body>
</html>
