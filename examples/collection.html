<html>
  <head>
    <title>Emularity v2 - My Collection</title>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, maximum-scale=1.0, width=device-width" />

    <script src="../vendor/browserfs.js"></script>
    <script type="module" src="../src/emularity.js"></script>

    <link rel="stylesheet" href="../css/emularity.css">
    <style>
      body {
        margin: 0;
        background: #000;
        color: #ddd;
        font-family: sans-serif;
      }
      emularity-collection {
        display: block;
        max-width: 900px;
        margin: 0 auto;
        padding: 1em;
      }
      emularity-collection header {
        text-align: center;
        padding: 1em 0;
      }
      emularity-collection header img {
        max-width: 300px;
        width: 60%;
      }
      emularity-collection header p {
        color: #999;
        margin: .5em 0 0;
      }
      .platform-tabs {
        display: flex;
        justify-content: center;
        gap: .5em;
        margin: 1em 0;
      }
      .platform-tabs button {
        background: #111;
        color: #ddd;
        border: 1px solid #333;
        border-radius: 8px;
        padding: .6em 1.2em;
        font-size: 1em;
        cursor: pointer;
      }
      .platform-tabs button .sublabel {
        display: block;
        font-size: .7em;
        color: #777;
      }
      .platform-tabs button:hover {
        border-color: #49c8d7;
      }
      .platform-tabs button.active {
        border-color: #49c8d7;
        color: #49c8d7;
        background: #0c1c1f;
      }
      .sort-bar {
        display: flex;
        justify-content: flex-end;
        margin-top: 1em;
        font-size: .85em;
        color: #999;
      }
      .sort-bar select {
        margin-left: .4em;
        background: #111;
        color: #ddd;
        border: 1px solid #333;
        border-radius: 6px;
        padding: .3em .5em;
        font-size: 1em;
        cursor: pointer;
      }
      .game-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: .75em;
        margin: 1em 0;
      }
      .game-card {
        position: relative;
        display: flex;
        align-items: center;
        gap: 1em;
        background: #111;
        border: 1px solid #333;
        border-radius: 8px;
        padding: .6em;
        cursor: pointer;
        min-height: 5.5em;
        box-sizing: border-box;
      }
      .game-card .game-thumb {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 4px;
        background: #222;
        flex-shrink: 0;
      }
      .game-card .game-info {
        flex: 1;
        min-width: 0;
        padding-right: 1.5em;
      }
      .game-card .game-lastplayed {
        display: block;
        font-size: .78em;
        color: #667;
        margin-top: .4em;
      }
      .game-card .game-storage {
        display: block;
        font-size: .75em;
        color: #49c8d7;
        margin-top: .25em;
      }
      .game-card .game-storage:empty {
        display: none;
      }
      .game-card.busy .game-storage {
        color: #49c8d7;
      }
      .game-card .game-progress {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 4px;
        background: #222;
        border-radius: 0 0 8px 8px;
        overflow: hidden;
      }
      .game-card.busy .game-progress {
        display: block;
      }
      .game-card .game-progress-fill {
        width: 100%;
        height: 100%;
        background: #49c8d7;
        transform: scaleX(0);
        transform-origin: left;
        /* No transition: we step scaleX ourselves (deduped to whole-percent changes).
           A transition would restart a compositor animation on every step and force a
           style-recalc/pre-paint/commit cycle each frame for no visible benefit. */
        will-change: transform;
      }
      .game-card .game-menu {
        position: absolute;
        top: .3em;
        right: .4em;
        width: 1.6em;
        height: 1.6em;
        line-height: 1;
        color: #888;
        background: none;
        border: none;
        border-radius: 4px;
        font-size: 1.1em;
        cursor: pointer;
      }
      .game-card .game-menu:hover {
        color: #ddd;
        background: #222;
      }
      .game-card .game-menu-popup {
        display: none;
        position: absolute;
        top: 2em;
        right: .4em;
        z-index: 5;
        background: #1a1a1a;
        border: 1px solid #444;
        border-radius: 6px;
        padding: .25em;
        box-shadow: 0 4px 12px rgba(0,0,0,.5);
        min-width: 12em;
      }
      .game-card .game-menu-popup.open {
        display: block;
      }
      .game-card .game-menu-popup button {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        color: #ddd;
        padding: .5em .6em;
        border-radius: 4px;
        font-size: .85em;
        cursor: pointer;
      }
      .game-card .game-menu-popup button:hover {
        background: #262c2d;
      }
      .game-card .game-menu-popup .menu-delete:hover {
        color: #f66;
      }
      .game-card:hover {
        border-color: #49c8d7;
        background: #161c1d;
      }
      .game-card .game-title {
        display: block;
        font-weight: bold;
        color: #fff;
        margin-bottom: .35em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .game-card .game-detail {
        display: block;
        font-size: .8em;
        color: #888;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .game-card.add-card {
        border-style: dashed;
        border-color: #555;
        color: #999;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .game-card.add-card:hover {
        border-color: #49c8d7;
        color: #ccc;
      }
      .empty-note {
        text-align: center;
        color: #777;
        margin: 1em;
      }
      dialog {
        background: #111;
        color: #ddd;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 1.5em;
        width: 480px;
        max-width: 90vw;
      }
      dialog.network-dialog {
        width: 760px;
      }
      /* The files dialog: the drive's tree on the left, the chosen file on the right */
      dialog.files-dialog {
        width: min(1400px, 96vw);
        max-width: 96vw;
        height: 92vh;
        max-height: 92vh;
        box-sizing: border-box;
        padding: 1em 1.2em;
        flex-direction: column;
      }
      dialog.files-dialog[open] { display: flex; }
      dialog.files-dialog h3 { margin: 0 2em .2em 0; }
      dialog.files-dialog > .field-hint { margin: 0 0 .6em; }
      dialog.files-dialog input[hidden] { display: none; }
      dialog.files-dialog button.small {
        background: none;
        border: 1px solid #444;
        border-radius: 4px;
        color: #ddd;
        padding: .2em .55em;
        cursor: pointer;
        font-size: .85em;
      }
      dialog.files-dialog button.small:hover { border-color: #49c8d7; color: #49c8d7; }
      .files-main { flex: 1; display: flex; gap: .8em; min-height: 0; }
      .files-side { flex: 0 0 32%; min-width: 15em; display: flex; flex-direction: column; min-height: 0; }
      .files-bar { display: flex; flex-wrap: wrap; gap: .4em; align-items: center; margin-bottom: .4em; }
      dialog.files-dialog .files-bar input[type="search"] { flex: 1 1 8em; width: auto; margin: 0; }
      dialog.files-dialog .files-bar label { display: inline-flex; gap: .3em; align-items: center; margin: 0; font-size: .85em; white-space: nowrap; }
      .files-summary { margin: 0 0 .4em; font-size: .85em; color: #aaa; }
      .files-tree {
        flex: 1;
        overflow: auto;
        border: 1px solid #333;
        border-radius: 6px;
        background: #0b0b0b;
        font-family: ui-monospace, Consolas, 'DejaVu Sans Mono', monospace;
        font-size: 12.5px;
        outline: none;
        padding: .2em 0;
      }
      .files-tree:focus-visible { border-color: #49c8d7; }
      .ft-row { display: flex; align-items: baseline; gap: .3em; padding: .1em .6em .1em 0; cursor: pointer; white-space: nowrap; }
      .ft-row:hover { background: #1a1a1a; }
      .ft-row.ft-selected { background: #1d3a57; }
      .ft-twisty { flex: none; width: 1em; text-align: center; color: #777; }
      .ft-name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
      .ft-dir > .ft-name::after { content: '\\'; color: #555; }
      .ft-badge { flex: none; font-size: .85em; color: #e8b86b; }
      .ft-size { flex: none; color: #555; font-size: .9em; }
      /* The original's files are quiet; what the software changed stands out */
      .ft-base .ft-name { color: #7c7c7c; }
      .ft-base.ft-dir .ft-name { color: #a8a8a8; }
      .ft-changed .ft-name { color: #ffc65c; font-weight: bold; }
      .ft-base.ft-haschanges .ft-name { color: #ffc65c; }
      .ft-added .ft-name, .ft-written .ft-name { color: #6fdc6f; font-weight: bold; }
      .ft-deleted .ft-name { color: #ff6b6b; text-decoration: line-through; font-weight: bold; }
      .ft-hidden .ft-name { color: #b55; text-decoration: line-through; }
      .ft-tag { flex: none; font-size: .75em; padding: 0 .4em; border-radius: 3px; text-transform: uppercase; letter-spacing: .03em; }
      .ft-changed .ft-tag { background: #4a3a10; color: #ffc65c; }
      .ft-added .ft-tag, .ft-written .ft-tag { background: #173d17; color: #6fdc6f; }
      .ft-deleted .ft-tag, .ft-hidden .ft-tag { background: #4a1a1a; color: #ff6b6b; }
      .files-legend { display: flex; flex-wrap: wrap; gap: .3em .9em; font-size: .8em; color: #888; margin-top: .4em; }
      .files-legend span::before { content: '■ '; }
      .files-legend .lg-base::before { color: #7c7c7c; }
      .files-legend .lg-changed::before { color: #ffc65c; }
      .files-legend .lg-added::before { color: #6fdc6f; }
      .files-legend .lg-deleted::before { color: #ff6b6b; }
      dialog.files-dialog details { margin-top: .4em; font-size: .85em; }
      dialog.files-dialog details pre { max-height: 10em; overflow: auto; background: #0a0a0a; padding: .5em; font-size: .9em; margin: .3em 0 0; }
      .files-detail { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      .files-detail-head { display: flex; flex-wrap: wrap; align-items: center; gap: .4em .7em; margin-bottom: .4em; }
      .files-path { font-family: ui-monospace, Consolas, monospace; font-size: 1.05em; word-break: break-all; }
      .files-status { font-size: .85em; }
      .files-actions { display: flex; flex-wrap: wrap; gap: .3em; margin-left: auto; }
      .files-note { margin: 0 0 .5em; font-size: .85em; color: #aaa; }
      .files-note:empty { display: none; }
      .files-empty[hidden] { display: none; }
      .files-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: #666; text-align: center; padding: 1em; }
      .files-detail emularity-hex-editor { flex: 1; }
      @media (max-width: 800px) {
        dialog.files-dialog { padding: .8em; }
        .files-main { flex-direction: column; }
        .files-side { flex: 0 0 38%; min-width: 0; }
      }
      emularity-collection header {
        position: relative;
      }
      emularity-collection header .network-button {
        position: absolute;
        top: 1em;
        right: 0;
        background: #1a1a1a;
        color: #ccc;
        border: 1px solid #333;
        border-radius: 6px;
        padding: .4em .8em;
        cursor: pointer;
      }
      emularity-collection header .network-button:hover {
        border-color: #5ab8c8;
        color: #fff;
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, .7);
      }
      dialog h3 {
        margin-top: 0;
        color: #fff;
      }
      dialog .close-dialog {
        position: absolute;
        top: .75em;
        right: .75em;
        background: none;
        border: none;
        color: #888;
        font-size: 1.2em;
        cursor: pointer;
      }
      .add-tabs {
        display: flex;
        gap: .25em;
        border-bottom: 1px solid #333;
        margin-bottom: 1em;
      }
      .add-tabs .source-tabs {
        display: contents; /* its buttons are tabs like the rest */
      }
      .add-tabs button {
        background: none;
        border: none;
        color: #999;
        padding: .5em .75em;
        font-size: .9em;
        cursor: pointer;
        border-bottom: 2px solid transparent;
      }
      .add-tabs button.active {
        color: #49c8d7;
        border-bottom-color: #49c8d7;
      }
      dialog .system-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(10em, 1fr));
        column-gap: 1em;
      }
      dialog .system-grid label { margin: .5em 0; }
      dialog label.check { display: flex; gap: .5em; align-items: baseline; }
      dialog label.check .field-hint { display: inline; }
      dialog label {
        display: block;
        margin: .75em 0;
        font-size: .9em;
        color: #aaa;
      }
      dialog input[type="text"], dialog input[type="url"], dialog input[type="file"], dialog input[type="search"], dialog select {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin-top: .25em;
        background: #000;
        color: #ddd;
        border: 1px solid #444;
        border-radius: 4px;
        padding: .5em;
        font-size: 1em;
      }
      dialog .field-hint {
        font-size: .8em;
        color: #666;
        margin: .25em 0 0;
      }
      dialog .primary {
        background: #0c1c1f;
        color: #49c8d7;
        border: 1px solid #49c8d7;
        border-radius: 6px;
        padding: .5em 1.25em;
        font-size: 1em;
        cursor: pointer;
        margin-top: .5em;
      }
      dialog .primary:hover {
        background: #12292d;
      }
      dialog .secondary {
        background: none;
        color: #aaa;
        border: 1px solid #444;
        border-radius: 6px;
        padding: .5em 1.25em;
        font-size: 1em;
        cursor: pointer;
        margin: .5em 0 0 .5em;
      }
      dialog .secondary:hover { color: #ddd; border-color: #666; }
      dialog .error-note {
        color: #f66;
        font-size: .85em;
        margin: .5em 0 0;
        min-height: 1.2em;
      }
      .search-row {
        display: flex;
        align-items: center;
        gap: .5em;
      }
      .search-row input {
        flex: 1;
      }
      .search-filter {
        font-family: monospace;
        font-size: .75em;
        color: #3a8a94;
        border: 1px solid #1e4a50;
        border-radius: 999px;
        padding: .2em .7em;
        white-space: nowrap;
        cursor: default;
      }
      .search-results.loading {
        opacity: .5;
      }
      .search-results {
        max-height: 40vh;
        overflow-y: auto;
        margin-top: .75em;
      }
      .search-more {
        text-align: center;
        padding: .6em;
        font-size: .8em;
        color: #777;
      }
      .search-result {
        display: flex;
        align-items: center;
        gap: .75em;
        padding: .5em;
        border-bottom: 1px solid #222;
        cursor: pointer;
      }
      .search-result.added .result-title::after {
        content: '  ✓ Added';
        color: #5ab8c8;
        font-weight: normal;
      }
      dialog .added-note {
        color: #5ab8c8;
        font-size: .85em;
        margin: .5em 0 0;
      }
      dialog .added-note:empty {
        display: none;
      }
      .search-result:hover {
        background: #161c1d;
      }
      .search-result > div {
        min-width: 0; /* long identifiers wrap instead of widening the list */
        overflow-wrap: anywhere;
      }
      .search-result img {
        width: 48px;
        height: 48px;
        object-fit: cover;
        border-radius: 4px;
        background: #222;
        flex-shrink: 0;
      }
      .search-result .result-title {
        color: #fff;
        font-size: .9em;
      }
      .search-result .result-detail {
        color: #777;
        font-size: .75em;
      }
      /* While playing, let the player view span the full screen so the bar can
         anchor to the top edge instead of the centered library column. */
      emularity-collection.playing {
        max-width: none;
        margin: 0;
        padding: 0;
      }
      .player-bar {
        position: sticky;
        top: 0;
        z-index: 40; /* stay above the powered-off overlay so Back remains usable */
        display: flex;
        align-items: center;
        gap: 1em;
        padding: .6em 1.2em;
        background: #141414;
        border-bottom: 1px solid #333;
        box-shadow: 0 3px 14px rgba(0, 0, 0, .6);
      }
      .player-bar + .emularity-emulator {
        margin-top: 1.5em;
      }
      .player-bar button {
        background: none;
        border: 1px solid #444;
        border-radius: 6px;
        color: #ddd;
        padding: .4em .9em;
        cursor: pointer;
      }
      .player-bar button:hover {
        border-color: #49c8d7;
        color: #49c8d7;
      }
      .player-bar .player-title {
        color: #fff;
        font-weight: bold;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .player-bar .pb-timer {
        flex: none;
        color: #aaa;
        font-size: .95em;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }
      .player-bar .pb-controls {
        flex: none;
        margin-left: auto;
        display: flex;
        gap: .4em;
      }
      .player-bar .pb-controls button {
        min-width: 2.4em;
        padding: .35em .5em;
        font-size: 1em;
        line-height: 1;
      }
      .player-bar .pb-graphs {
        align-self: center;
        margin-right: .9em;
      }
      @media (max-width: 1100px) {
        .player-bar .pb-graphs { display: none; }
      }
      .player-bar .pb-lights {
        margin-right: .6em;
        font-size: 1.05em;
      }
      .player-bar .pb-lights button.al-device {
        min-width: 0;
        padding: .2em .3em;
        margin: 0 -.3em;
        font-size: 1em;
        background: none;
        border-color: transparent;
      }
      .player-bar .pb-lights button.al-device:hover, .player-bar .pb-lights button.al-device.al-open {
        border-color: #555;
        background: #ffffff10;
      }
      .player-bar .pb-media-wrap, .player-bar .pb-keys-wrap {
        position: relative;
      }
      .player-bar .pb-media-wrap {
        display: flex;
        align-items: center;
      }
      .player-bar .pb-media-popup .pbk-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: .2em;
        padding: 0 .3em .3em;
      }
      .player-bar .pb-media-popup .pbk-grid button {
        text-align: center;
        padding: .45em .2em;
      }
      .player-bar .pb-media-popup .pbk-mods {
        grid-template-columns: repeat(4, 1fr);
      }
      .player-bar .pb-media-popup .pbk-mods button.active {
        background: #0c1c1f;
        color: #49c8d7;
        outline: 1px solid #49c8d7;
      }
      .player-bar .pb-media-popup {
        position: absolute;
        top: calc(100% + .4em);
        right: 0;
        z-index: 50;
        min-width: 16em;
        max-width: min(24em, 90vw);
        background: #1a1a1a;
        border: 1px solid #444;
        border-radius: 6px;
        padding: .35em;
        box-shadow: 0 4px 12px rgba(0,0,0,.5);
      }
      .player-bar .pb-media-popup .pbm-drive + .pbm-drive {
        border-top: 1px solid #333;
        margin-top: .3em;
        padding-top: .3em;
      }
      .player-bar .pb-media-popup .pbm-head {
        padding: .35em .6em;
        font-size: .85em;
        color: #aaa;
        overflow-wrap: anywhere;
      }
      .player-bar .pb-media-popup .pbm-head b {
        color: #ddd;
      }
      .player-bar .pb-media-popup button {
        display: block;
        width: 100%;
        min-width: 0;
        text-align: left;
        border: none;
        padding: .45em .6em;
        font-size: .85em;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }
      .player-bar .pb-media-popup button:hover:not(:disabled) {
        background: #262c2d;
      }
      .player-bar .pb-media-popup button:disabled {
        color: #49c8d7;
        cursor: default;
      }
      .player-bar .pb-media-popup .pbm-later {
        color: #888;
      }
      .player-bar .pb-media-popup .pbm-hint {
        margin: .4em .6em .2em;
        font-size: .8em;
        color: #888;
      }
      .player-bar .pb-media-popup .pbm-note {
        margin: .3em .6em;
        font-size: .85em;
        color: #e8b86b;
      }
      dialog fieldset {
        border: 1px solid #333;
        border-radius: 6px;
        margin: .8em 0;
        padding: .6em .8em;
      }
      dialog legend {
        color: #aaa;
        padding: 0 .3em;
      }
      dialog .disk-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: .4em;
        margin-bottom: .4em;
      }
      dialog .disk-row .disk-name {
        flex: 1 1 10em;
        min-width: 0;
        margin: 0;
      }
      dialog .disk-row select {
        width: auto;
        margin: 0;
      }
      dialog .disk-row label {
        display: inline-flex;
        align-items: center;
        gap: .3em;
        margin: 0;
        font-size: .85em;
        white-space: nowrap;
      }
      dialog .disk-row .disk-remove, dialog .disk-add button {
        background: none;
        border: 1px solid #444;
        border-radius: 4px;
        color: #ddd;
        padding: .3em .6em;
        cursor: pointer;
      }
      dialog .disk-row .disk-remove:hover {
