    // make goes in the drive, and the rest are kept with the title's disks)
    fileInput.addEventListener('change', () => {
      let picked = [...fileInput.files], drive = fileDrive;
      fileInput.value = '';
      if (!picked.length || !drive) return;
      run('Adding ' + picked[0].name, async () => {
        let disks = await CollectionItem.groupFiles(picked), first;
        for (let d of disks) {
          let disk = await item.addDisk({ ...d, drive: drive.id });
          first ||= disk;
        }
        render();
        await insert(drive, first);
      });
    });

    folderInput.addEventListener('change', () => {
      let drive = fileDrive;
      if (!folderInput.files.length || !drive) return;
      let folder = CollectionItem.folderDisk(folderInput.files);
      folderInput.value = '';
      run('Adding ' + folder.name, async () => {
        let disk = await item.addDisk({ ...folder, drive: drive.id });
        render();
        await insert(drive, disk);
      });
    });

    let render = () => {
      let rows = [];
      for (let drive of emu.mediaDrives.filter(d => d.id == open)) {
        let section = document.createElement('div');
        section.className = 'pbm-drive';
        let head = document.createElement('div');
        head.className = 'pbm-head';
        head.innerHTML = `<b></b> <span></span>`;
        head.querySelector('b').textContent = drive.label;
        head.querySelector('span').textContent = drive.current ? drive.current.name : 'empty';
        section.append(head);
        let fits = item.disks.filter(d => item.diskFits(d, drive.id));
        for (let disk of fits) {
          let current = drive.current && drive.current.id == disk.id;
          let b = document.createElement('button');
          b.textContent = (current ? '● ' : '○ ') + disk.name;
          b.disabled = current;
          let elsewhere = emu.mediaDrives.find(d => d.id != drive.id && d.current && d.current.id == disk.id);
          if (elsewhere && !drive.disks) { b.textContent += ` (move from ${elsewhere.label})`; b.classList.add('pbm-later'); }
          // DOSBox can only swap among disks mounted at power on
          if (drive.disks && !drive.disks.includes(disk.id)) { b.textContent += ' (after restart)'; b.classList.add('pbm-later'); }
          b.addEventListener('click', () => insert(drive, disk));
          section.append(b);
        }
        if (drive.current && drive.canEject !== false) {
          let b = document.createElement('button');
          b.textContent = '⏏ Eject';
          b.addEventListener('click', () => run('Ejecting', () => emu.ejectMedia(drive.id)));
          section.append(b);
        }
        let add = document.createElement('button');
        add.textContent = '＋ Insert a file…';
        add.addEventListener('click', () => {
          fileDrive = drive;
          fileInput.accept = item.constructor.mediaAccept[drive.kind] || '';
          fileInput.click();
        });
        let addFolder = document.createElement('button');
        addFolder.textContent = '＋ Insert a folder…';
        addFolder.addEventListener('click', () => {
          fileDrive = drive;
          folderInput.click();
        });
        section.append(add, addFolder);
        rows.push(section);
      }
      // DOSBox swaps every multi-disk drive at once
      let together = emu.mediaDrives.filter(d => d.disks && d.disks.length > 1);
      if (together.length > 1 && together.some(d => d.id == open)) {
        let p = document.createElement('p');
        p.className = 'pbm-hint';
        p.textContent = `Changing disks also changes ${together.map(d => d.label).join(' and ')} together — DOSBox swaps every drive at once.`;
        rows.push(p);
      }
      if (note) {
        let p = document.createElement('p');
        p.className = 'pbm-note';
        p.textContent = note;
        rows.push(p);
      }
      popup.replaceChildren(...rows);
    };
    let close = () => {
      popup.hidden = true;
      open = null;
      for (let el of lights.querySelectorAll('.al-open')) el.classList.remove('al-open');
    };
    lights.addEventListener('driveclick', ev => {
      let { drive, element } = ev.detail;
      if (open == drive) { close(); return; }
      close();
      open = drive;
      note = '';
      element.classList.add('al-open');
      popup.hidden = false;
      render();
      // Under the drive's light, kept on screen
      popup.style.right = 'auto';
      let at = element.getBoundingClientRect(), box = wrap.getBoundingClientRect();
      let left = Math.min(at.left, innerWidth - 8 - popup.offsetWidth);
      popup.style.left = Math.max(8, left) - box.left + 'px';
    });
    popup.addEventListener('click', ev => ev.stopPropagation());
    document.addEventListener('click', ev => { if (!lights.contains(ev.target)) close(); });
  }

  /* The ⌨ menu: key combinations the host OS or browser would catch, sent to the machine
     (for emulators with sendKeys) */
  static KEY_COMBOS = [
    ['Ctrl+Alt+Del', ['Ctrl', 'Alt', 'Delete']],
    ['Ctrl+Shift+Esc (Task Manager)', ['Ctrl', 'Shift', 'Esc']],
    ['Ctrl+Esc (Start menu)', ['Ctrl', 'Esc']],
    ['Windows key', ['Win']],
    ['Win+R (Run)', ['Win', 'R']],
    ['Alt+Tab', ['Alt', 'Tab']],
    ['Alt+F4', ['Alt', 'F4']],
    ['Ctrl+W', ['Ctrl', 'W']],
    ['Esc', ['Esc']],
  ];
  setUpKeysMenu(bar) {
    let emu = this.emu, wrap = bar.querySelector('.pb-keys-wrap');
    if (typeof emu.sendKeys != 'function') { wrap.remove(); return; }
    let button = wrap.querySelector('.pb-keys'), popup = wrap.querySelector('.pb-keys-popup');
    let close = () => { popup.hidden = true; button.classList.toggle('active', !!(emu.heldKeys && emu.heldKeys.length)); };
    let act = fn => () => { fn(); close(); emu.focusScreen(); };
    let head = text => Object.assign(document.createElement('div'), { className: 'pbm-head', textContent: text });
    let key = (label, fn, title) => {
      let b = document.createElement('button');
      b.textContent = label;
      if (title) b.title = title;
      b.addEventListener('click', act(fn));
      return b;
    };
    let grid = (cls, buttons) => { let g = document.createElement('div'); g.className = 'pbk-grid ' + cls; g.append(...buttons); return g; };
    // Modifiers leave the menu open, for the key that goes with them (Ctrl, Alt, then F1)
    let mods = ['Ctrl', 'Alt', 'Shift', 'Win'].map(m => {
      let b = document.createElement('button');
      b.textContent = m;
      b.title = `Hold ${m} down until the next key you press`;
      b.dataset.mod = m;
      b.addEventListener('click', () => emu.holdKey(m));
      return b;
    });
    popup.append(
      ...CollectionPlayer.KEY_COMBOS.map(([label, keys]) => key(label, () => emu.sendKeys(keys))),
      head('Hold down until your next key'),
      grid('pbk-mods', mods),
      head('Function keys'),
      grid('', Array.from({ length: 12 }, (_, i) => key('F' + (i + 1), () => emu.sendKeys(['F' + (i + 1)])))));
    // While modifiers are held, the button says which
    emu.addEventListener('heldkeyschange', ev => {
      let held = ev.detail;
      mods.forEach(b => b.classList.toggle('active', held.includes(b.dataset.mod)));
      button.textContent = held.length ? '⌨ ' + held.join('+') + '+' : '⌨';
      button.classList.toggle('active', !!held.length || !popup.hidden);
    });
    button.addEventListener('click', ev => {
      ev.stopPropagation();
      popup.hidden = !popup.hidden;
      button.classList.toggle('active', !popup.hidden || !!(emu.heldKeys && emu.heldKeys.length));
    });
    popup.addEventListener('click', ev => ev.stopPropagation());
    document.addEventListener('click', close);
  }

  /* `how` is the emulator's exit detail: { shutdown } when an operating system shut the
     machine down */
  showPoweredOff(how = {}) {
    if (this.poweredOff) return;
    this.poweredOff = true;
    clearInterval(this.timer);
    // Give the mouse and keyboard back (leaving fullscreen releases the keyboard lock)
    if (document.pointerLockElement) { try { document.exitPointerLock(); } catch (e) {} }
    if (document.fullscreenElement) { try { document.exitFullscreen(); } catch (e) {} }
    let overlay = document.createElement('div');
    overlay.className = 'powered-off';
    overlay.innerHTML = `
      <div class="po-title"></div>
      <p class="po-sub">The game has powered off.</p>
      <button class="po-power" title="Power on">⏻</button>
      <span class="po-label">Power on</span>`;
    overlay.querySelector('.po-title').textContent = this.item.record.title;
    if (how.shutdown) overlay.querySelector('.po-sub').textContent = 'The machine has shut down.';
    let powerOn = async () => {
      await this.item.beforeLaunch(); // e.g. re-grant folder access within this gesture
      this.leaving = true;
      location.reload();
    };
    overlay.querySelector('.po-power').addEventListener('click', powerOn);
    overlay.querySelector('.po-label').addEventListener('click', powerOn);
    this.appendChild(overlay);
  }
}
customElements.define('emularity-collection-player', CollectionPlayer);


/* ===== Collection =====

   The library: platform tabs, a sortable grid of the platform's items, and the
   add/edit dialogs. Persists the item records and view preferences in localStorage.
   Routes: #<platform> shows that platform's library; #play/<itemId> plays a title. */
class EmularityCollection extends HTMLElement {
  static STORAGE_KEY = 'emularity-collection';
  static SORTS = {
    'added-desc':  { label: 'Recently added', cmp: (a, b) => (b.added || 0) - (a.added || 0) },
    'played-desc': { label: 'Last played',    cmp: (a, b) => (b.lastPlayed || 0) - (a.lastPlayed || 0) },
    'title-asc':   { label: 'Title (A–Z)',    cmp: (a, b) => (a.title || '').localeCompare(b.title || '') },
    'rating-desc': { label: 'Rating',         cmp: (a, b) => (b.rating || 0) - (a.rating || 0) },
  };

  items = [];
  playing = false;

  connectedCallback() {
    let platforms = CollectionItem.platforms;
    let stored = EmularityCollection.readStored() || {};
    this.platform = platforms[stored.platform] ? stored.platform : Object.keys(platforms)[0];
    this.sort = EmularityCollection.SORTS[stored.sort] ? stored.sort : 'added-desc';
    this.prefs = { muted: !!stored.muted, theater: !!stored.theater };
    // Starter records added so far, by id
    this.seeded = new Set(stored.seeded || []);
    if (stored.x86Seeded) X86Item.starterRecords().forEach(r => this.seeded.add(r.id)); // as saved before
    AudioMute.set(this.prefs.muted);

    let changed = false;
    this.synced = new Map();
    for (let record of stored.items || []) {
      let item = CollectionItem.fromRecord(record);
      if (!item) continue;
      this.synced.set(record.id, JSON.stringify(record));
      changed = item.normalize() || changed;
      this.adopt(item);
    }
    // Starter content, each added once (see CollectionItem.starterRecords)
    for (let cls of Object.values(platforms)) {
      for (let r of cls.starterRecords()) {
        if (this.seeded.has(r.id)) continue;
        if (!this.items.some(i => i.record.id == r.id)) this.adopt(CollectionItem.fromRecord(r));
        this.seeded.add(r.id);
        changed = true;
      }
    }
    if (changed) this.save();

    // Close any open card menu when clicking elsewhere
    document.addEventListener('click', () => this.closeMenus());
    this.addEventListener('shownetwork', () => this.showNetwork());
    window.addEventListener('hashchange', () => this.renderRoute());
    // Machines added, changed or removed in other tabs
    window.addEventListener('storage', ev => {
      if (ev.key != EmularityCollection.STORAGE_KEY) return;
      let stored = EmularityCollection.readStored();
      if (stored && this.merge(stored)) this.renderGrid();
    });
    if (!location.hash) history.replaceState(null, '', '#' + this.platform);
    this.renderRoute();
    this.fetchMissingRatings();
    this.fetchMissingSizes();
  }

  /* ----- Items ----- */

  adopt(item) {
    item.addEventListener('itemchange', () => { this.save(); this.renderGrid(); });
    item.addEventListener('itemedit', () => this.editDialog.open(item));
    item.addEventListener('iteminstance', () => this.instanceDialog.open(item));
    item.addEventListener('itemfiles', () => this.filesDialog.open(item));
    item.addEventListener('itemremove', () => this.dropItem(item));
    item.addEventListener('menuopen', () => this.closeMenus());
    this.items.push(item);
    return item;
  }
  /* Add a new item from a record (as built by the add dialog) */
  addItem(record) {
    let item = CollectionItem.fromRecord(Object.assign(record, { id: 'sw-' + Date.now() + '-' + this.items.length, added: Date.now() }));
    this.adopt(item);
    this.save();
    this.renderGrid();
    return item;
  }
  /* Another instance of an item: the same software, its own id, so its own saves (and
     for machines, its own disk changes and network name). Numbered after its title. */
  /* The next free numbered title for an instance of an item */
  instanceTitle(item) {
    let base = item.record.title.replace(/ \d+$/, '');
    let taken = new Set(this.items.map(i => i.record.title));
    let n = 2;
    while (taken.has(base + ' ' + n)) n++;
    return base + ' ' + n;
  }
  /* A title not yet taken: `base`, or "base 2", "base 3"... */
  untitled(base) {
    let taken = new Set(this.items.map(i => i.record.title));
    if (!taken.has(base)) return base;
    let n = 2;
    while (taken.has(base + ' ' + n)) n++;
    return base + ' ' + n;
  }
  /* Options: title, diskSize to give it a bigger hard disk, and for a system (see
     X86Item), copyDisks to start with its hard disks as they are now, not blank */
  async newInstance(item, { title, diskSize, copyDisks } = {}) {
    let disk = null;
    if (diskSize) {
      // Can take a while (the whole disk is read): progress shows on the original's card
      try { disk = await item.buildDisk(diskSize, item.progress('Building a ' + Format.bytes(diskSize) + ' disk')); }
      catch (e) {
        console.error(e);
        alert('Failed to build the new hard disk: ' + e.message);
        item.render();
        return null;
      }
      item.render();
    }
    let record = structuredClone(item.record);
    for (let key of ['id', 'added', 'lastPlayed', 'cached', 'cloned', 'diskName', 'installed', 'installDir', 'hostname']) delete record[key];
    record.title = title || this.instanceTitle(item);
    if (disk) record.disk = disk;
    // Uploaded disks are stored by id: give the copy its own
    let copies = [], inserted = { ...(record.inserted || {}) };
    for (let disk of record.media || []) {
      if (!disk.upload) continue;
      let id = 'disk-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
      for (let d in inserted) if (inserted[d] == disk.id) inserted[d] = id;
      copies.push([disk.id, id]);
      disk.id = id;
    }
    record.inserted = inserted;
    for (let [from, to] of copies) {
      try { await LocalStore.uploadPut(to, await LocalStore.uploadGet(from)); } catch (e) { console.error(e); }
    }
    let copy = this.addItem(record);
    if (copyDisks && item.isSystem) {
      try { await copy.copyHardDisksFrom(item); }
      catch (e) { console.error(e); alert('Failed to copy the hard disks: ' + e.message); copy.render(); }
    }
    if (record.source == 'upload') {
      // Uploads are stored per item
      try { await LocalStore.uploadPut(copy.record.id, await LocalStore.uploadGet(item.record.id)); }
      catch (e) { console.error(e); alert('Failed to copy the uploaded file: ' + e.message); }
    }
    return copy;
  }
  dropItem(item) {
    this.items = this.items.filter(i => i != item);
    // A built hard disk goes with the last instance using it
    let disk = item.record.disk;
    if (disk && !this.items.some(i => i.record.disk && i.record.disk.template == disk.template)) {
      LocalStore.uploadDelete(disk.template).catch(e => console.error(e));
    }
    item.remove();
    this.save();
    this.renderGrid();
  }
  closeMenus() {
    this.items.forEach(i => i.closeMenu());
  }
  /* The collection is one localStorage entry shared by every open tab, and each tab
     works on its own copy. So saving merges instead of overwriting: what this tab
     added, changed or removed since it last read the entry goes in, and everything
     else is taken as stored, with whatever other tabs did. (Overwriting, a tab opened
     before a machine was made would drop it the next time it saved anything.) */
  save() {
    let stored = EmularityCollection.readStored();
    if (stored) this.merge(stored);
    try {
      localStorage.setItem(EmularityCollection.STORAGE_KEY, JSON.stringify({
        platform: this.platform, sort: this.sort, muted: this.prefs.muted, theater: this.prefs.theater,
        seeded: [...this.seeded], items: this.items.map(i => i.record),
      }));
      this.synced = new Map(this.items.map(i => [i.record.id, JSON.stringify(i.record)]));
    } catch (e) {
      console.error('Failed to save collection', e);
    }
  }
  /* The stored collection, or null if there's none or it can't be read */
  static readStored() {
    try {
      let stored = JSON.parse(localStorage.getItem(EmularityCollection.STORAGE_KEY));
      return stored && Array.isArray(stored.items) ? stored : null;
    } catch (e) {
      return null;
    }
  }
  /* Bring in other tabs' changes to the stored collection. this.synced holds each
     record as this tab last read or wrote it, which tells this tab's own changes
     (which win) from theirs. Returns whether anything changed here. */
  merge(stored) {
    let changed = false, mine = new Map(this.items.map(i => [i.record.id, i]));
    let unchangedHere = item => JSON.stringify(item.record) == this.synced.get(item.record.id);
    for (let id of stored.seeded || []) this.seeded.add(id);
    for (let record of stored.items) {
      let item = mine.get(record.id), json = JSON.stringify(record);
      if (!item) {
        if (this.synced.has(record.id)) continue; // removed here
        item = CollectionItem.fromRecord(record);
        if (!item) continue;
        this.adopt(item); // added elsewhere
        changed = true;
      } else if (unchangedHere(item) && this.synced.get(record.id) != json) {
        // Changed elsewhere
        for (let k of Object.keys(item.record)) delete item.record[k];
        Object.assign(item.record, JSON.parse(json));
        if (item.isConnected) item.render();
        changed = true;
      }
      if (!this.synced.has(record.id) || unchangedHere(item)) this.synced.set(record.id, json);
    }
    // Removed elsewhere (but not the one playing here)
    let ids = new Set(stored.items.map(r => r.id));
    for (let [id, item] of mine) {
      if (ids.has(id) || !this.synced.has(id) || !unchangedHere(item) || (this.player && this.player.item == item)) continue;
      this.items = this.items.filter(i => i != item);
      this.synced.delete(id);
      item.remove();
      changed = true;
    }
    return changed;
  }
  /* Look up archive.org ratings for archive-sourced items that don't have one yet */
  async fetchMissingRatings() {
    let pending = this.items.filter(i => i.record.rating === undefined && i.archiveId);
    if (!pending.length) return;
    let ratings = {};
    try { ratings = await ArchiveOrg.ratings(pending.map(i => i.archiveId)); }
    catch (e) { console.error('Failed to fetch ratings', e); } // rate as 0 rather than retry endlessly
    pending.forEach(i => { i.record.rating = ratings[i.archiveId] ?? 0; });
    this.save();
    this.renderGrid();
  }
  async fetchMissingSizes() {
    for (let item of this.items) await item.fetchSize();
  }

  /* ----- Library ----- */

  renderRoute() {
    let hash = decodeURIComponent(location.hash.replace(/^#/, ''));
    let slash = hash.indexOf('/');
    let head = slash >= 0 ? hash.slice(0, slash) : hash;
    let rest = slash >= 0 ? hash.slice(slash + 1) : '';

    if (head == 'play' && rest) {
      let item = this.items.find(i => i.record.id == rest);
      if (item) {

    // Leaving a running emulator requires a reload (emscripten runtimes don't tear down
    // cleanly); the hash is already updated, so the library renders after the reload.
    if (this.playing) {

      location.reload();
      return;
    }
    if (CollectionItem.platforms[head]) this.platform = head;
    if (!this.querySelector('.platform-tabs')) this.render();
    this.renderTabs();
    this.renderGrid();
    this.save();
  }
  render() {
    this.innerHTML = `
      <header>
        <button class="network-button" title="Show the machines on the local network">🖧 Network</button>
        <img src="../logos/emularity-transparent.png" alt="Emularity">
        <p>Your personal software collection. Pick a platform, add software, click to play.</p>
      </header>
      <div class="platform-tabs"></div>
      <div class="sort-bar"><label>Sort by <select class="sort-select"></select></label></div>
      <div class="game-grid"></div>
      <p class="empty-note" style="display: none">No software installed for this platform yet. Click "Add software" to get started.</p>
      <emularity-add-dialog></emularity-add-dialog>
      <emularity-edit-dialog></emularity-edit-dialog>
      <emularity-instance-dialog></emularity-instance-dialog>
      <emularity-files-dialog></emularity-files-dialog>`;
    this.filesDialog = this.querySelector('emularity-files-dialog');
    this.instanceDialog = this.querySelector('emularity-instance-dialog');
    this.instanceDialog.collection = this;
    this.addDialog = this.querySelector('emularity-add-dialog');
    this.addDialog.collection = this;
    this.querySelector('.network-button').addEventListener('click', () => this.showNetwork());
    this.editDialog = this.querySelector('emularity-edit-dialog');

    let sel = this.querySelector('.sort-select');
    for (let key in EmularityCollection.SORTS) {
      let opt = document.createElement('option');
      opt.value = key;
      opt.textContent = EmularityCollection.SORTS[key].label;
      sel.appendChild(opt);
    }
    sel.addEventListener('change', () => { this.sort = sel.value; this.save(); this.renderGrid(); });

    this.addCard = document.createElement('div');
    this.addCard.className = 'game-card add-card';
    this.addCard.textContent = '+ Add software'; // (or system: see renderGrid)
    this.addCard.addEventListener('click', () => this.addDialog.open(CollectionItem.platforms[this.platform]));
  }
  renderTabs() {
    let tabs = this.querySelector('.platform-tabs');
    tabs.innerHTML = '';
    for (let [key, platform] of Object.entries(CollectionItem.platforms)) {
      let btn = document.createElement('button');
      btn.innerHTML = '<span class="label"></span><span class="sublabel"></span>';
      btn.querySelector('.label').textContent = platform.label;
      btn.querySelector('.sublabel').textContent = platform.sublabel;
      if (key == this.platform) btn.classList.add('active');
      btn.addEventListener('click', () => { location.hash = key; });
      tabs.appendChild(btn);
    }
  }
  /* Show the current platform's items, sorted. Items are long-lived elements, so this
     only reorders them; nothing is rebuilt. */
  renderGrid() {
    let grid = this.querySelector('.game-grid');
    if (this.playing || !grid) return;
    let cmp = (EmularityCollection.SORTS[this.sort] || EmularityCollection.SORTS['added-desc']).cmp;
    let items = this.items.filter(i => i.record.platform == this.platform).sort((a, b) => cmp(a.record, b.record));
    this.addCard.textContent = CollectionItem.platforms[this.platform].newSystem ? '+ Add system' : '+ Add software';
    grid.replaceChildren(...items, this.addCard);
    this.querySelector('.sort-select').value = this.sort;
    this.querySelector('.empty-note').style.display = items.length ? 'none' : 'block';
    this.querySelector('.sort-bar').style.display = items.length ? '' : 'none';
  }

  /* The virtual LAN's machines, live, in a dialog. The panel only watches the LAN
     while it's showing. */
  showNetwork() {
    let dialog = document.createElement('dialog');
    dialog.className = 'network-dialog';
    dialog.innerHTML = `
      <button class="close-dialog" title="Close">✕</button>
      <h3>Local network</h3>
      <p class="field-hint">Machines running in this browser with networking enabled, in any tab. They can reach each other by name, e.g. <code>ping name.lan</code>.</p>
      <emularity-lan-panel></emularity-lan-panel>`;
    let uplink = this.getAttribute('uplink');
    if (uplink) dialog.querySelector('emularity-lan-panel').setAttribute('uplink', uplink);
    dialog.querySelector('.close-dialog').addEventListener('click', () => dialog.close());
    dialog.addEventListener('close', () => dialog.remove());
    this.appendChild(dialog);
    dialog.showModal();
  }

  /* ----- Playing ----- */

  async play(item) {
    this.playing = true;
    this.platform = item.record.platform;
    item.update({ lastPlayed: Date.now() });
    let player = this.player = document.createElement('emularity-collection-player');
    player.prefs = this.prefs;
    player.addEventListener('prefschange', () => this.save());
    try {
      await player.load(item);
    } catch (e) {
      console.error(e);
      alert(e.message);
      this.playing = false;
      history.replaceState(null, '', '#' + item.record.platform);
      this.renderRoute();
      return;
    }
    this.classList.add('playing');
    this.replaceChildren(player);
  }
}
customElements.define('emularity-collection', EmularityCollection);
    </script>
  </body>
</html>
