    <script>
/* ===== Helpers ===== */

class Format {
  /* Human-friendly "time ago" for a timestamp (ms), or "never" if unset */
  static relativeTime(ts) {
    if (!ts) return 'never';
    let sec = Math.max(0, Math.round((Date.now() - ts) / 1000));
    let fmt = (n, u) => n + ' ' + u + (n == 1 ? '' : 's') + ' ago';
    if (sec < 45) return 'just now';
    let min = Math.round(sec / 60);
    if (min < 60) return fmt(min, 'minute');
    let hr = Math.round(min / 60);
    if (hr < 24) return fmt(hr, 'hour');
    let day = Math.round(hr / 24);
    if (day < 7) return fmt(day, 'day');
    if (day < 70) return fmt(Math.round(day / 7), 'week');
    let mo = Math.round(day / 30.44);
    if (mo < 12) return fmt(mo, 'month');
    return fmt(Math.round(day / 365.25), 'year');
  }
  /* A byte count as a human-friendly size (e.g. "4.2 MB") */
  static bytes(bytes) {
    if (bytes == null || !isFinite(bytes) || bytes < 0) return null;
    if (bytes < 1024) return bytes + ' B';
    let units = ['KB', 'MB', 'GB', 'TB'], v = bytes / 1024, i = 0;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return (v < 10 ? v.toFixed(1) : Math.round(v)) + ' ' + units[i];
  }
  /* An elapsed duration (ms) as M:SS, or H:MM:SS past an hour */
  static duration(ms) {
    let s = Math.floor(Math.max(0, ms) / 1000);
    let h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    let pad = n => String(n).padStart(2, '0');
    return (h > 0 ? h + ':' + pad(m) : m) + ':' + pad(sec);
  }
}

/* archive.org's search and metadata APIs */
class ArchiveOrg {
  static SEARCH_ROWS = 50;

  static async advancedSearch(query, fields, extra = {}) {
    let params = new URLSearchParams();
    params.append('q', query);
    fields.forEach(f => params.append('fl[]', f));
    for (let k in extra) params.append(k, String(extra[k]));
    params.append('output', 'json');
    let res = await fetch('https://archive.org/advancedsearch.php?' + params);
    return (await res.json()).response;
  }
  static async search(query, page = 1) {
    let r = await this.advancedSearch(query, ['identifier', 'title', 'year', 'avg_rating'],
      { 'sort[]': 'downloads desc', rows: this.SEARCH_ROWS, page });
    return { docs: r.docs, total: r.numFound };
  }
  /* Ratings for a batch of identifiers ({ id: rating }). avg_rating is only exposed
     by the advancedsearch API, so query all of them at once. */
  static async ratings(ids) {
    let r = await this.advancedSearch('identifier:(' + ids.join(' OR ') + ')', ['identifier', 'avg_rating'], { rows: ids.length });
    let ratings = {};
    r.docs.forEach(d => { ratings[d.identifier] = d.avg_rating != null ? +d.avg_rating : 0; });
    return ratings;
  }
  /* Given an identifier, figure out the software file to load and how to start it */
  static async resolveItem(identifier) {
    let res = await fetch('https://archive.org/metadata/' + identifier);
    let data = await res.json();
    let meta = data.metadata || {};
    let ext = (meta.emulator_ext || '').toLowerCase();
    let file = ext ? data.files.find(f => f.name.toLowerCase().endsWith('.' + ext)) : null;
    if (!file) file = data.files.find(f => /\.(zip|dsk|do|po|nib|woz|img|ima|nes|fds)$/i.test(f.name));
    if (!file) throw new Error('No usable software file found in this item');
    return {
      title: (Array.isArray(meta.title) ? meta.title[0] : meta.title) || identifier,
      filename: file.name,
      url: `https://cors.archive.org/cors/${identifier}/${encodeURIComponent(file.name)}`,
      exe: meta.emulator_start || '',
      size: file.size != null ? +file.size : undefined,
    };
  }
  /* Recover the identifier from a download URL */
  static idFromUrl(url) {
    let m = url && url.match(/cors\.archive\.org\/cors\/([^\/?#]+)/);
    return m ? decodeURIComponent(m[1]) : null;
  }
  static thumbUrl(identifier) {
    return 'https://archive.org/services/img/' + identifier;
  }
}

/* Browser-side storage backends:
   - uploads: uploaded software (IndexedDB store 'files')
   - "Cache on device": OPFS, with IndexedDB store 'cache' as a fallback
   - "Clone to disk" / "Install to disk": File System Access, a real user-chosen
     folder whose handle is remembered in IndexedDB store 'handles' */
class LocalStore {
  static #db = null;

  static supportsDisk() { return typeof window.showDirectoryPicker === 'function'; }
  static supportsOPFS() { return !!(navigator.storage && navigator.storage.getDirectory); }

  // ---- IndexedDB ----
  static #open() {
    if (this.#db) return Promise.resolve(this.#db);
    return new Promise((resolve, reject) => {
      let req = indexedDB.open('emularity-collection', 2);
      req.onupgradeneeded = ev => {
        let db = ev.target.result;
        for (let s of ['files', 'cache', 'handles']) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s);
      };
      req.onsuccess = ev => { this.#db = ev.target.result; resolve(this.#db); };
      req.onerror = () => reject(req.error);
    });
  }
  static async #idbPut(store, key, val) {
    let db = await this.#open();
    return new Promise((res, rej) => { let tx = db.transaction(store, 'readwrite'); tx.objectStore(store).put(val, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  }
  static async #idbGet(store, key) {
    let db = await this.#open();
    return new Promise((res, rej) => { let r = db.transaction(store).objectStore(store).get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  }
  static async #idbDelete(store, key) {
    let db = await this.#open();
    return new Promise((res, rej) => { let tx = db.transaction(store, 'readwrite'); tx.objectStore(store).delete(key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  }

  // ---- network ----
  /* Fetch a URL, streaming chunks into `sink(chunk)`; reports (loaded, total) */
  static async stream(url, sink, onProgress) {
    let res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    let total = +res.headers.get('Content-Length') || 0, reader = res.body.getReader(), loaded = 0;
    while (true) {
      let { done, value } = await reader.read();
      if (done) break;
      await sink(value);
      loaded += value.byteLength;
      if (onProgress) onProgress(loaded, total);
    }
  }
  static async fetchBlob(url, onProgress) {
    let chunks = [];
    await this.stream(url, c => chunks.push(c), onProgress);
    return new Blob(chunks);
  }
  static async #streamToFile(fileHandle, url, onProgress) {
    let w = await fileHandle.createWritable();
    await this.stream(url, chunk => w.write(chunk), onProgress);
    await w.close();
  }
  static async #writeToFile(fileHandle, blob) {
    let w = await fileHandle.createWritable();
    await w.write(blob); await w.close();
  }

  // ---- uploads ----
  static uploadPut(id, blob) { return this.#idbPut('files', id, blob); }
  static uploadGet(id) { return this.#idbGet('files', id); }
  static uploadDelete(id) { return this.#idbDelete('files', id); }

  // ---- device cache ----
  static async #opfsDir() {
    let root = await navigator.storage.getDirectory();
    return root.getDirectoryHandle('emularity-cache', { create: true });
  }
  static async cachePut(id, blob) {
    if (this.supportsOPFS()) await this.#writeToFile(await (await this.#opfsDir()).getFileHandle(id, { create: true }), blob);
    else await this.#idbPut('cache', id, blob);
  }
  // Stream a URL straight into the device cache (memory-efficient for big files)
  static async cacheStream(id, url, onProgress) {
    if (this.supportsOPFS()) await this.#streamToFile(await (await this.#opfsDir()).getFileHandle(id, { create: true }), url, onProgress);
    else await this.#idbPut('cache', id, await this.fetchBlob(url, onProgress));
  }
  static async cacheGet(id) {
    try {
      if (this.supportsOPFS()) return await (await (await this.#opfsDir()).getFileHandle(id)).getFile();
      return await this.#idbGet('cache', id);
    } catch (e) { return null; }
  }
  static async cacheDelete(id) {
    try {
      if (this.supportsOPFS()) await (await this.#opfsDir()).removeEntry(id);
      else await this.#idbDelete('cache', id);
    } catch (e) {}
  }

  // ---- disk folder (File System Access) ----
  static async pickDiskDir() {
    let handle = await window.showDirectoryPicker({ mode: 'readwrite', id: 'emularity-games' });
    await this.#idbPut('handles', 'diskdir', handle);
    return handle;
  }
  /* The remembered folder, re-requesting permission if needed. With `createOrPick`,
     prompts for a folder when there is none (or access was refused). */
  static async getDiskDir(createOrPick) {
    let handle = await this.#idbGet('handles', 'diskdir');
    if (!handle) return createOrPick ? await this.pickDiskDir() : null;
    // OPFS handles (and some browsers) don't expose queryPermission; those are already granted.
    if (handle.queryPermission) {
      let perm = await handle.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted' && handle.requestPermission) perm = await handle.requestPermission({ mode: 'readwrite' });
      if (perm !== 'granted') return createOrPick ? await this.pickDiskDir() : null;
    }
    return handle;
  }
  static async diskStream(name, url, onProgress) {
    await this.#streamToFile(await (await this.getDiskDir(true)).getFileHandle(name, { create: true }), url, onProgress);
  }
  static async diskPut(name, blob) {
    await this.#writeToFile(await (await this.getDiskDir(true)).getFileHandle(name, { create: true }), blob);
  }
  static async diskGet(name) {
    try { let dir = await this.getDiskDir(false); return dir ? await (await dir.getFileHandle(name)).getFile() : null; }
    catch (e) { return null; }
  }
  static async diskDelete(name, options) {
    try { let dir = await this.getDiskDir(false); if (dir) await dir.removeEntry(name, options); } catch (e) {}
  }

  /* Write `bytes` to `path` (e.g. "/c/SAVE.DAT") under a directory handle, creating
     any missing parent directories. */
  static async writePath(root, path, bytes) {
    let parts = path.split('/').filter(Boolean), name = parts.pop(), dir = root;
    for (let p of parts) dir = await dir.getDirectoryHandle(p, { create: true });
    await this.#writeToFile(await dir.getFileHandle(name, { create: true }), bytes);
  }
  /* Remove `path` from under a directory handle, if present. */
  static async removePath(root, path) {
    let parts = path.split('/').filter(Boolean), name = parts.pop(), dir = root;
    for (let p of parts) dir = await dir.getDirectoryHandle(p);
    await dir.removeEntry(name, { recursive: true });
  }
}

/* Extract a zip (a Blob) into a real directory handle (used by "Install to disk").

   Designed for large archives (games run to 1.5GB+): nothing ever holds the whole
   zip — or even a whole file — in memory. We parse only the central directory, then
   hand each worker the zip Blob (postMessage shares a Blob by reference; the bytes
   are NOT copied) plus a slice of entries. Each worker slices out just its file's
   compressed bytes and streams them through DecompressionStream straight into the
   destination file. Work fans across many workers so the per-file atomic
   createWritable()/close() (temp-file + fsync + rename on a real folder) pipeline
   across cores instead of serializing on the main thread. */
class ZipExtractor {
  // Tuning knobs, not correctness: how many workers issue writes in parallel, and how
  // many writes each keeps in flight. On OPFS more of both helps; on a real folder the
  // browser serializes atomic writes, so it may not move the needle.
  static WORKERS = 32;
  static CONCURRENCY = 4;

  // sanitizeName, childHandle, extractEntry and workerMain also run inside the
  // extraction workers: workerURL() copies their source into the worker script, so
  // they must stay self-contained (only `this.` references to each other).

  /* Chrome's local File System Access rejects some names OPFS accepts ("Name is not
     allowed"), with stricter, not fully documented rules (e.g. a comma). This is the
     fallback name used only when the browser refuses the original. */
  static sanitizeName(name) {
    let s = name.replace(/[^A-Za-z0-9._-]/g, '_').replace(/[. ]+$/, '') || '_';
    if (/^(con|prn|aux|nul|com[1-9]|lpt[1-9])(\.|$)/i.test(s)) s = '_' + s; // Windows reserved
    return s;
  }
  /* Create (or open) a child file/directory, retrying with a sanitized name if the
     browser refuses the original one. */
  static async childHandle(dir, name, kind) {
    let get = n => kind == 'file' ? dir.getFileHandle(n, { create: true }) : dir.getDirectoryHandle(n, { create: true });
    try { return await get(name); }
    catch (e) {
      let alt = this.sanitizeName(name);
      if (alt === name) alt = '_' + name; // refused a name the sanitizer keeps as-is (e.g. desktop.ini)
      try {
        let h = await get(alt);
        console.warn('Emularity: ' + kind + ' name ' + JSON.stringify(name) + ' refused, wrote as ' + JSON.stringify(alt));
        return h;
      } catch (e2) {
        console.error('Emularity: ' + kind + ' name ' + JSON.stringify(name) + ' refused, and so was ' + JSON.stringify(alt), e2);
        throw e;
      }
    }
  }
  /* Stream one entry's compressed bytes -> inflate -> file */
  /* One entry's contents, as a Blob */
  static async entryBlob(blob, en) {
    let lh = new DataView(await blob.slice(en.localOffset, en.localOffset + 30).arrayBuffer());
    let dataStart = en.localOffset + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
    let src = blob.slice(dataStart, dataStart + en.compSize);
    if (en.method === 0) return src;
    return new Response(src.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob();
  }
  static async extractEntry(blob, en) {
    // The central directory points at the local header, whose name/extra lengths can
    // differ from the central record, so read them here to find where data begins.
    let lh = new DataView(await blob.slice(en.localOffset, en.localOffset + 30).arrayBuffer());
    let dataStart = en.localOffset + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
    let src = blob.slice(dataStart, dataStart + en.compSize);
    let writable = await (await this.childHandle(en.dir, en.name, 'file')).createWritable();
    if (en.method === 0) await src.stream().pipeTo(writable);                                      // stored
    else await src.stream().pipeThrough(new DecompressionStream('deflate-raw')).pipeTo(writable);  // deflate
  }
  static async workerMain(e) {
    let { blob, entries, conc } = e.data;
    let i = 0, failed = false;
    let run = async () => {
      while (i < entries.length && !failed) {
        let en = entries[i++];
        try { await this.extractEntry(blob, en); postMessage({ done: 1 }); }
        catch (err) { failed = true; postMessage({ error: String((err && err.message) || err) }); return; }
      }
    };
    await Promise.all(Array.from({ length: Math.min(conc, entries.length) }, run));
    if (!failed) postMessage({ finished: true });
  }
  static #workerURL = null;
  static workerURL() {
    if (!this.#workerURL) {
      let src = `const ZipExtractor = { ${this.sanitizeName}, ${this.childHandle}, ${this.extractEntry}, ${this.workerMain} };\n` +
                `onmessage = e => ZipExtractor.workerMain(e);`;
      this.#workerURL = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    }
    return this.#workerURL;
  }

  /* Parse a zip's central directory (reading only the tail + directory, never the file
     data). Returns [{ name, method, compSize, uncompSize, localOffset }]. Handles ZIP64
     so archives over 4GB / 65535 entries work. */
  static async parseEntries(blob) {
    let size = blob.size;
    let u64 = (dv, o) => Number(dv.getBigUint64(o, true));
    let tailLen = Math.min(size, 65557); // max EOCD comment (65535) + EOCD (22)
    let tail = new DataView(await blob.slice(size - tailLen).arrayBuffer());
    let eo = -1;
    for (let i = tail.byteLength - 22; i >= 0; i--) { if (tail.getUint32(i, true) === 0x06054b50) { eo = i; break; } }
    if (eo < 0) throw new Error('Not a zip file (end-of-central-directory not found)');
    let cdCount = tail.getUint16(eo + 10, true);
    let cdSize = tail.getUint32(eo + 12, true);
    let cdOffset = tail.getUint32(eo + 16, true);
    if (cdOffset === 0xffffffff || cdCount === 0xffff || cdSize === 0xffffffff) { // ZIP64
      let locOff = eo - 20;
      if (locOff >= 0 && tail.getUint32(locOff, true) === 0x07064b50) {
        let z64Off = u64(tail, locOff + 8);
        let z = new DataView(await blob.slice(z64Off, z64Off + 56).arrayBuffer());
        if (z.getUint32(0, true) === 0x06064b50) { cdCount = u64(z, 32); cdSize = u64(z, 40); cdOffset = u64(z, 48); }
      }
    }
    let cdBuf = await blob.slice(cdOffset, cdOffset + cdSize).arrayBuffer();
    let cd = new DataView(cdBuf), dec = new TextDecoder('utf-8');
    let entries = [], p = 0;
    for (let n = 0; n < cdCount && p + 46 <= cdBuf.byteLength; n++) {
      if (cd.getUint32(p, true) !== 0x02014b50) break;
      let method = cd.getUint16(p + 10, true);
      let compSize = cd.getUint32(p + 20, true);
      let uncompSize = cd.getUint32(p + 24, true);
      let nameLen = cd.getUint16(p + 28, true);
      let extraLen = cd.getUint16(p + 30, true);
      let commentLen = cd.getUint16(p + 32, true);
      let localOffset = cd.getUint32(p + 42, true);
      let time = cd.getUint16(p + 12, true), date = cd.getUint16(p + 14, true);
      let mtime = new Date(1980 + (date >> 9), ((date >> 5) & 15) - 1, date & 31, time >> 11, (time >> 5) & 63, (time & 31) * 2).getTime();
      let name = dec.decode(new Uint8Array(cdBuf, p + 46, nameLen));
      if (compSize === 0xffffffff || uncompSize === 0xffffffff || localOffset === 0xffffffff) { // ZIP64 extra
        let ep = p + 46 + nameLen, eend = ep + extraLen;
        while (ep + 4 <= eend) {
          let id = cd.getUint16(ep, true), sz = cd.getUint16(ep + 2, true), q = ep + 4;
          if (id === 0x0001) {
            if (uncompSize === 0xffffffff) { uncompSize = u64(cd, q); q += 8; }
            if (compSize === 0xffffffff) { compSize = u64(cd, q); q += 8; }
            if (localOffset === 0xffffffff) { localOffset = u64(cd, q); q += 8; }
            break;
          }
          ep += 4 + sz;
        }
      }
      entries.push({ name, method, compSize, uncompSize, localOffset, mtime });
      p += 46 + nameLen + extraLen + commentLen;
    }
    return entries;
  }

  /* Normalize + sanitize a zip entry path for File System Access: (1) some archives
     (especially DOS-era ones) use backslashes as path separators, which FSA rejects as
     invalid name characters; (2) a component can contain characters that are illegal
     filenames on Windows/macOS, and FSA enforces the strictest rules regardless of the
     current OS. Returns a clean "a/b/c" path, or '' if nothing survives. */
  static sanitizePath(name) {
    return name
      .replace(/\\/g, '/')                          // backslashes are path separators
      .split('/')
      .map(seg => seg
        .replace(/[<>:"|?*\x00-\x1f]/g, '_')         // characters illegal on major OSes
        .replace(/[. ]+$/, ''))                      // Windows drops trailing dots/spaces
      .filter(seg => seg && seg !== '.' && seg !== '..')
      .join('/');
  }

  static async extractTo(zipBlob, destDir, onProgress) {
    let entries = await this.parseEntries(zipBlob);
    for (let e of entries) { e.isDir = /[\/\\]$/.test(e.name); e.path = this.sanitizePath(e.name); }

    // Pre-create every directory (from both explicit dir entries and file parents) so
    // concurrent writes never race on directory creation. Cached by the original path
    // so files still resolve their parent even if a name had to be sanitized on disk.
    let dirs = new Map([['', destDir]]);
    let dirKeys = new Set();
    for (let e of entries) {
      if (!e.path) continue;
      let parts = e.path.split('/');
      if (!e.isDir) parts.pop(); // a file's parent chain
      for (let i = 1; i <= parts.length; i++) dirKeys.add(parts.slice(0, i).join('/'));
    }
    for (let key of [...dirKeys].sort()) { // sorted, so parents come before children
      let slash = key.lastIndexOf('/');
      dirs.set(key, await this.childHandle(dirs.get(key.slice(0, Math.max(slash, 0))), key.slice(slash + 1), 'directory'));
    }

    // One task per actual file, resolved to its parent handle + basename so workers
    // only call getFileHandle/createWritable.
    let tasks = [];
    for (let e of entries) {
      if (e.isDir || !e.path) continue;
      let parts = e.path.split('/'), name = parts.pop();
      tasks.push({ dir: dirs.get(parts.join('/')), name, method: e.method, compSize: e.compSize, localOffset: e.localOffset });
    }
    if (!tasks.length) return;

    let t0 = performance.now(), done = 0;
    let nw = Math.min(this.WORKERS, tasks.length);
    // Round-robin partition so every worker gets a similar file count.
    let groups = Array.from({ length: nw }, () => []);
    tasks.forEach((t, i) => groups[i % nw].push(t));
    let workers = groups.map(() => new Worker(this.workerURL()));
    try {
      await Promise.all(workers.map((wk, gi) => new Promise((resolve, reject) => {
        wk.onerror = ev => reject(new Error('worker error: ' + (ev.message || 'unknown')));
        wk.onmessage = e => {
          if (e.data.done) { if (onProgress) onProgress(++done, tasks.length); }
          else if (e.data.error) reject(new Error(e.data.error));
          else if (e.data.finished) resolve();
        };
        wk.postMessage({ blob: zipBlob, entries: groups[gi], conc: this.CONCURRENCY });
      })));
    } finally {
      workers.forEach(w => w.terminate());
    }
    console.log('Emularity: extracted ' + tasks.length + ' files in ' + Math.round(performance.now() - t0) + 'ms (' + nw + ' workers)');
  }
}

/* Master mute. Routes every emulator's audio through gain nodes we can silence,
   installed globally so it catches audio graphs built after a game boots. Uses a
   gain (not AudioContext.suspend) so the audio callback keeps firing and emulator
   timing is unaffected. */
class AudioMute {
  static #gains = [];
  static muted = false;

  static install() {
    let orig = AudioNode.prototype.connect, gains = this.#gains, self = this;
    AudioNode.prototype.connect = function(target, ...rest) {
      if (target instanceof AudioDestinationNode) {
        try {
          let gain = this.context.createGain();
          gain.gain.value = self.muted ? 0 : 1;
          gains.push(gain);
          orig.call(this, gain);
          return orig.call(gain, target);
        } catch (e) { /* fall through to a plain connect */ }
      }
      return orig.call(this, target, ...rest);
    };
  }
  static set(muted) {
    this.muted = muted;
    this.#gains.forEach(g => { try { g.gain.value = muted ? 0 : 1; } catch (e) {} });
  }
}
AudioMute.install();


/* ===== Software sources =====

   Where the add dialog finds software for a platform. Each platform lists its sources
   (`static sources` on its item class) and the dialog shows a tab for each, all
   sharing the same search-and-pick UI. A source finds titles and turns the one picked
   into a collection record:
     label, hint      the tab's name, and a line explaining the results
     filter           optional text shown as a fixed part of the search
     search(text, page)   -> { results: [{ title, detail, thumb }], total }
     toRecord(result)     -> the new item's record fields (title, source, url, ...) */
class SoftwareSource {
  label = '';
  hint = '';
  filter = '';
  async search(text, page) { return { results: [], total: 0 }; }
  async toRecord(result) { throw new Error('not implemented'); }
}

/* archive.org's software library, narrowed by an advancedsearch query (e.g.
   "emulator:(dosbox)") */
class ArchiveOrgSource extends SoftwareSource {
  label = 'Search archive.org';
  hint = "Results from archive.org's software library. Click one to add it to your collection.";

  constructor(query) {
    super();
    this.filter = query;
  }
  async search(text, page) {
    let { docs, total } = await ArchiveOrg.search(this.filter + (text ? ' ' + text : ''), page);
    return {
      total,
      results: docs.map(doc => ({
        title: Array.isArray(doc.title) ? doc.title[0] : (doc.title || doc.identifier),
        detail: doc.identifier + (doc.year ? ' · ' + doc.year : ''),
        thumb: ArchiveOrg.thumbUrl(doc.identifier),
        doc,
      })),
    };
  }
  async toRecord({ doc }) {
    let identifier = doc.identifier, resolved = await ArchiveOrg.resolveItem(identifier);
    return {
      title: resolved.title,
      source: 'url',
      url: resolved.url,
      filename: resolved.filename,
      exe: resolved.exe,
      identifier,
      thumb: ArchiveOrg.thumbUrl(identifier),
      rating: doc.avg_rating != null ? +doc.avg_rating : 0,
      size: resolved.size,
    };
  }
}

/* The machines from copy.sh/v86's demo page: complete v86 configurations (disk images,
   memory, kernel command line, ...), imported by tools/import-v86-catalog.mjs.
   Image URLs in the catalog start with "{host}", replaced by `host`: the images are
   copy.sh's, and i.copy.sh refuses requests referred by other sites, so locally they
   go through v86-proxy.py's /copysh/ route. A public deployment should point this at
   its own mirror (or have copy.sh's blessing). */
class V86CatalogSource extends SoftwareSource {
  static host = '/copysh/';
  label = 'copy.sh/v86 machines';
  hint = 'Operating systems and demos from the copy.sh/v86 project. Click one to add it to your collection.';

  constructor(url) {
    super();
    this.url = url;
  }
  load() {
    return this.catalog ??= fetch(this.url).then(res => {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).catch(e => { this.catalog = null; throw e; }); // retry next time
  }
  static MEDIA = { cdrom: 'CD-ROM', hda: 'hard disk', fda: 'floppy', bzimage: 'Linux kernel', multiboot: 'multiboot kernel', filesystem: '9p filesystem' };
  /* The machine's boot media, and their total size */
  static describe(config) {
    let kinds = Object.keys(this.MEDIA).filter(k => config[k]);
    let size = ['cdrom', 'hda', 'hdb', 'fda', 'fdb', 'bzimage', 'initrd', 'multiboot'].reduce((sum, k) => sum + (config[k]?.size || 0), 0);
    return { kinds, size: size || undefined };
  }
  async search(text, page) {
    let { machines } = await this.load();
    let words = text.toLowerCase().split(/\s+/).filter(Boolean);
    let results = machines
      .filter(m => words.every(w => (m.name + ' ' + m.id).toLowerCase().includes(w)))
      .map(m => {
        let { kinds, size } = V86CatalogSource.describe(m.config);
        let detail = kinds.map(k => V86CatalogSource.MEDIA[k]).join(' + ') + (size ? ' · ' + Format.bytes(size) : '');
        return { title: m.name, detail, machine: m };
      });
    return { results, total: results.length }; // the whole (small) list in one page
  }
  async toRecord({ machine }) {
    let config = JSON.parse(JSON.stringify(machine.config).replaceAll('{host}', V86CatalogSource.host));
    let { kinds, size } = V86CatalogSource.describe(config);
    let main = config[kinds[0]];
    // e.g. "{host}haiku-v5/.img" (split into parts) -> "haiku-v5.img"
    let filename = (main.url || main.baseurl || machine.id).replace(/\/(\.[^/]*)?$/, '$1').split('/').pop();
    return { title: machine.name, source: 'catalog', catalog: 'copy.sh/v86', machine: machine.id, filename, size, homepage: machine.homepage, v86opts: config };
  }
}


/* ===== Collection items =====

   One element per title in the collection, which doubles as its card in the grid.
   It owns the title's stored record (the JSON persisted by the collection) and
   everything you can do with it: local copies, installing, resetting saves, and
   building the emulator that plays it. Each platform is a subclass, registered
   under its own tag; its static fields describe the platform to the rest of the UI.

   Items report back to the collection with (non-bubbling) events dispatched on
   themselves, so they work whether or not they're currently in the grid:
     itemchange  the record changed and should be saved
     itemedit    the user asked to edit the item's info
     iteminstance  the user asked for a new instance of it (the same software, with
                 saves and changes of its own)
     itemremove  the item was removed from the collection
     menuopen    this item's menu opened (others should close) */
class CollectionItem extends HTMLElement {
  static platforms = {}; // platform key -> item class, in tab order

  // Platform description, overridden by each subclass
  static key = null;
  static label = '';
  static sublabel = '';
  static sources = [];      // where the add dialog finds software (SoftwareSource)
  static accept = '';       // file types for the upload picker
  static hint = '';         // what kind of file the platform wants
  static exeField = false;  // whether titles have a "program to run"
  static captureMouseField = false; // whether titles can capture the mouse on click
  static networkField = false; // whether titles can join the virtual LAN
  static cores = null;      // { id: label } of emulator cores to choose from, if any
  static onscreenKeyboard = true;
  static mediaDrives = null; // { drive: { label, kind } } removable drives titles keep disks for
  static mediaAccept = { floppy: '.img,.ima,.flp,.vfd,.dsk,.zip', cdrom: '.iso,.cue,.bin,.zip' };

  static register(tag) {
    CollectionItem.platforms[this.key] = this;
    customElements.define(tag, this);
  }
  /* Create the item element for a stored record */
  static fromRecord(record) {
    let cls = CollectionItem.platforms[record.platform];
    if (!cls) return null;
    let item = new cls();
    item.record = record;
    return item;
  }

  record = null;

  // The name the machine is known by on the virtual LAN
  get hostname() {
    return this.record.hostname || this.record.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'host';
  }
  get archiveId() { return this.record.identifier || ArchiveOrg.idFromUrl(this.record.url); }
  get thumb() {
    let id = this.archiveId;
    return this.record.thumb || (id ? ArchiveOrg.thumbUrl(id) : null);
  }
  // IndexedDB store for the title's writes (saves, high scores, NVRAM), one per title
  // so titles sharing a mountpoint can't contaminate each other.
  get persistStore() { return 'collection-' + this.record.id; }
  // File name for an on-disk copy: the title with only safe filename characters (and
  // no trailing dots/spaces, which Windows/FSA reject), plus the original extension.
  get diskName() {
    let r = this.record;
    let ext = ((r.filename || '').match(/\.[a-z0-9]+$/i) || [''])[0];
    let base = r.title.replace(/[^a-z0-9 ._-]/gi, '_').replace(/[. ]+$/, '').trim() || r.id;
    return base + ext;
  }
  // The software is one file (a URL or an upload), as opposed to e.g. a full machine
  // configuration; only then can it be cached or cloned
  get isSingleFile() { return !!this.record.url || this.record.source == 'upload'; }
  get hasLocalCopy() {
    let r = this.record;
    return !!((r.cloned && r.diskName) || r.cached || r.source == 'upload');
  }
  get storageLabel() {
    let r = this.record;
    return r.installed ? '🖴 Installed to disk' : r.cloned ? '💾 On disk' : r.cached ? '📥 Cached on device' : '';
  }
  canInstall() { return false; }

  /* ----- Disks -----
     A title's set of floppies and CDs (record.media: [{ id, name, drive, url | upload,
     format }]), with record.inserted saying which is in each drive at power on
     ({ drive: id }). Uploaded disks are stored by their id.

     A disk is a disk image, or files that become one for whichever drive it goes in (a
     floppy or a CD image; see disk-builder.js): a zip (format 'zip'), or a folder
     (format 'folder', stored as [{ path, file }]). A bin/cue is the cue sheet and the
     files it names (format 'cue', stored like a folder), read in place (see cue.js); a
     zip or folder holding one is read the same way when it goes in a CD drive. */

  get disks() { return this.record.media || []; }
  get inserted() { return this.record.inserted || {}; }
  /* Whether a disk can go in a drive */
  diskFits(disk, drive) {
    let drives = this.constructor.mediaDrives || {};
    if (!drives[drive]) return false;
    if (disk.format == 'cue') return drives[drive].kind == 'cdrom';
    return disk.format == 'zip' || disk.format == 'folder' || (drives[disk.drive] && drives[disk.drive].kind == drives[drive].kind);
  }
  /* The drive a disk probably goes in: from an image's name, or for files, the floppy
     drive if they fit on a floppy (`size` is their total) */
  driveFor(name, size) {
    let drives = this.constructor.mediaDrives || {};
    let kind = size != null ? (size <= 1400 * 1024 ? 'floppy' : 'cdrom') : /\.(iso|cue|bin)$/i.test(name) ? 'cdrom' : 'floppy';
    return Object.keys(drives).find(d => drives[d].kind == kind) || Object.keys(drives)[0];
  }
  /* Add a disk: an image or zip ({ name, file | url }), or a folder or bin/cue ({ name,
     files: [{ path, file }], format }) */
  async addDisk({ name, file, url, files, format, drive }) {
    let disk = { id: 'disk-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7), name };
    let size = null;
    if (files) {
      disk.format = format || 'folder';
      size = files.reduce((n, f) => n + f.file.size, 0);
      await LocalStore.uploadPut(disk.id, files);
      disk.upload = true;
    } else {
      if (/\.zip$/i.test(name)) {
        disk.format = 'zip';
        if (file) size = (await ZipExtractor.parseEntries(file)).reduce((n, e) => n + e.uncompSize, 0);
      }
      if (file) { await LocalStore.uploadPut(disk.id, file); disk.upload = true; }
      else disk.url = url;
    }
    disk.drive = drive || this.driveFor(name, disk.format ? size ?? Infinity : null);
    this.update({ media: [...this.disks, disk] });
    return disk;
  }
  async removeDisk(id) {
    let disk = this.disks.find(d => d.id == id);
    if (disk && disk.upload) { try { await LocalStore.uploadDelete(id); } catch (e) { console.error(e); } }
    let inserted = { ...this.inserted };
    for (let d in inserted) if (inserted[d] == id) delete inserted[d];
    this.update({ media: this.disks.filter(d => d.id != id), inserted });
  }
  updateDisk(id, fields) {
    let inserted = { ...this.inserted };
    if ('drive' in fields) for (let d in inserted) if (inserted[d] == id && d != fields.drive) delete inserted[d];
    this.update({ media: this.disks.map(d => d.id == id ? { ...d, ...fields } : d), inserted });
  }
  /* Record what's in a drive, so it's still there next time */
  setInserted(drive, id) {
    let inserted = { ...this.inserted };
    for (let d in inserted) if (inserted[d] == id) delete inserted[d];
    if (id) inserted[drive] = id; else delete inserted[drive];
    this.update({ inserted });
  }
  /* A disk as the emulator takes it for a drive: { id, name, drive, blob | url }, and
     for a bin/cue, cue: { text, files: [{ name, blob }] } with the files as the cue
     names them, for emulators that read cue sheets themselves */
  async diskMedia(disk, drive = disk.drive) {
    let media = { id: disk.id, name: disk.name, drive };
    let cd = this.constructor.mediaDrives[drive].kind == 'cdrom';
    if (disk.format == 'cue' || ((disk.format == 'zip' || disk.format == 'folder') && cd)) {
      let files = await this.diskFiles(disk);
      if (files.some(f => /\.cue$/i.test(f.path))) return { ...media, ...await CollectionItem.cueMedia(files) };
    }
    if (disk.format == 'zip' || disk.format == 'folder') return { ...media, blob: await this.builtDisk(disk, drive) };
    if (!disk.upload) return { ...media, url: disk.url };
    let blob = await LocalStore.uploadGet(disk.id);
    if (!blob) throw new Error(`The disk "${disk.name}" is missing from browser storage. Remove it and add it again.`);
    // A .bin without its cue: raw sectors, or an ISO by another name
    if (cd && /\.bin$/i.test(disk.name)) {
      let { binImage } = await import('../src/emulators/cue.js');
      let image = await binImage(blob, disk.name);
      if (image.size == blob.size) return { ...media, blob: image };
      let text = `FILE "cd.bin" BINARY\n  TRACK 01 ${image.mode}\n    INDEX 01 00:00:00\n`;
      return { ...media, blob: image, cue: { text, files: [{ name: 'cd.bin', blob }] } };
    }
    return { ...media, blob };
  }
  /* A bin/cue's media, from its files ([{ path, blob }]) */
  static async cueMedia(files) {
    let { cueImage, parseCue } = await import('../src/emulators/cue.js');
    let cue = files.find(f => /\.cue$/i.test(f.path));
    let text = await cue.blob.text(), dir = cue.path.replace(/[^\/]*$/, '');
    // Cue sheets name their files loosely: relative to the cue, in any case, with
    // backslashes, or with a path from the machine they were made on
    let find = name => {
      let want = name.replace(/\\/g, '/').toLowerCase(), base = want.split('/').pop();
      let match = files.find(f => f.path.toLowerCase() == (dir + want).toLowerCase())
        || files.find(f => f.path.toLowerCase().split('/').pop() == base);
      return match ? match.blob : null;
    };
    let named = [];
    for (let { name } of parseCue(text)) {
      let blob = find(name);
      if (!blob) throw new Error(`"${name}", which the cue sheet ${cue.path} names, is missing`);
      named.push({ name, blob });
    }
    return { blob: cueImage(text, find, cue.path.replace(/\.cue$/i, '.iso')), cue: { text, files: named } };
  }
  /* Files picked together, as disks to add: a cue sheet goes with the files it names;
     anything else is a disk of its own */
  static async groupFiles(fileList) {
    let { parseCue } = await import('../src/emulators/cue.js');
    let rest = [...fileList], disks = [];
    for (let cue of rest.filter(f => /\.cue$/i.test(f.name))) {
      let files = [{ path: cue.name, file: cue }];
      for (let { name } of parseCue(await cue.text())) {
        let base = name.replace(/\\/g, '/').split('/').pop();
        let file = rest.find(f => f.name.toLowerCase() == base.toLowerCase());
        if (!file) throw new Error(`Pick ${cue.name} together with the file it names, "${base}"`);
        if (!files.some(x => x.file == file)) files.push({ path: file.name, file });
      }
      rest = rest.filter(f => !files.some(x => x.file == f));
      disks.push({ name: cue.name, files, format: 'cue' });
    }
    return disks.concat(rest.map(file => ({ name: file.name, file })));
  }
  /* A zip or folder disk's files: [{ path, blob, mtime }] */
  async diskFiles(disk) {
    let stored = disk.upload ? await LocalStore.uploadGet(disk.id) : null;
    if (disk.upload && !stored) throw new Error(`The disk "${disk.name}" is missing from browser storage. Remove it and add it again.`);
    if (disk.format == 'folder' || disk.format == 'cue') return stored.map(({ path, file }) => ({ path, blob: file, mtime: file.lastModified }));
    let zip = stored || await LocalStore.fetchBlob(disk.url);
    let files = [];
    for (let en of await ZipExtractor.parseEntries(zip)) {
      let path = en.name.replace(/\\/g, '/');
      if (path.endsWith('/')) continue;
      files.push({ path, blob: await ZipExtractor.entryBlob(zip, en), mtime: en.mtime });
    }
    return files;
  }
  /* A zip or folder disk built as an image for a drive (kept for the session) */
  builtDisk(disk, drive) {
    let kind = this.constructor.mediaDrives[drive].kind, key = disk.id + ':' + kind;
    let cache = CollectionItem.builtDisks ||= new Map();
    if (!cache.has(key)) {
      cache.set(key, (async () => {
        let { buildFloppy, buildIso } = await import('../src/emulators/disk-builder.js');
        let files = await this.diskFiles(disk), label = disk.name.replace(/\.zip$/i, '');
        return kind == 'cdrom' ? buildIso(files, { label }) : buildFloppy(files, { label });
      })());
      cache.get(key).catch(() => cache.delete(key));
    }
    return cache.get(key);
  }
  /* A folder chosen with <input webkitdirectory>, as addDisk() takes it */
  static folderDisk(fileList) {
    let list = [...fileList], top = list.length ? list[0].webkitRelativePath.split('/')[0] : 'Folder';
    return { name: top, files: list.map(file => ({ path: file.webkitRelativePath.split('/').slice(1).join('/'), file })) };
  }
  /* The disks in the drives at power on */
  async bootMedia() {
    let inserted = this.inserted;
    let disks = Object.entries(inserted).map(([drive, id]) => {
      let disk = this.disks.find(d => d.id == id);
      return disk && { ...disk, drive };
    }).filter(Boolean);
    return this.mediaFor(disks);
  }
  /* Disks as the emulator takes them. One that can't be had (missing, or too big for a
     floppy) is left out with a warning, rather than stopping the machine booting. */
  async mediaFor(disks) {
    let out = [];
    for (let d of disks) {
      try { out.push(await this.diskMedia(d)); }
      catch (e) { console.warn(`Emularity: leaving out the disk "${d.name}":`, e.message); }
    }
    return out;
  }

  /* Fill in fields that older saved records lack. Returns true if anything changed. */
  normalize() {
    let r = this.record, changed = false;
    if (!r.thumb) {
      let id = this.archiveId;
      if (id) { r.identifier = r.identifier || id; r.thumb = ArchiveOrg.thumbUrl(id); changed = true; }
    }
    if (r.added == null) {
      // ids look like "sw-<timestamp>-<n>"; recover the creation time
      let m = /^sw-(\d+)-/.exec(r.id || '');
      r.added = m ? +m[1] : 0;
      changed = true;
    }
    return changed;
  }
  update(fields) {
    Object.assign(this.record, fields);
    this.render();
    this.emit('itemchange');
  }
  emit(type) {
    this.dispatchEvent(new CustomEvent(type));
  }

  /* ----- Card ----- */

  connectedCallback() {
    if (this.built) return; // reordering the grid re-connects us; build only once
    this.built = true;
    this.classList.add('game-card');
    this.innerHTML = `
      <div class="game-info">
        <span class="game-title"></span>
        <span class="game-detail"></span>
        <span class="game-lastplayed"></span>
        <span class="game-storage"></span>
      </div>
      <button class="game-menu" title="More options">⋮</button>
      <div class="game-menu-popup"></div>
      <div class="game-progress"><div class="game-progress-fill"></div></div>`;
    this.addEventListener('click', () => this.launch());
    this.querySelector('.game-menu').addEventListener('click', ev => {
      ev.stopPropagation();
      if (this.menuOpen) this.closeMenu();
      else { this.emit('menuopen'); this.querySelector('.game-menu-popup').classList.add('open'); }
    });
    this.querySelector('.game-menu-popup').addEventListener('click', ev => ev.stopPropagation());
    this.render();
  }
  get menuOpen() { return this.querySelector('.game-menu-popup')?.classList.contains('open'); }
  closeMenu() { this.querySelector('.game-menu-popup')?.classList.remove('open'); }

  render() {
    if (!this.built) return;
    let r = this.record;
    this.dataset.id = r.id;
    this.activeProgress = null; // drop updates still queued from a finished operation
    this.classList.remove('busy');
    this.querySelector('.game-progress-fill').style.transform = '';

    let thumb = this.thumb;
    if (thumb !== this.shownThumb) {
      this.shownThumb = thumb;
      this.querySelector('.game-thumb')?.remove();
      if (thumb) {
        let img = document.createElement('img');
        img.className = 'game-thumb';
        img.loading = 'lazy';
        img.src = thumb;
        img.addEventListener('error', () => img.remove());
        this.prepend(img);
      }
    }
    this.querySelector('.game-title').textContent = r.title;
    let detail = r.source == 'upload' ? r.filename + ' (uploaded)' : r.filename;
    let size = Format.bytes(r.size);
    this.querySelector('.game-detail').textContent = size ? detail + ' · ' + size : detail;
    this.querySelector('.game-lastplayed').textContent = r.lastPlayed ? 'Played ' + Format.relativeTime(r.lastPlayed) : 'Never played';
    this.querySelector('.game-storage').textContent = this.storageLabel;

    let popup = this.querySelector('.game-menu-popup');
    popup.replaceChildren(...this.menuActions().map(([cls, label, action]) => {
      let btn = document.createElement('button');
      btn.className = cls;
      btn.textContent = label;
      btn.addEventListener('click', () => { this.closeMenu(); action(); });
      return btn;
    }));
  }
  /* [className, label, action] for each entry in the card's menu */
  menuActions() {
    let r = this.record, disk = LocalStore.supportsDisk(), actions = [];
    actions.push(['menu-edit', '✎ Edit info', () => this.emit('itemedit')]);
    if (disk && this.canInstall()) {
      actions.push(['menu-install', r.installed ? '🖴 Uninstall from disk' : '🖴 Install to disk…', () => r.installed ? this.uninstall() : this.install()]);
    }
    if (this.isSingleFile) actions.push(['menu-cache', r.cached ? '📥 Remove from device' : '📥 Cache on device', () => r.cached ? this.uncache() : this.cache()]);
    if (disk && this.isSingleFile) {
      actions.push(['menu-clone', r.cloned ? '💾 Remove disk clone' : '💾 Clone to disk…', () => r.cloned ? this.unclone() : this.clone()]);
    }
    actions.push(['menu-instance', '⧉ New instance…', () => this.emit('iteminstance')]);
    actions.push(['menu-reset', '⟲ Reset saved data', () => this.resetSaves()]);
    actions.push(['menu-delete', '✕ Remove from collection', () => this.removeFromCollection()]);
    return actions;
  }

  /* Show progress on the card: a fill bar at the bottom and a status line in place of
     the storage badge, until the next render() or progress(). Returns an onProgress(loaded, total).
     A fast operation can report hundreds of times per frame (once per extracted file),
     so updates are coalesced to one per animation frame and only touch the DOM when the
     visible value changes. */
  progress(label) {
    let token = this.activeProgress = {};
    let fill = this.querySelector('.game-progress-fill'), status = this.querySelector('.game-storage');
    this.classList.add('busy');
    status.textContent = label + '…';
    let pending = null, scheduled = false, lastPct = -1, lastText = null;
    let flush = () => {
      scheduled = false;
      if (this.activeProgress !== token) return;
      let pct = pending.total ? Math.round(pending.loaded / pending.total * 100) : null;
      if (pct !== lastPct) { fill.style.transform = 'scaleX(' + (pct != null ? pct / 100 : 1) + ')'; lastPct = pct; }
      let text = label + (pct != null ? ' ' + pct + '%' : ' ' + Format.bytes(pending.loaded));
      if (text !== lastText) { status.textContent = text; lastText = text; }
    };
    return (loaded, total) => {
      pending = { loaded, total };
      if (!scheduled) { scheduled = true; requestAnimationFrame(flush); }
    };
  }

  /* ----- Software data ----- */

  /* Fill in the download size via a HEAD request (Content-Length is a CORS-safelisted
     header, so it's readable cross-origin), or from the uploaded file. */
  async fetchSize() {
    let r = this.record;
    if (r.size != null) return;
    try {
      if (r.url) {
        let len = (await fetch(r.url, { method: 'HEAD' })).headers.get('Content-Length');
        if (len) this.update({ size: +len });
      } else if (r.source == 'upload') {
        let blob = await LocalStore.uploadGet(r.id);
        if (blob) this.update({ size: blob.size });
      }
    } catch (e) { /* leave size unknown */ }
  }
  /* The best local copy of the software (on-disk clone, device cache, then upload) */
  async localCopy() {
    let r = this.record, blob = null;
    if (r.cloned && r.diskName) blob = await LocalStore.diskGet(r.diskName);
    if (!blob && r.cached) blob = await LocalStore.cacheGet(r.id);
    if (!blob && r.source == 'upload') blob = await LocalStore.uploadGet(r.id);
    return blob;
  }
  /* The software as a Blob, only hitting the network as a last resort */
  async fetchBlob(onProgress) {
    return (await this.localCopy()) || await LocalStore.fetchBlob(this.record.url, onProgress);
  }
  /* The software to boot: a local copy as a Blob, or null to use the remote URL */
  async media() {
    let blob = await this.localCopy();
    if (!blob && this.record.source == 'upload') throw new Error('The uploaded file for this title is missing from browser storage. Remove it and add it again.');
    return blob;
  }
  async mediaURL() {
    let blob = await this.media();
    return blob ? URL.createObjectURL(blob) : this.record.url;
  }

  /* ----- Menu actions ----- */

  async cache() {
    let r = this.record;
    if (r.size && !confirm(`Cache "${r.title}" (${Format.bytes(r.size)}) on this device for instant, offline play?`)) return;
    let onProgress = this.progress('Caching');
    try {
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
      if (r.source == 'upload') await LocalStore.cachePut(r.id, await LocalStore.uploadGet(r.id));
      else await LocalStore.cacheStream(r.id, r.url, onProgress);
      this.update({ cached: true });
    } catch (e) {
      console.error(e);
      alert('Failed to cache on device: ' + e.message);
      this.render();
    }
  }
  async uncache() {
    await LocalStore.cacheDelete(this.record.id);
    this.update({ cached: false });
  }
  async clone() {
    let r = this.record, diskName = this.diskName;
    let onProgress = this.progress('Cloning to disk');
    try {
      if (r.source == 'upload') await LocalStore.diskPut(diskName, await LocalStore.uploadGet(r.id));
      else await LocalStore.diskStream(diskName, r.url, onProgress);
      this.update({ cloned: true, diskName });
    } catch (e) {
      if (e.name != 'AbortError') { console.error(e); alert('Failed to clone to disk: ' + e.message); }
      this.render();
    }
  }
  async unclone() {
    let r = this.record;
    if (!confirm(`Delete the on-disk copy of "${r.title}"? This removes the real file from your folder.`)) return;
    if (r.diskName) await LocalStore.diskDelete(r.diskName);
    this.update({ cloned: false, diskName: undefined });
  }
  async resetSaves() {
    if (!confirm(`Reset saved data for "${this.record.title}"? Saves, high scores, and settings written by this title will be permanently erased. The software itself stays in your collection.`)) return;
    await new Promise((resolve, reject) => {
      let req = indexedDB.deleteDatabase(this.persistStore);
      req.onsuccess = resolve;
      req.onblocked = resolve; // nothing holds the db open in the library view
      req.onerror = () => reject(req.error);
    }).catch(e => alert('Failed to reset saved data: ' + e));
  }
  async removeFromCollection() {
    if (!confirm(`Remove "${this.record.title}" from your collection?`)) return;
    await this.deleteStoredData();
    this.emit('itemremove');
  }
  /* Delete every local copy of the software (but not its saves) */
  async deleteStoredData() {
    let r = this.record;
    if (r.source == 'upload') { try { await LocalStore.uploadDelete(r.id); } catch (e) { console.error(e); } }
    if (r.cached) await LocalStore.cacheDelete(r.id);
    if (r.cloned && r.diskName) await LocalStore.diskDelete(r.diskName);
    for (let disk of this.disks) if (disk.upload) { try { await LocalStore.uploadDelete(disk.id); } catch (e) { console.error(e); } }
  }

  /* ----- Playing ----- */

  /* Start playing (from the card's click, a user gesture) */
  async launch() {
    await this.beforeLaunch();
    location.hash = 'play/' + this.record.id;
  }
  /* Work that needs a user gesture before the game boots (or reboots) */
  async beforeLaunch() {}

  /* Build the emulator element that plays this title. Throws if the software is
     unavailable. */
  async buildEmulator() {
    let emu = await this.createEmulator();
    if (!this.record.installed) emu.setAttribute('persist', this.persistStore);
    if (this.constructor.onscreenKeyboard) {
      let keyboard = document.createElement('emularity-keyboard');
      keyboard.setAttribute('layout', 'pc101');
      emu.appendChild(keyboard);
    }
    return emu;
  }
  /* Platform-specific emulator setup, overridden by each subclass */
  async createEmulator() {
    throw new Error('Unknown platform: ' + this.record.platform);
  }
  /* A new emulator element. Waits until the element is registered: on a reload that
     lands directly on #play/<id> we can get here before the deferred emularity.js
     module defines it, and an un-upgraded element would later re-run its constructor
     and class fields, wiping properties we set on it (e.g. a disk handle). */
  async newEmulator(tag, wasmroot) {
    await customElements.whenDefined(tag);
    let emu = document.createElement(tag);
    emu.setAttribute('wasmroot', wasmroot);
    emu.setAttribute('splashlogo', '../logos/emularity-transparent.png');
    return emu;
  }
}

class DosItem extends CollectionItem {
  static key = 'dos';
  static label = 'IBM PC';
  static sublabel = 'DOSBox';
  static sources = [new ArchiveOrgSource('emulator:(dosbox)')];
  static accept = '.zip,.img,.ima';
  static hint = 'A zip file, mounted as drive C:';
  static exeField = true;
  static mediaDrives = {
    fda: { label: 'Floppy A:', kind: 'floppy' },
    fdb: { label: 'Floppy B:', kind: 'floppy' },
    cdrom: { label: 'CD-ROM D:', kind: 'cdrom' },
  };

  /* DOSBox mounts every disk at power on (and swaps between them), with each drive's
     inserted disk first */
  async bootMedia() {
    let inserted = this.inserted;
    let disks = this.disks.filter(d => this.constructor.mediaDrives[d.drive]);
    disks.sort((a, b) => (inserted[b.drive] == b.id) - (inserted[a.drive] == a.id));
    return this.mediaFor(disks);
  }

  // "Install to disk" extracts the zip into a working folder, so it only applies to
  // zip-based titles; raw disk images stay on Clone/Cache.
  canInstall() { return /\.zip$/i.test(this.record.filename || ''); }

  /* Convert an archive.org-style start path ('GAMEDIR/GAME.EXE') into autoexec commands */
  get autoexec() {
    let exe = this.record.exe;
    if (!exe) return '';
    if (exe.includes('\n') || /^[a-z]:/i.test(exe)) return exe; // already explicit commands
    let parts = exe.replace(/\\/g, '/').split('/').filter(p => p.length);
    let prog = parts.pop();
    let lines = ['c:'];
    if (parts.length) lines.push('cd \\' + parts.join('\\'));
    lines.push(prog);
    return lines.join('\n');
  }

  async install() {
    let r = this.record;
    let onProgress = this.progress(this.hasLocalCopy ? 'Loading' : 'Downloading');
    try {
      let blob = await this.fetchBlob(onProgress);
      if (!blob) throw new Error('could not read game data');
      let root = await LocalStore.getDiskDir(true); // prompts for a folder the first time
      let installDir = this.diskName.replace(/\.[^.]+$/, '') || r.id;
      let gameDir = await root.getDirectoryHandle(installDir, { create: true });
      let cDir = await gameDir.getDirectoryHandle('c', { create: true });
      await ZipExtractor.extractTo(blob, cDir, this.progress('Extracting'));
      await this.migrateSavesToDisk(gameDir);
      this.update({ installed: true, installDir });
    } catch (e) {
      if (e.name != 'AbortError') { console.error(e); alert('Failed to install to disk: ' + e.message); }
      this.render();
    }
  }
  async uninstall() {
    if (!confirm(`Delete the installed folder for "${this.record.title}" from your disk? Saved games inside it will be lost.`)) return;
    await this.deleteInstallDir();
    this.update({ installed: false, installDir: undefined });
  }
  async deleteInstallDir() {
    if (this.record.installDir) await LocalStore.diskDelete(this.record.installDir, { recursive: true });
  }
  async deleteStoredData() {
    await super.deleteStoredData();
    if (this.record.installed) await this.deleteInstallDir();
  }
  /* Merge saves the title accumulated while streaming/cached (its persist store) into
     the just-extracted disk folder, then retire the store so the folder is the single
     source of truth. Best-effort: a failure here must not fail the install. */
  async migrateSavesToDisk(gameDir) {
    let delta;
    try { delta = await this.readSavedWrites(); }
    catch (e) { console.warn('Emularity: could not read saved data to migrate', e); return; }
    if (!delta || (delta.files.size === 0 && !delta.deleteLog)) return; // nothing saved yet
    // Apply deletions first (files removed during play), then overlay the writes, so
    // a delete-then-recreate in the same session lands as the recreated file.
    for (let line of delta.deleteLog.split('\n')) {
      if (line && line[0] === 'd') { try { await LocalStore.removePath(gameDir, line.slice(1)); } catch (e) {} }
    }
    let migrated = 0;
    for (let [path, bytes] of delta.files) {
      try { await LocalStore.writePath(gameDir, path, bytes); migrated++; }
      catch (e) { console.warn('Emularity: failed to migrate save', path, e); }
    }
    // The disk folder now holds these saves; drop the redundant store so installed
    // games stay single-sourced (a stale store previously showed an empty drive).
    try { indexedDB.deleteDatabase(this.persistStore); } catch (e) {}
    if (migrated) console.log('Emularity: migrated ' + migrated + ' saved file(s) to disk for "' + this.record.title + '"');
  }
  /* Read the OverlayFS writable delta in the persist store. Returns
     { files: Map<path, Uint8Array>, deleteLog: string }, or null if the store was never
     created. Temporarily re-points the BrowserFS global, which every play and extract
     re-initializes, so this is safe between those. */
  async readSavedWrites() {
    let storeName = this.persistStore;
    // Avoid materializing an empty store when the title was never played with
    // persistence (the common install-first case).
    if (indexedDB.databases) {
      try { if (!(await indexedDB.databases()).some(d => d.name === storeName)) return null; }
      catch (e) { /* databases() unsupported; fall through and open it */ }
    }
    let store = await new Promise(resolve => {
      let fs = new BrowserFS.FileSystem.IndexedDB(err => resolve(err ? null : fs), storeName);
    });
    if (!store) return null;
    BrowserFS.initialize(store);
    let fs = BrowserFS.BFSRequire('fs');
    let readdir = p => new Promise(r => fs.readdir(p, (e, n) => r(e ? [] : n)));
    let stat = p => new Promise(r => fs.stat(p, (e, s) => r(e ? null : s)));
    let readFile = p => new Promise(r => fs.readFile(p, (e, d) => r(e ? null : d)));
    let files = new Map(), deleteLog = '';
    let walk = async dir => {
      for (let name of await readdir(dir)) {
        let full = dir === '/' ? '/' + name : dir + '/' + name;
        let st = await stat(full);
        if (!st) continue;
        if (st.isDirectory()) await walk(full);
        else {
          let data = await readFile(full);
          if (data == null) continue;
          if (full === '/.deletedFiles.log') deleteLog = data.toString('utf8');
          else files.set(full, new Uint8Array(data));
        }
      }
    };
    await walk('/');
    // Close the underlying IndexedDB connection so a later deleteDatabase() isn't
    // blocked by it staying open.
    try { store.store.db.close(); } catch (e) {}
    return { files, deleteLog };
  }

  // Re-acquire the install folder's permission while we still have a user gesture, so
  // the game can boot from disk after a reload.
  async beforeLaunch() {
    if (this.record.installed) { try { await LocalStore.getDiskDir(false); } catch (e) {} }
  }

  async createEmulator() {
    let r = this.record;
    let emu = await this.newEmulator('emularity-dosbox', '../emulators/dosbox');
    emu.media = await this.bootMedia();
    // Append `exit` so DOSBox quits when the program exits (fires the emulator's exit
    // event) instead of dropping the user to a bare DOS prompt.
    if (r.exe) emu.setAttribute('exe', this.autoexec + '\nexit');
    // Installed to disk: run from the real folder (writes mirror back live) instead of
    // a mounted zip. Falls back to the normal media if the folder is unavailable (e.g.
    // access wasn't re-granted after a reload), without persistence.
    let gameDir = null;
    if (r.installed && r.installDir) {
      try { let root = await LocalStore.getDiskDir(false); if (root) gameDir = await root.getDirectoryHandle(r.installDir); }
      catch (e) { console.warn('Emularity: installed folder unavailable; playing a fresh copy without persistence.', e); }
    }
    if (gameDir) {
      emu.diskHandle = gameDir;
      let drive = document.createElement('emularity-dosbox-drive');
      drive.setAttribute('letter', 'c');
      emu.appendChild(drive);
    } else if (/\.(img|ima)$/i.test(r.filename)) {
      // A floppy image: in drive A: (after any disk chosen for it, as A:'s first)
      let blob = await this.media(), main = { id: 'main', name: r.filename || r.title, drive: 'fda' };
      if (blob) main.blob = blob; else main.url = r.url;
      emu.media = this.inserted.fda ? [...emu.media, main] : [main, ...emu.media];
    } else {
      let media = document.createElement('emularity-dosbox-drive');
      media.setAttribute('letter', 'c');
      media.setAttribute('url', await this.mediaURL());
      media.setAttribute('label', r.title);
      emu.appendChild(media);
    }
    return emu;
  }
}

class X86Item extends CollectionItem {
  static key = 'x86';
  static label = 'x86 PC';
  static sublabel = 'v86';
  static sources = [new V86CatalogSource('../emulators/v86/catalog.json'), new ArchiveOrgSource('emulator:(v86)')];
  static accept = '.iso,.img,.raw,.qcow2,.hdd,.bin';
  static hint = 'A bootable CD-ROM (.iso) or hard-disk image (.img). Boots a full x86 PC — e.g. a Linux install/live disc.';
  static onscreenKeyboard = false; // v86 takes input on its own canvas
  static captureMouseField = true;
  static networkField = true;
  static mediaDrives = {
    fda: { label: 'Floppy A:', kind: 'floppy' },
    fdb: { label: 'Floppy B:', kind: 'floppy' },
    cdrom: { label: 'CD-ROM', kind: 'cdrom' },
  };

  /* Starter content: two bundled demos, a graphical TinyCore desktop and a tiny
     serial-console Linux shell */
  static starterRecords() {
    return [
      { id: 'demo-tinycore', platform: 'x86', title: 'TinyCore Linux (graphical)', source: 'url',
        url: '../emulators/v86/images/tinycore.iso', filename: 'tinycore.iso', memory: 512, added: Date.now() },
      { id: 'demo-linux-shell', platform: 'x86', title: 'Linux shell (serial console)', source: 'url',
        url: '../emulators/v86/images/linux4.iso', filename: 'linux4.iso', console: 'serial', added: Date.now() - 1 },
    ];
  }
  normalize() {
    let changed = super.normalize(), r = this.record;
    // Older Arch records: an option v86 never read (so the guest got an NE2000 it has
    // no driver loaded for), and seed files from a removed experiment
    if (r.v86opts && r.v86opts.net_device_type) {
      r.v86opts.net_device = { type: r.v86opts.net_device_type };
      delete r.v86opts.net_device_type;
      changed = true;
    }
    if (r.bootfiles) { delete r.bootfiles; changed = true; }
    // The Arch item from the old ?addarch trigger: copy.sh paths moved under /copysh/
    let fs = r.v86opts && r.v86opts.filesystem;
    if (fs && fs.baseurl == '/arch/') {
      fs.baseurl = V86CatalogSource.host + 'arch/';
      if (fs.basefs) fs.basefs.url = V86CatalogSource.host + 'fs.json';
      r.source = 'catalog';
      changed = true;
    }
    return changed;
  }

  /* ----- Hard disk size -----
     A new instance can have a bigger hard disk than the original. Its FAT16 partition
     is repacked onto a disk of the new size (see fat-repack.js), stored once as the
     packed data at its front (record.disk: { template, size }); instances of the same
     disk at the same size share it. Untouched space reads as zeros, so only what's
     written takes room. */

  /* Where the hard disk comes from, for resizing: something imageReader() reads, or
     null if this title has no hard disk image */
  async hardDiskSource() {
    let r = this.record;
    if (r.disk) return this.hardDiskFile();
    if (r.v86opts) return r.v86opts.hda && r.v86opts.hda.url ? r.v86opts.hda : null;
    if (!/\.(img|raw|hdd|bin)$/i.test(r.filename || '') || r.imagetype && r.imagetype != 'hda') return null;
    return (await this.media()) || r.url;
  }
  /* Identifies the source disk, for sharing built disks */
  get hardDiskKey() {
    let r = this.record;
    if (r.disk) return r.disk.template;
    if (r.v86opts) return r.v86opts.hda && r.v86opts.hda.url;
    return r.source == 'upload' ? 'upload:' + r.id : r.url;
  }
  /* The hard disk's size in bytes, when known */
  get hardDiskSize() {
    let r = this.record;
    return r.disk ? r.disk.size : r.v86opts ? r.v86opts.hda && r.v86opts.hda.size : (r.filename && /\.(img|raw|hdd|bin)$/i.test(r.filename) && r.size) || null;
  }
  get canResizeDisk() {
    let r = this.record;
    return !!(r.disk || (r.v86opts ? r.v86opts.hda && r.v86opts.hda.url : /\.(img|raw|hdd|bin)$/i.test(r.filename || '')));
  }
  async hardDiskFile() {
    let { sparseFile } = await import('../src/emulators/disk-image.js');
    let prefix = await LocalStore.uploadGet(this.record.disk.template);
    if (!prefix) throw new Error("This machine's hard disk is missing from browser storage.");
    return sparseFile(prefix, this.record.disk.size, 'hda.img');
  }
  /* Build (or find) this title's hard disk at a new size: { template, size } */
  async buildDisk(size, onProgress) {
    let { repackFat16, roundDiskSize } = await import('../src/emulators/fat-repack.js');
    let { imageReader } = await import('../src/emulators/disk-image.js');
    let key = this.hardDiskKey, hash = 0;
    for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) | 0;
    let template = 'hdd-' + (hash >>> 0).toString(36) + '-' + Math.round(size / 1048576) + 'm';
    // Built before (for another instance)? The same size always gives the same disk.
    if (await LocalStore.uploadGet(template)) return { template, size: roundDiskSize(size) };
    let read = imageReader(await this.hardDiskSource());
    let disk = await repackFat16({ read, size, onProgress });
    let blob = new Blob(disk.parts);
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    await LocalStore.uploadPut(template, blob);
    return { template, size: disk.byteLength };
  }

  async createEmulator() {
    let r = this.record;
    let emu = await this.newEmulator('emularity-x86', '../emulators/v86');
    if (r.memory) emu.setAttribute('memory', String(r.memory));
    if (r.console) emu.setAttribute('console', r.console); // 'serial' for serial-only images
    if (r.captureMouse) emu.setAttribute('capturemouse', '');
    if (r.network) {
      emu.setAttribute('network', r.network);
      emu.setAttribute('hostname', this.hostname);
      emu.setAttribute('label', r.title);
      let uplink = document.querySelector('emularity-collection')?.getAttribute('uplink');
      if (uplink) emu.setAttribute('uplink', uplink);
    }
    emu.imagename = r.filename || '';
    emu.media = await this.bootMedia();
    if (r.disk) {
      // A hard disk built bigger than the original (see buildDisk)
      emu.v86opts = { ...(r.v86opts || {}), hda: { buffer: await this.hardDiskFile(), async: true } };
    } else if (r.v86opts) {
      // A full distro: kernel + lazily-fetched 9p root filesystem, passed straight to
      // v86, with no single boot image.
      emu.v86opts = r.v86opts;
    } else {
      if (r.imagetype) emu.setAttribute('imagetype', r.imagetype);
      // A local copy boots as an in-memory image; a remote URL streams on demand via
      // HTTP range requests instead of downloading it all.
      let blob = await this.media();
      if (blob) emu.imageBlob = blob;
      else emu.setAttribute('image', r.url);
    }
    return emu;
  }
}
