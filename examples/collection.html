class X86Item extends CollectionItem {
  static key = 'x86';
  static label = 'x86 PC';
  static sublabel = 'v86';
  static sources = [new V86CatalogSource('../emulators/v86/catalog.json'), new ArchiveOrgSource('emulator:(v86)')];
  static accept = '.iso,.img,.raw,.qcow2,.hdd,.bin';
  static hint = 'A bootable CD-ROM (.iso) or hard-disk image (.img). Boots a full x86 PC — e.g. a Linux install/live disc.';
  static onscreenKeyboard = false; // v86 takes input on its own canvas
  static captureMouseField = true;
  static networkField = true;
  static mediaDrives = {
    fda: { label: 'Floppy A:', kind: 'floppy' },
    fdb: { label: 'Floppy B:', kind: 'floppy' },
    cdrom: { label: 'CD-ROM', kind: 'cdrom' },
  };

  /* ----- Systems -----
     A PC put together in the add dialog rather than booted from an image (record.source
     'system'): blank hard disks (record.hardDisks: { hda: { size }, hdb: { size } }),
     kept as files in the browser's private file system (see file-disk.js) and saved as
     they're written, plus its hardware (cpu, memory, vgaMemory, netCard, acpi,
     bootOrder). Floppies and CDs come from its disks, as for any title. */
  static newSystem = true;
  static HARD_DISK_SIZES = [512, 1024, 2048, 4096, 8192, 16384, 32768].map(mb => mb * 1048576);
  static MEMORY_SIZES = [16, 32, 64, 128, 256, 512, 1024, 2048, 3072, 4096, 8192];
  /* The CPU picks the emulator build: v86 (32-bit, upstream), or the v86_64 fork, which
     adds 64-bit long mode and runs 32-bit guests too. maxMemory is in MB; v86_64 above
     3 GB needs the browser's 64-bit wasm memory (not Safari). */
  static CPUS = {
    i686: { label: '32-bit (i686, v86)', root: '../emulators/v86', maxMemory: 1024 },
    x86_64: { label: '64-bit (x86-64, v86_64, experimental)', root: '../emulators/v86_64', maxMemory: 8192 },
  };
  static memorySizes(cpu) {
    let max = (this.CPUS[cpu] || this.CPUS.i686).maxMemory;
    return this.MEMORY_SIZES.filter(mb => mb <= max).map(mb => [mb, mb < 1024 ? mb + ' MB' : mb / 1024 + ' GB']);
  }
  /* Refill a memory <select> for the CPU chosen, keeping its value where that's allowed */
  static cpuChanged(cpuSelect, memorySelect) {
    let memory = +memorySelect.value, sizes = this.memorySizes(cpuSelect.value);
    memorySelect.replaceChildren(...sizes.map(([mb, label]) => new Option(label, mb)));
    memorySelect.value = Math.min(memory, sizes[sizes.length - 1][0]);
  }
  static VGA_MEMORY_SIZES = [2, 4, 8, 16, 32];
  static NET_CARDS = { ne2k: 'NE2000 (DOS, Windows 9x, Linux)', virtio: 'virtio (Linux)', none: 'None' };
  /* Which drive the BIOS tries first (record.bootOrder), as SeaBIOS's priority nibbles
     (1 floppy, 2 hard disk, 3 CD-ROM; the lowest nibble goes first). A drive with
     nothing bootable in it is skipped, so "hard disk first" still starts an installer
     CD while the disk is blank. */
  static BOOT_ORDERS = {
    '': ['Automatic (usually CD-ROM first)'],
    hd: ['Hard disk, then CD-ROM', 0x132],
    cd: ['CD-ROM, then hard disk', 0x123],
    floppy: ['Floppy, then hard disk', 0x321],
  };
  /* A system's record, from the add dialog's choices */
  static systemRecord({ title, cpu, hda, hdb, memory, vgaMemory, netCard, acpi, network }) {
    // Whole cylinders (16 heads x 63 sectors), as the BIOS sees disks
    let round = size => Math.ceil(size / 516096) * 516096;
    let hardDisks = { hda: { size: round(hda) } };
    if (hdb) hardDisks.hdb = { size: round(hdb) };
    return { title, source: 'system', filename: '', hardDisks, cpu: cpu == 'i686' ? undefined : cpu, memory, vgaMemory, netCard, acpi: acpi || undefined,
      network: network || undefined };
  }
  get isSystem() { return this.record.source == 'system'; }
  /* Where a system's hard disk is kept */
  diskPath(drive) { return `emularity/disks/${this.record.id}/${drive}.img`; }
  get detail() {
    let r = this.record;
    if (!this.isSystem) return super.detail;
    let disks = Object.values(r.hardDisks || {}).map(d => Format.bytes(d.size)).join(' + ');
    return `${r.memory} MB RAM · ${disks} hard disk${r.hardDisks && r.hardDisks.hdb ? 's' : ''}`;
  }
  menuActions() {
    let actions = super.menuActions();
    if (!this.isSystem) return actions;
    let reset = actions.find(a => a[0] == 'menu-reset');
    if (reset) reset[1] = '⟲ Erase hard disks…';
    actions.splice(actions.indexOf(reset), 0, ['menu-export', '⇩ Export hard disk…', () => this.exportHardDisk('hda')]);
    return actions;
  }
  /* Save a hard disk as a raw image file, for other emulators (or a real disk) */
  async exportHardDisk(drive) {
    let { exportDisk } = await import('../src/emulators/file-disk.js');
    let name = (this.record.title.replace(/[^\w.-]+/g, '-').replace(/^-+|-+$/g, '') || 'pc') + (drive == 'hda' ? '' : '-' + drive) + '.img';
    let size = this.record.hardDisks[drive].size, saved;
    try { saved = await exportDisk(this.diskPath(drive), size, name, this.progress('Exporting hard disk')); }
    catch (e) { console.error(e); this.render(); alert('Failed to export the hard disk: ' + e.message); return; }
    this.render();
    if (saved) this.notice(`Saved ${name} (${Format.bytes(size)})`);
  }
  async resetSaves() {
    if (!this.isSystem) return super.resetSaves();
    if (!confirm(`Erase the hard disks of "${this.record.title}"? Everything on them is permanently deleted, and it starts again with blank disks.`)) return;
    try {
      let { removeDisk } = await import('../src/emulators/file-disk.js');
      await removeDisk(`emularity/disks/${this.record.id}`);
      await new Promise((resolve, reject) => {
        let req = indexedDB.deleteDatabase(this.persistStore); // floppy changes
        req.onsuccess = req.onblocked = resolve;
        req.onerror = () => reject(req.error);
      });
    } catch (e) {
      alert('Failed to erase the hard disks: ' + e.message);
    }
  }
  async deleteStoredData() {
    await super.deleteStoredData();
    if (!this.isSystem) return;
    let { removeDisk } = await import('../src/emulators/file-disk.js');
    try { await removeDisk(`emularity/disks/${this.record.id}`); } catch (e) { console.error(e); }
  }
  /* Copy another system's hard disks onto this one's */
  async copyHardDisksFrom(other) {
    let { copyDisk } = await import('../src/emulators/file-disk.js');
    for (let drive in this.record.hardDisks || {}) {
      await copyDisk(other.diskPath(drive), this.diskPath(drive), this.progress('Copying hard disk ' + (drive == 'hda' ? 1 : 2)));
    }
    this.render();
  }
  /* How much of each hard disk is in use: { hda: bytes, ... } */
  async hardDiskUsage() {
    let { diskUsage } = await import('../src/emulators/file-disk.js'), used = {};
    for (let drive in this.record.hardDisks || {}) used[drive] = await diskUsage(this.diskPath(drive));
    return used;
  }

  /* Starter content: two bundled demos, a graphical TinyCore desktop and a tiny
     serial-console Linux shell */
  static starterRecords() {
    return [
      { id: 'demo-tinycore', platform: 'x86', title: 'TinyCore Linux (graphical)', source: 'url',
        url: '../emulators/v86/images/tinycore.iso', filename: 'tinycore.iso', memory: 512, added: Date.now() },
      { id: 'demo-linux-shell', platform: 'x86', title: 'Linux shell (serial console)', source: 'url',
        url: '../emulators/v86/images/linux4.iso', filename: 'linux4.iso', console: 'serial', added: Date.now() - 1 },
    ];
  }
  normalize() {
    let changed = super.normalize(), r = this.record;
    // Older Arch records: an option v86 never read (so the guest got an NE2000 it has
    // no driver loaded for), and seed files from a removed experiment
    if (r.v86opts && r.v86opts.net_device_type) {
      r.v86opts.net_device = { type: r.v86opts.net_device_type };
      delete r.v86opts.net_device_type;
      changed = true;
    }
    if (r.bootfiles) { delete r.bootfiles; changed = true; }
    // The Arch item from the old ?addarch trigger: copy.sh paths moved under /copysh/
    let fs = r.v86opts && r.v86opts.filesystem;
    if (fs && fs.baseurl == '/arch/') {
      fs.baseurl = V86CatalogSource.host + 'arch/';
      if (fs.basefs) fs.basefs.url = V86CatalogSource.host + 'fs.json';
      r.source = 'catalog';
      changed = true;
    }
    return changed;
  }

  /* ----- Hard disk size -----
     A new instance can have a bigger hard disk than the original. Its FAT16 partition
     is repacked onto a disk of the new size (see fat-repack.js), stored once as the
     packed data at its front (record.disk: { template, size }); instances of the same
     disk at the same size share it. Untouched space reads as zeros, so only what's
     written takes room. */

  /* Where the hard disk comes from, for resizing: something imageReader() reads, or
     null if this title has no hard disk image */
  async hardDiskSource() {
    let r = this.record;
    if (r.disk) return this.hardDiskFile();
    if (r.v86opts) return r.v86opts.hda && r.v86opts.hda.url ? r.v86opts.hda : null;
    if (!/\.(img|raw|hdd|bin)$/i.test(r.filename || '') || r.imagetype && r.imagetype != 'hda') return null;
    return (await this.media()) || r.url;
  }
  /* Identifies the source disk, for sharing built disks */
  get hardDiskKey() {
    let r = this.record;
    if (r.disk) return r.disk.template;
    if (r.v86opts) return r.v86opts.hda && r.v86opts.hda.url;
    return r.source == 'upload' ? 'upload:' + r.id : r.url;
  }
  /* The hard disk's size in bytes, when known */
  get hardDiskSize() {
    let r = this.record;
    return r.disk ? r.disk.size : r.v86opts ? r.v86opts.hda && r.v86opts.hda.size : (r.filename && /\.(img|raw|hdd|bin)$/i.test(r.filename) && r.size) || null;
  }
  get canResizeDisk() {
    let r = this.record;
    return !!(r.disk || (r.v86opts ? r.v86opts.hda && r.v86opts.hda.url : /\.(img|raw|hdd|bin)$/i.test(r.filename || '')));
  }
  async hardDiskFile() {
    let { sparseFile } = await import('../src/emulators/disk-image.js');
    let prefix = await LocalStore.uploadGet(this.record.disk.template);
    if (!prefix) throw new Error("This machine's hard disk is missing from browser storage.");
    return sparseFile(prefix, this.record.disk.size, 'hda.img');
  }
  /* Build (or find) this title's hard disk at a new size: { template, size } */
  async buildDisk(size, onProgress) {
    let { repackFat16, roundDiskSize } = await import('../src/emulators/fat-repack.js');
    let { imageReader } = await import('../src/emulators/disk-image.js');
    let key = this.hardDiskKey, hash = 0;
    for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) | 0;
    let template = 'hdd-' + (hash >>> 0).toString(36) + '-' + Math.round(size / 1048576) + 'm';
    // Built before (for another instance)? The same size always gives the same disk.
    if (await LocalStore.uploadGet(template)) return { template, size: roundDiskSize(size) };
    let read = imageReader(await this.hardDiskSource());
    let disk = await repackFat16({ read, size, onProgress });
    let blob = new Blob(disk.parts);
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    await LocalStore.uploadPut(template, blob);
    return { template, size: disk.byteLength };
  }

  async createEmulator() {
    let r = this.record;
    let cpu = this.isSystem && X86Item.CPUS[r.cpu] || X86Item.CPUS.i686;
    let emu = await this.newEmulator('emularity-x86', cpu.root);
    if (r.memory) emu.setAttribute('memory', String(r.memory));
    if (r.console) emu.setAttribute('console', r.console); // 'serial' for serial-only images
    if (r.captureMouse) emu.setAttribute('capturemouse', '');
    if (r.network) {
      emu.setAttribute('network', r.network);
      emu.setAttribute('hostname', this.hostname);
      emu.setAttribute('label', r.title);
      let uplink = document.querySelector('emularity-collection')?.getAttribute('uplink');
      if (uplink) emu.setAttribute('uplink', uplink);
    }
    emu.imagename = r.filename || '';
    emu.media = await this.bootMedia();
    if (this.isSystem) {
      emu.hardDisks = Object.fromEntries(Object.entries(r.hardDisks).map(([drive, d]) => [drive, { path: this.diskPath(drive), size: d.size }]));
      if (r.vgaMemory) emu.setAttribute('vgamemory', String(r.vgaMemory));
      emu.v86opts = { acpi: !!r.acpi, net_device: { type: r.netCard || 'ne2k' } };
      let boot = X86Item.BOOT_ORDERS[r.bootOrder || ''];
      if (boot && boot[1]) emu.v86opts.boot_order = boot[1];
    } else if (r.disk) {
      // A hard disk built bigger than the original (see buildDisk)
      emu.v86opts = { ...(r.v86opts || {}), hda: { buffer: await this.hardDiskFile(), async: true } };
    } else if (r.v86opts) {
      // A full distro: kernel + lazily-fetched 9p root filesystem, passed straight to
      // v86, with no single boot image.
      emu.v86opts = r.v86opts;
    } else {
      if (r.imagetype) emu.setAttribute('imagetype', r.imagetype);
      // A local copy boots as an in-memory image; a remote URL streams on demand via
      // HTTP range requests instead of downloading it all.
      let blob = await this.media();
      if (blob) emu.imageBlob = blob;
      else emu.setAttribute('image', r.url);
    }
    return emu;
  }
}

        <fieldset class="edit-media-field">
          <legend>Disks</legend>

            <input type="file" class="disk-folder" webkitdirectory hidden>
            <input type="url" name="disk-url" placeholder="…or a disk image or zip URL">
            <button class="disk-add-url">Add</button>
          </div>
          <p class="field-hint">Floppies and CDs for this title. A zip or folder becomes a floppy or CD, whichever drive it's put in. "In drive" ones are inserted at power on; swap them from the 💿 menu while playing. Disk changes are saved right away.</p>

        </fieldset>
        <button class="primary edit-save">Save changes</button>
      </dialog>`;
    this.dialog = this.querySelector('dialog');

    this.querySelector('.edit-save').addEventListener('click', () => this.save());
    let fileInput = this.querySelector('.disk-file'), folderInput = this.querySelector('.disk-folder');
    this.querySelector('.disk-add-file').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => this.diskAction(async () => {
      for (let disk of await CollectionItem.groupFiles(fileInput.files)) await this.item.addDisk(disk);
      fileInput.value = '';
    }));
    this.querySelector('.disk-add-folder').addEventListener('click', () => folderInput.click());
    folderInput.addEventListener('change', () => this.diskAction(async () => {
      if (folderInput.files.length) await this.item.addDisk(CollectionItem.folderDisk(folderInput.files));
      folderInput.value = '';

  /* Run a disk-list change, then show the list as it now is */
  async diskAction(fn) {
    this.querySelector('.disk-error').textContent = '';

    catch (e) { console.error(e); this.querySelector('.disk-error').textContent = e.message; }
    this.renderDisks();
  }
  renderDisks() {
    let item = this.item, drives = item.constructor.mediaDrives;

      return row;
    });
    if (!disks.hdb) {
      let row = document.createElement('div');

      row.innerHTML = `<select class="hard-disk-size" title="Size"></select> <button class="hard-disk-add">＋ Add hard disk 2</button>`;

    }
    this.dialog.showModal();
  }
  save() {
    let r = this.item.record;
    let fields = {
      title: this.field('edit-title').value.trim() || r.title,
      exe: this.field('edit-exe').value.trim(),
      thumb: this.field('edit-thumb').value.trim() || undefined,
    };
    if (r.source == 'url') fields.url = this.field('edit-url').value.trim() || r.url;
    if (this.item.constructor.captureMouseField) fields.captureMouse = this.field('edit-capture').checked || undefined;
    if (this.item.constructor.cores) fields.core = this.field('edit-core').value;
    if (this.item.isSystem) {
      fields.cpu = this.field('edit-cpu').value == 'i686' ? undefined : this.field('edit-cpu').value;
      fields.memory = +this.field('edit-memory').value;
      fields.vgaMemory = +this.field('edit-vga').value;
      fields.netCard = this.field('edit-net').value;
      fields.bootOrder = this.field('edit-boot').value || undefined;
      fields.acpi = this.field('edit-acpi').checked || undefined;
    }
    if (this.item.constructor.networkField) {
      fields.network = this.field('edit-network').checked ? 'lan' : undefined;
      fields.hostname = this.field('edit-hostname').value.trim() || undefined;
    }

  }
}
customElements.define('emularity-edit-dialog', EditDialog);

/* Make a new instance of a title: a fresh copy with its own saves (and for machines,
   its own disk changes and network name), optionally with a bigger hard disk.
   open(item) shows it; instances are made through the `collection` it belongs to. */
class InstanceDialog extends HTMLElement {
  collection = null;

  connectedCallback() {
    if (this.dialog) return;
    this.innerHTML = `
      <dialog class="instance-dialog">
        <button class="close-dialog" title="Close">✕</button>
        <h3>New instance</h3>
        <p class="field-hint">A fresh copy of <b class="instance-of"></b> as it was originally, with its own saved changes.</p>
        <label>Title <input type="text" name="instance-title"></label>
        <label class="instance-disk-field">Hard disk size <select name="instance-disk"></select></label>
        <p class="field-hint instance-disk-hint">A bigger disk is built by copying the original's files onto it, which reads the whole original once. Only the space that gets used is stored.</p>
        <label class="check instance-copy-field"><input type="checkbox" name="instance-copy" checked> Copy its hard disks as they are now (otherwise the new one's start blank)</label>
        <button class="primary instance-create">Create</button>
      </dialog>`;
    this.dialog = this.querySelector('dialog');
    this.querySelector('.close-dialog').addEventListener('click', () => this.dialog.close());
    this.querySelector('.instance-create').addEventListener('click', () => this.create());
  }
  async open(item) {
    this.item = item;
    this.querySelector('.instance-of').textContent = item.record.title;
    let title = this.querySelector('[name="instance-title"]');
    title.value = this.collection.instanceTitle(item);
    this.querySelector('.instance-copy-field').style.display = item.isSystem ? '' : 'none';
    this.querySelector('.instance-of').nextSibling.textContent = item.isSystem ? ', with the same hardware and disks, and its own saved changes.' : ' as it was originally, with its own saved changes.';
    let resizable = !!item.canResizeDisk;
    for (let el of this.querySelectorAll('.instance-disk-field, .instance-disk-hint')) el.style.display = resizable ? '' : 'none';
    if (resizable) {
      let { maxDiskSize } = await import('../src/emulators/fat-repack.js');
      let current = item.hardDiskSize, max = maxDiskSize();
      let select = this.querySelector('[name="instance-disk"]');
      let options = [new Option('Same as the original' + (current ? ' (' + Format.bytes(current) + ')' : ''), '')];
      for (let mb of [512, 1024, 1536]) {
        if (!current || mb * 1048576 > current * 1.1) options.push(new Option(Format.bytes(mb * 1048576), mb * 1048576));
      }
      options.push(new Option(Format.bytes(max) + ' (the most FAT16 allows)', max));
      select.replaceChildren(...options);
    }
    this.dialog.showModal();
    title.select();
  }
  create() {
    let title = this.querySelector('[name="instance-title"]').value.trim();
    let diskSize = this.item.canResizeDisk ? +this.querySelector('[name="instance-disk"]').value || 0 : 0;
    this.dialog.close();
    let copyDisks = this.item.isSystem && this.querySelector('[name="instance-copy"]').checked;
    this.collection.newInstance(this.item, { title, diskSize, copyDisks });
  }
}
customElements.define('emularity-instance-dialog', InstanceDialog);

/* A title's saved changes, as kept in its persist store: the writable layer of the
   BrowserFS OverlayFS its drives run on, in IndexedDB. Files it wrote are stored whole
   (at '/c/...' for drive C:); files it deleted from the original are listed in
   /.deletedFiles.log, a line "d/c/PATH" each, the last line for a path deciding it.
   Only for when the title isn't running: a running one holds its own copy of all this
   and writes it back over any changes. */
class OverlayStore {
  static LOG = '/.deletedFiles.log';

  static async open(name) {
    let store = await new Promise(resolve => {
      let fs = new BrowserFS.FileSystem.IndexedDB(err => resolve(err ? null : fs), name);
    });
    if (!store) throw new Error("the saved data couldn't be opened");
    return new OverlayStore(store);
  }
  constructor(store) {
    this.store = store;
  }
  /* A node-style fs call on this store (BrowserFS's fs module is shared, so it's
     pointed back here for each call) */
  call(method, ...args) {
    BrowserFS.initialize(this.store);
    let fs = BrowserFS.BFSRequire('fs');
    return new Promise((resolve, reject) => fs[method](...args, (e, r) => e ? reject(e) : resolve(r)));
  }
  /* Every file and folder written, as [{ path, size, mtime, dir }] (not the deletion log) */
  async files() {
    let out = [];
    let walk = async dir => {
      for (let name of await this.call('readdir', dir).catch(() => [])) {
        let full = (dir == '/' ? '' : dir) + '/' + name;
        let st = await this.call('stat', full).catch(() => null);
        if (!st) continue;
        if (st.isDirectory()) { out.push({ path: full, dir: true }); await walk(full); }
        else if (full != OverlayStore.LOG) out.push({ path: full, size: st.size, mtime: st.mtime });
      }
    };
    await walk('/');
    return out;
  }
  async log() {
    try { return (await this.call('readFile', OverlayStore.LOG)).toString('utf8'); }
    catch (e) { return ''; }
  }
  /* The paths the log has as deleted */
  static deleted(log) {
    let state = new Map();
    for (let line of log.split('\n')) if (line) state.set(line.slice(1), line[0] == 'd');
    return [...state].filter(([, d]) => d).map(([p]) => p);
  }
  /* Rewrite the log without these paths */
  async undelete(paths) {
    let drop = new Set(paths);
    let log = (await this.log()).split('\n').filter(line => line && !drop.has(line.slice(1)));
    if (log.length) await this.call('writeFile', OverlayStore.LOG, log.join('\n') + '\n');
    else await this.call('unlink', OverlayStore.LOG).catch(() => {});
  }
  /* Mark one of the original's files deleted, as OverlayFS does */
  async deletePath(path) {
    await this.call('writeFile', OverlayStore.LOG, (await this.log()) + 'd' + path + '\n');
  }
  async read(path) {
    return new Uint8Array(await this.call('readFile', path));
  }
  async write(path, bytes) {
    let parts = path.split('/').slice(1, -1), dir = '';
    for (let part of parts) {
      dir += '/' + part;
      await this.call('mkdir', dir).catch(e => { if (e.code != 'EEXIST') throw e; });
    }
    const Buffer = BrowserFS.BFSRequire('buffer').Buffer;
    await this.call('writeFile', path, Buffer.from(bytes));
  }
  async remove(path) {
    await this.call('unlink', path);
  }
  close() {
    try { this.store.store.db.close(); } catch (e) {}
  }
}

/* A title's drive C: as the software sees it: the original's files with what it has
   saved over them (see OverlayStore), as a tree, and any file in a hex editor.
   open(item) shows it for a DosItem.

   Each file in the tree is one of:
     base     the original's, untouched (drawn quietly)
     changed  the original's, saved over
     added    not in the original
     written  saved, when the original's files aren't loaded to tell which of the two
     deleted  deleted by the software: it can't see it (struck through)
     hidden   in a deleted folder, so it can't see it either */
class FilesDialog extends HTMLElement {
  static STATUS = {
    base: 'Original', changed: 'Changed', added: 'Added', written: 'Saved',
    deleted: 'Deleted', hidden: 'Deleted with its folder',
  };

  connectedCallback() {
    if (this.dialog) return;
    this.innerHTML = `
      <dialog class="files-dialog">
        <button class="close-dialog" title="Close">✕</button>
        <h3>Files: <span class="files-title"></span></h3>
        <p class="field-hint">Drive C: as the software sees it. Make changes only while it isn't running, in this tab or any other: they take effect the next time it starts.</p>
        <div class="files-main">
          <div class="files-side">
            <div class="files-bar">
              <input type="search" class="files-filter" placeholder="Filter by name">
              <label><input type="checkbox" class="files-changes-only"> Changes only</label>
            </div>
            <div class="files-bar">
              <button class="small files-retry" hidden>Try again</button>
              <button class="small files-add">Add a file…</button>
            </div>
            <p class="files-summary"></p>
            <div class="files-tree" tabindex="0"></div>
            <div class="files-legend"><span class="lg-base">original</span><span class="lg-changed">changed</span><span class="lg-added">added</span><span class="lg-deleted">deleted</span></div>
            <details><summary>Deletion log</summary><pre class="files-log"></pre></details>
          </div>
          <div class="files-detail">
            <div class="files-detail-head" hidden>
              <span class="files-path"></span>
              <span class="files-status"></span>
              <span class="files-actions"></span>
            </div>
            <p class="files-note"></p>
            <div class="files-empty">Choose a file to see what's in it.</div>
            <emularity-hex-editor hidden></emularity-hex-editor>
          </div>
        </div>
        <input type="file" class="files-upload" hidden>
      </dialog>`;
    let $ = sel => this.querySelector(sel);
    this.dialog = $('dialog');
    this.tree = $('.files-tree');
    this.editor = $('emularity-hex-editor');
    $('.close-dialog').addEventListener('click', () => { if (this.mayLeave()) this.dialog.close(); });
    this.dialog.addEventListener('cancel', ev => { if (!this.mayLeave()) ev.preventDefault(); });
    this.dialog.addEventListener('close', () => { if (this.store) this.store.close(); this.store = null; });
    $('.files-filter').addEventListener('input', () => this.renderTree());
    $('.files-changes-only').addEventListener('change', () => this.renderTree());
    $('.files-retry').addEventListener('click', () => this.loadOriginal());
    $('.files-add').addEventListener('click', () => this.addFile());
    $('.files-upload').addEventListener('change', ev => this.onUpload(ev));
    this.tree.addEventListener('click', ev => {
      let row = ev.target.closest('.ft-row');
      if (!row) return;
      let node = this.nodes.get(row.dataset.path);
      this.select(node);
      if (node.dir && node.path != '/c') this.toggle(node);
    });
    this.tree.addEventListener('keydown', ev => this.onTreeKey(ev));
  }
  /* 'GAME\SAVE.DAT' or 'C:\GAME\SAVE.DAT' -> '/c/GAME/SAVE.DAT', and back */
  static toPath(dos) { return '/c/' + dos.replace(/^[a-z]:/i, '').replace(/\\/g, '/').replace(/^\/+/, '').replace(/\/+$/, ''); }
  static toDos(path) { return 'C:' + (path.replace(/^\/c/, '').replace(/\//g, '\\') || '\\'); }

  /* Unsaved changes in the editor would be lost: ask first */
  mayLeave() {
    return !this.editor.modified || confirm(`Throw away the unsaved changes to ${FilesDialog.toDos(this.editing.path)}?`);
  }
  async open(item) {
    await import('../src/ui/hex-editor.js');
    this.item = item;
    this.original = null;
    this.selected = this.editing = null;
    this.expanded = new Set(['/c']);
    this.opened = false;
    this.querySelector('.files-title').textContent = item.record.title;
    this.tree.replaceChildren();
    this.showDetail(null);
    this.querySelector('.files-summary').textContent = 'Reading saved data…';
    this.dialog.showModal();
    try {
      this.store = await OverlayStore.open(item.persistStore);
      await this.loadOriginal();
    } catch (e) {
      console.error(e);
      this.querySelector('.files-summary').textContent = 'Failed to read the saved data: ' + e.message;
    }
  }
  /* The original's files (from wherever it boots from: a local copy, or downloaded),
     then the tree. If they can't be had, the tree shows just the changes. */
  async loadOriginal() {
    let summary = this.querySelector('.files-summary'), retry = this.querySelector('.files-retry');
    retry.hidden = true;
    summary.textContent = 'Loading the files…';
    let error = null;
    try {
      this.original = await this.item.originalFiles(true, (loaded, total) => {
        summary.textContent = 'Downloading the files… ' + (total ? Math.round(loaded / total * 100) + '%' : Format.bytes(loaded));
      });
    } catch (e) {
      console.error(e);
      error = e;
    }
    await this.refresh();
    if (!this.original) {
      summary.textContent = `Couldn't load the original files${error ? ' (' + error.message + ')' : ''}, so only what was saved over them is listed.`;
      retry.hidden = false;
    }
  }

  /* ----- The tree ----- */

  /* Read the store again and rebuild the tree (keeping what's open and chosen) */
  async refresh() {
    let written = await this.store.files(), log = await this.store.log();
    let deleted = new Set(OverlayStore.deleted(log)), orig = this.original;
    let nodes = this.nodes = new Map();
    let node = path => {
      let n = nodes.get(path);
      if (n) return n;
      n = { path, name: path.split('/').pop(), children: [], deleted: deleted.has(path) };
      nodes.set(path, n);
      if (path != '/c') {
        n.parent = node(path.slice(0, path.lastIndexOf('/')));
        n.parent.children.push(n);
        n.parent.dir = true;
      }
      return n;
    };
    let root = node('/c');
    root.dir = true;
    if (orig) for (let [p, size] of orig) {
      let n = node(p);
      n.base = size < 0 ? 0 : size;
      if (size < 0) n.dir = true;
    }
    // Drive C: only (the emulator keeps its own dosbox.conf beside it)
    for (let f of written) {
      if (!f.path.startsWith('/c/')) continue;
      let n = node(f.path);
      n.written = f.dir ? 0 : f.size;
      if (f.dir) n.dir = true;
    }
    for (let p of deleted) if (p.startsWith('/c/')) node(p);
    // What each one is. A deleted folder hides the original's files in it, unless the
    // folder was made again, as OverlayFS lists them.
    let mark = (n, hiddenAbove) => {
      let gone = n.written === undefined && (n.deleted || hiddenAbove);
      if (n.written !== undefined) n.status = n.base !== undefined ? (n.dir ? 'base' : 'changed') : orig ? 'added' : n.dir ? 'base' : 'written';
      else n.status = gone ? (n.deleted ? 'deleted' : 'hidden') : 'base';
      n.children.sort((a, b) => (b.dir ? 1 : 0) - (a.dir ? 1 : 0) || a.name.localeCompare(b.name));
      n.changes = 0;
      for (let c of n.children) n.changes += mark(c, gone);
      // (Files hidden by a deleted folder count as the folder's one change)
      return n.changes + (!n.dir && n.status != 'base' && n.status != 'hidden' ? 1 : 0) + (n.dir && n.status == 'deleted' ? 1 : 0);
    };
    mark(root, false);
    // Open the folders that have changes in them, the first time
    if (!this.opened) {
      this.opened = true;
      for (let n of nodes.values()) if (n.dir && n.changes && n.status != 'deleted' && n.status != 'hidden') this.expanded.add(n.path);
    }
    let count = s => [...nodes.values()].filter(n => !n.dir && n.status == s).length;
    let deletedDirs = [...nodes.values()].filter(n => n.dir && n.status == 'deleted').length;
    let parts = orig
      ? [count('changed') + ' changed', count('added') + ' added', (count('deleted') + deletedDirs) + ' deleted', count('base') + ' untouched']
      : [count('written') + ' saved', (count('deleted') + deletedDirs) + ' deleted'];
    this.querySelector('.files-summary').textContent = parts.join(' · ');
    this.querySelector('.files-log').textContent = log || '(empty)';
    if (this.selected) this.selected = nodes.get(this.selected.path) || null;
    if (this.editing) this.editing = nodes.get(this.editing.path) || this.editing;
    this.renderTree();
    if (this.selected) this.showDetail(this.selected, false);
  }
  toggle(node) {
    if (this.expanded.has(node.path)) this.expanded.delete(node.path); else this.expanded.add(node.path);
    this.renderTree();
  }
  /* The rows to show, in order: what's open, or what the filter lets through (and the
     folders above it, opened) */
  visibleNodes() {
    let filter = this.querySelector('.files-filter').value.trim().toLowerCase();
    let changesOnly = this.querySelector('.files-changes-only').checked;
    let filtering = filter || changesOnly;
    let passes = n => (!filter || n.name.toLowerCase().includes(filter)) && (!changesOnly || n.status != 'base');
    let keep = new Set();
    if (filtering) {
      for (let n of this.nodes.values()) {
        if (n.path == '/c' || !passes(n)) continue;
        for (let a = n; a; a = a.parent) keep.add(a);
      }
    }
    let out = [];
    let walk = (n, depth) => {
      if (filtering && !keep.has(n)) return;
      out.push([n, depth]);
      if (n.dir && (filtering || this.expanded.has(n.path))) for (let c of n.children) walk(c, depth + 1);
    };
    walk(this.nodes.get('/c'), 0);
    return out;
  }
  renderTree() {
    if (!this.nodes) return;
    this.rows = this.visibleNodes();
    let filtering = this.querySelector('.files-filter').value.trim() || this.querySelector('.files-changes-only').checked;
    this.tree.replaceChildren(...this.rows.map(([n, depth]) => {
      let row = document.createElement('div');
      row.className = `ft-row ft-${n.status}${n.dir ? ' ft-dir' : ''}${n.dir && n.changes && n.status == 'base' ? ' ft-haschanges' : ''}${n == this.selected ? ' ft-selected' : ''}`;
      row.dataset.path = n.path;
      row.style.paddingLeft = (depth * 1.1 + .3) + 'em';
      let open = filtering || this.expanded.has(n.path);
      let twisty = document.createElement('span'), name = document.createElement('span');
      twisty.className = 'ft-twisty';
      twisty.textContent = n.dir && n.children.length ? (open ? '▾' : '▸') : '';
      name.className = 'ft-name';
      name.textContent = n.path == '/c' ? 'C:' : n.name;
      row.append(twisty, name);
      if (n.status != 'base') {
        let tag = document.createElement('span');
        tag.className = 'ft-tag';
        tag.textContent = n.status == 'hidden' ? 'deleted' : n.status == 'written' ? 'saved' : n.status;
        row.append(tag);
      }
      if (n.dir && n.changes && n.status == 'base') {
        let badge = document.createElement('span');
        badge.className = 'ft-badge';
        badge.textContent = '● ' + n.changes;
        badge.title = n.changes + ' change' + (n.changes == 1 ? '' : 's') + ' in here';
        row.append(badge);
      }
      let size = this.sizeOf(n);
      if (!n.dir && size != null) {
        let s = document.createElement('span');
        s.className = 'ft-size';
        s.textContent = Format.bytes(size);
        row.append(s);
      }
      return row;
    }));
    let sel = this.tree.querySelector('.ft-selected');
    if (sel) sel.scrollIntoView({ block: 'nearest' });
  }
  sizeOf(n) { return n.written !== undefined ? n.written : n.base; }
  onTreeKey(ev) {
    if (!this.rows || !this.rows.length) return;
    let i = this.rows.findIndex(([n]) => n == this.selected), n = this.selected;
    let go = j => { j = Math.max(0, Math.min(j, this.rows.length - 1)); this.select(this.rows[j][0]); };
    switch (ev.key) {
      case 'ArrowDown': go(i + 1); break;
      case 'ArrowUp': go(i < 0 ? 0 : i - 1); break;
      case 'Home': go(0); break;
      case 'End': go(this.rows.length - 1); break;
      case 'ArrowRight': if (n && n.dir && !this.expanded.has(n.path)) this.toggle(n); else go(i + 1); break;
      case 'ArrowLeft':
        if (n && n.dir && this.expanded.has(n.path)) this.toggle(n);
        else if (n && n.parent) this.select(n.parent);
        break;
      case 'Enter':
        if (n && n.dir) this.toggle(n);
        else if (n) this.editor.focus();
        break;
      default: return;
    }
    ev.preventDefault();
  }

  /* ----- The chosen file ----- */

  async select(node) {
    if (node == this.selected) return;
    if (this.editing && this.editing.path != node.path && !this.mayLeave()) return;
    this.selected = node;
    this.renderTree();
    await this.showDetail(node, !node.dir);
  }
  /* Show what's chosen: its status and what can be done with it, and if `load`, its
     bytes in the editor */
  async showDetail(n, load) {
    let head = this.querySelector('.files-detail-head'), note = this.querySelector('.files-note');
    let empty = this.querySelector('.files-empty');
    head.hidden = !n;
    note.textContent = '';
    if (!n) { empty.hidden = false; empty.textContent = "Choose a file to see what's in it."; this.editor.hidden = true; return; }
    this.querySelector('.files-path').textContent = FilesDialog.toDos(n.path) + (n.dir && n.path != '/c' ? '\\' : '');
    let status = this.querySelector('.files-status');
    status.className = 'files-status ft-' + n.status;
    status.innerHTML = '';
    let tag = document.createElement('span');
    tag.className = 'ft-tag';
    tag.textContent = FilesDialog.STATUS[n.status];
    status.append(tag);
    let size = this.sizeOf(n);
    if (!n.dir && size != null) status.append(' ' + Format.bytes(size) + (n.status == 'changed' && n.base != size ? ` (was ${Format.bytes(n.base)})` : ''));
    let actions = this.querySelector('.files-actions');
    let button = (label, title, action) => {
      let b = document.createElement('button');
      b.className = 'small';
      b.textContent = label;
      b.title = title;
      b.addEventListener('click', () => this.act(action));
      return b;
    };
    actions.replaceChildren();
    let gone = n.status == 'deleted' || n.status == 'hidden';
    let deletedFolder = n.status == 'hidden' && this.deletedAncestor(n);
    if (n.status == 'deleted') actions.append(button('Restore', 'Un-delete it, so the software sees it again', () => this.restore(n)));
    if (deletedFolder) actions.append(button('Restore its folder', `Un-delete ${FilesDialog.toDos(deletedFolder.path)}`, () => this.restore(deletedFolder)));
    if (!n.dir) {
      if (n.status == 'changed') actions.append(button('Revert', 'Throw away the saved copy, back to the original', () => this.revert(n)));
      if (!gone) actions.append(button('Delete', 'Delete it, as the software would', () => this.remove(n)));
      actions.append(button('Replace…', 'Put a file from your computer here', () => this.upload(n.path)));
    } else {
      actions.append(button('Add a file here…', 'Put a file from your computer in this folder', () => this.addFile(n)));
    }

    if (n.dir) {
      this.editing = null;
      this.editor.hidden = true;
      empty.hidden = false;
      let files = [...this.nodes.values()].filter(x => !x.dir && x.path.startsWith(n.path + '/'));
      empty.textContent = `${files.length} file${files.length == 1 ? '' : 's'} in here` + (n.changes ? `; ${n.changes} changed, added or deleted.` : ', none of them changed.');
      if (n.status == 'deleted') note.textContent = 'The software deleted this folder: it can’t see it, or the original files in it.';
      return;
    }
    if (gone) note.textContent = (n.status == 'deleted' ? 'The software deleted this file' : 'This file’s folder was deleted') + ', so it can’t see it. Shown is the original; saving puts it back, with your changes.';
    if (!load) return;
    // Its bytes: the saved copy, or else the original's
    let bytes = null, original = null;
    try {
      if (n.base !== undefined) original = this.item.originalRead(n.path);
      bytes = n.written !== undefined ? await this.store.read(n.path) : original;
    } catch (e) {
      console.error(e);
      note.textContent = 'Couldn’t read it: ' + e.message;
    }
    if (!bytes) {
      this.editing = null;
      this.editor.hidden = true;
      empty.hidden = false;
      empty.textContent = gone && n.base === undefined ? 'Its contents are gone: it isn’t in the original either.' : 'Nothing to show.';
      return;
    }
    empty.hidden = true;
    this.editor.hidden = false;
    this.editing = n;
    this.editor.onsave = async bytes => {
      await this.saveFile(n.path, bytes);
      // Now it's changed: show how
      if (original && !this.editor.compare) this.editor.chooseCompare('given');
    };
    this.editor.open(bytes, { name: n.name, compare: original, compareLabel: 'The original', showCompare: n.status == 'changed' });
  }
  deletedAncestor(n) {
    for (let a = n.parent; a; a = a.parent) if (a.deleted && a.written === undefined) return a;
    return null;
  }
  async act(action) {
    try { await action(); }
    catch (e) { console.error(e); alert('Failed: ' + e.message); }
  }
  /* The editor saved: keep its bytes as the file's (back from the dead, if deleted) */
  async saveFile(path, bytes) {
    await this.store.write(path, bytes);
    let gone = OverlayStore.deleted(await this.store.log()).filter(p => p == path || path.startsWith(p + '/'));
    if (gone.length) await this.store.undelete(gone);
    await this.refresh();
  }
  /* After changing a file other than through the editor, show it afresh */
  async reload(n) {
    this.editing = null;
    await this.refresh();
    let now = this.nodes.get(n.path);
    if (now) { this.selected = now; this.renderTree(); await this.showDetail(now, !now.dir); }
  }
  async restore(n) {
    if (!n.dir && this.editor.modified && this.editing == n && !this.mayLeave()) return;
    // Restoring a folder brings back what was deleted in it, too
    await this.store.undelete(OverlayStore.deleted(await this.store.log()).filter(p => p == n.path || p.startsWith(n.path + '/')));
    await this.reload(this.selected || n);
  }
  async revert(n) {
    if (!confirm(`Throw away the saved copy of ${FilesDialog.toDos(n.path)}? The original comes back in its place.`)) return;
    await this.store.remove(n.path);
    await this.store.undelete([n.path]);
    await this.reload(n);
  }
  async remove(n) {
    let what = n.status == 'added' || n.status == 'written' ? '' : ' The original stays in the software’s files, hidden, and can be restored.';
    if (!confirm(`Delete ${FilesDialog.toDos(n.path)}?` + what)) return;
    if (n.written !== undefined) await this.store.remove(n.path);
    if (n.base !== undefined) await this.store.deletePath(n.path);
    await this.reload(n);
  }
  addFile(dir) {
    let base = dir || (this.selected && (this.selected.dir ? this.selected : this.selected.parent));
    let prefix = base && base.path != '/c' ? FilesDialog.toDos(base.path).slice(3) + '\\' : '';
    let path = prompt('Where on drive C: should the file go? (e.g. GAME\\SAVE.DAT)', prefix);
    if (path && path.trim() && !/[\\/]$/.test(path.trim())) this.upload(FilesDialog.toPath(path.trim()), true);
  }
  upload(path, named = false) {
    this.uploadPath = path;
    this.uploadNamed = named;
    let input = this.querySelector('.files-upload');
    input.value = '';
    input.click();
  }
  async onUpload(ev) {
    let file = ev.target.files[0], path = this.uploadPath;
    if (!file || !path) return;
    let existing = this.nodes.get(path);
    if (this.editing && this.editing.path == path && this.editor.modified && !this.mayLeave()) return;
    if (existing && !this.uploadNamed && !confirm(`Replace ${FilesDialog.toDos(path)} with ${file.name}?`)) return;
    await this.act(async () => {
      await this.saveFile(path, new Uint8Array(await file.arrayBuffer()));
      for (let p = path.slice(0, path.lastIndexOf('/')); p.length > 2; p = p.slice(0, p.lastIndexOf('/'))) this.expanded.add(p);
      await this.reload({ path });
    });
  }
}
customElements.define('emularity-files-dialog', FilesDialog);

/* Add software to the collection: from one of the platform's sources (see
   SoftwareSource), a URL, or an upload. open(platform) shows it for a platform's item
   class; new items are added through the `collection` it belongs to. */
class AddDialog extends HTMLElement {
  collection = null;

  connectedCallback() {
    if (this.dialog) return;
    this.innerHTML = `
      <dialog>
        <button class="close-dialog" title="Close">✕</button>
        <h3 class="add-heading">Add software</h3>
        <div class="add-tabs">
          <button data-tab="system" class="system-tab">New system</button>
          <span class="source-tabs"></span>
          <button data-tab="url">From URL</button>
          <button data-tab="upload">Upload</button>
        </div>

        <div class="tab-panel" data-panel="search">
          <div class="search-row">
            <span class="search-filter" title="Results are filtered to software for this platform"></span>
            <input type="search" name="query" placeholder="Search titles...">
          </div>
          <p class="field-hint source-hint"></p>
          <div class="search-results"></div>
        </div>

        <div class="tab-panel" data-panel="system" style="display: none">
          <label>Name <input type="text" name="system-title" placeholder="My PC"></label>
          <div class="system-grid">
            <label>Hard disk 1 <select name="system-hda"></select></label>
            <label>Hard disk 2 <select name="system-hdb"></select></label>
            <label>CPU <select name="system-cpu"></select></label>
            <label>Memory <select name="system-memory"></select></label>
            <label>Video memory <select name="system-vga"></select></label>
            <label>Network card <select name="system-net"></select></label>
          </div>
          <label class="check"><input type="checkbox" name="system-lan"> Connect to the local network (shared by every machine running in this browser)</label>
          <label class="check"><input type="checkbox" name="system-acpi"> ACPI power management <span class="field-hint">(leave off for Windows 9x: with it, shutting down doesn't turn the machine off)</span></label>
          <label>CD-ROM <input type="file" name="system-cd" multiple></label>
          <label>Floppy A: <input type="file" name="system-fda"></label>
          <p class="field-hint">The hard disks start blank, for an operating system to be installed on them (Windows 98 setup partitions and formats them itself). They're kept in this browser's storage, saved as they're written, and can be exported as .img files for other emulators. Disks can be added or swapped later.</p>
          <button class="primary add-system">Create</button>
          <button class="secondary add-system-start">Create and start</button>
        </div>

        <div class="tab-panel" data-panel="url" style="display: none">
          <label>Title <input type="text" name="title"></label>
          <label>URL <input type="url" name="url" placeholder="https://example.com/game.zip"></label>
          <p class="field-hint url-hint"></p>
          <label class="exe-field">Program to run <input type="text" name="exe" placeholder="GAMEDIR/GAME.EXE"></label>
          <button class="primary add-url">Add to collection</button>
        </div>

        <div class="tab-panel" data-panel="upload" style="display: none">
          <label>Title <input type="text" name="uploadtitle"></label>
          <label>File <input type="file" name="file"></label>
          <p class="field-hint upload-hint"></p>
          <label class="exe-field">Program to run <input type="text" name="uploadexe" placeholder="GAMEDIR/GAME.EXE"></label>
          <button class="primary add-upload">Add to collection</button>
        </div>
        <p class="error-note"></p>
        <p class="added-note" aria-live="polite"></p>
      </dialog>`;
    this.dialog = this.querySelector('dialog');
    this.results = this.querySelector('.search-results');

    this.querySelector('.close-dialog').addEventListener('click', () => this.dialog.close());
    this.querySelectorAll('.add-tabs > button').forEach(btn => btn.addEventListener('click', () => this.showTab(btn)));
    let query = this.field('query');
    // Debounce as-you-type searches so we don't hit the network on every keystroke
    query.addEventListener('input', () => {
      clearTimeout(this.searchTimer);
      this.searchTimer = setTimeout(() => this.search(), 500);
    });
    query.addEventListener('keydown', ev => {
      if (ev.key == 'Enter') { clearTimeout(this.searchTimer); this.search(); }
    });
    // Infinite scroll: fetch the next page as the list nears the bottom
    this.results.addEventListener('scroll', () => {
      let el = this.results;
      if (el.scrollTop + el.clientHeight >= el.scrollHeight - 150) this.loadMore();
    });
    // Shift+click adds without closing, to add several titles in a row
    this.querySelector('.add-url').addEventListener('click', ev => this.addFromURL(ev.shiftKey));
    this.querySelector('.add-upload').addEventListener('click', ev => this.addFromUpload(ev.shiftKey));
    this.querySelector('.add-system').addEventListener('click', () => this.addSystem(false));
    this.querySelector('.add-system-start').addEventListener('click', () => this.addSystem(true));
  }
  field(name) { return this.querySelector(`[name="${name}"]`); }
  setError(msg) { this.querySelector('.error-note').textContent = msg || ''; }

  open(platform) {
    this.platform = platform;
    this.setError('');
    this.querySelector('.url-hint').textContent = platform.hint;
    this.querySelector('.upload-hint').textContent = platform.hint;
    this.field('file').accept = platform.accept;
    this.querySelectorAll('.exe-field').forEach(el => { el.style.display = platform.exeField ? '' : 'none'; });
    this.querySelector('.add-heading').textContent = platform.newSystem ? 'Add system' : 'Add software';
    let systemTab = this.querySelector('.system-tab');
    systemTab.hidden = !platform.newSystem;
    if (platform.newSystem) this.resetSystemForm();
    // One tab per source, all sharing the search panel
    let tabs = this.querySelector('.source-tabs');
    tabs.replaceChildren(...platform.sources.map(source => {
      let btn = document.createElement('button');
      btn.dataset.tab = 'search';
      btn.textContent = source.label;
      btn.source = source;
      btn.addEventListener('click', () => this.showTab(btn));
      return btn;
    }));
    this.dialog.showModal();
    this.showTab(platform.newSystem ? systemTab : tabs.firstElementChild || this.querySelector('[data-tab="url"]'));
  }

  /* ----- A new system (see X86Item's Systems) ----- */

  resetSystemForm() {
    let p = this.platform, select = (name, options, value) => {
      this.field(name).replaceChildren(...options.map(([v, label]) => new Option(label, v)));
      this.field(name).value = value;
    };
    let sizes = p.HARD_DISK_SIZES.map(n => [n, Format.bytes(n)]);
    select('system-hda', sizes, 2048 * 1048576);
    select('system-hdb', [['', 'None'], ...sizes], '');
    select('system-cpu', Object.entries(p.CPUS).map(([k, c]) => [k, c.label]), 'i686');
    this.field('system-cpu').onchange = () => p.cpuChanged(this.field('system-cpu'), this.field('system-memory'));
    select('system-memory', p.memorySizes('i686'), 512); // current Linux installers need more than 256 MB
    select('system-vga', p.VGA_MEMORY_SIZES.map(mb => [mb, mb + ' MB']), 8);
    select('system-net', Object.entries(p.NET_CARDS), 'ne2k');
    this.field('system-title').value = '';
    this.field('system-lan').checked = false;
    this.field('system-acpi').checked = false;
    this.field('system-cd').accept = p.mediaAccept.cdrom;
    this.field('system-fda').accept = p.mediaAccept.floppy;
    this.field('system-cd').value = this.field('system-fda').value = '';
  }
  async addSystem(start) {
    this.setError('');
    let f = name => this.field(name);
    let cdFiles = f('system-cd').files, floppy = f('system-fda').files[0];
    // Check the disks before making anything: a cue sheet needs the files it names
    let cds;
    try { cds = cdFiles.length ? await CollectionItem.groupFiles(cdFiles) : []; }
    catch (e) { return this.setError(e.message); }
    let title = f('system-title').value.trim() || this.collection.untitled('PC');
    let item = this.add(this.platform.systemRecord({
      title, cpu: f('system-cpu').value, hda: +f('system-hda').value, hdb: +f('system-hdb').value || 0,
      memory: +f('system-memory').value, vgaMemory: +f('system-vga').value, netCard: f('system-net').value,
      acpi: f('system-acpi').checked, network: f('system-lan').checked ? 'lan' : null,
    }));
    try {
      for (let [i, disk] of cds.entries()) {
        let added = await item.addDisk({ ...disk, drive: 'cdrom' });
        if (!i) item.setInserted('cdrom', added.id);
      }
      if (floppy) item.setInserted('fda', (await item.addDisk({ name: floppy.name, file: floppy, drive: 'fda' })).id);
    } catch (e) {
      console.error(e);
      this.setError(`"${title}" was made, but adding its disks failed (${e.message}); add them from Edit info.`);
      return;
    }
    this.dialog.close();
    if (start) item.launch();
  }
  showTab(btn) {
    this.querySelectorAll('.add-tabs button').forEach(b => b.classList.toggle('active', b == btn));
    this.querySelectorAll('.tab-panel').forEach(p => { p.style.display = (p.dataset.panel == btn.dataset.tab) ? '' : 'none'; });
    if (btn.source) this.useSource(btn.source);
  }
  useSource(source) {
    this.source = source;
    this.querySelector('.added-note').textContent = '';
    let filter = this.querySelector('.search-filter');
    filter.textContent = source.filter;
    filter.style.display = source.filter ? '' : 'none';
    this.querySelector('.source-hint').textContent = source.hint + ' Shift+click to add several.';
    this.field('query').value = '';
    this.results.innerHTML = '';
    this.field('query').focus();
    this.search(); // pre-populate with what the source has
  }

  /* ----- Searching the current source ----- */

  appendResults(found) {
    found.forEach(result => {
      let row = document.createElement('div');
      row.className = 'search-result';
      row.innerHTML = '<img loading="lazy"><div><div class="result-title"></div><div class="result-detail"></div></div>';
      let img = row.querySelector('img');
      if (result.thumb) img.src = result.thumb; else img.remove();
      row.querySelector('.result-title').textContent = result.title;
      row.querySelector('.result-detail').textContent = result.detail || '';
      row.addEventListener('click', ev => this.addFromSource(result, row, ev.shiftKey));
      this.results.appendChild(row);
    });
  }
  async search() {
    let results = this.results, source = this.source;
    let text = this.field('query').value.trim();
    let state = this.searchState = { source, text, page: 1, total: Infinity, loading: true };
    if (!results.children.length) results.innerHTML = '<p class="field-hint">Searching...</p>';
    results.classList.add('loading');
    this.setError('');
    try {
      let { results: found, total } = await source.search(text, 1);
      if (state != this.searchState) return; // a newer search superseded this one
      results.classList.remove('loading');
      results.innerHTML = '';
      state.total = total;
      state.loading = false;
      if (!found.length) { results.innerHTML = '<p class="field-hint">No results.</p>'; return; }
      this.appendResults(found);
      results.scrollTop = 0;
    } catch (e) {
      if (state != this.searchState) return;
      console.error(e);
      results.classList.remove('loading');
      results.innerHTML = '';
      this.setError('Search failed: ' + e.message);
    }
  }
  async loadMore() {
    let state = this.searchState;
    if (!state || state.loading) return;
    if (this.results.querySelectorAll('.search-result').length >= state.total) return; // all loaded
    state.loading = true;
    let loader = document.createElement('div');
    loader.className = 'search-more';
    loader.textContent = 'Loading more...';
    this.results.appendChild(loader);
    try {
      let { results: found } = await state.source.search(state.text, state.page + 1);
      if (state != this.searchState) return; // superseded by a newer search
      state.page++;
      this.appendResults(found);
    } catch (e) {
      console.error(e);
    } finally {
      loader.remove();
      state.loading = false;
    }
  }

  /* ----- Adding ----- */

  add(record) {
    return this.collection.addItem(Object.assign({ platform: this.platform.key }, record));
  }
  /* After adding: close, or with `keepOpen` (shift+click) stay open for more */
  added(title, keepOpen) {
    if (!keepOpen) return this.dialog.close();
    this.setError('');
    this.querySelector('.added-note').textContent = 'Added "' + title + '".';
  }
  async addFromSource(result, row, keepOpen) {
    this.setError('');
    row.style.opacity = .5;
    try {
      this.add(await this.source.toRecord(result));
      if (keepOpen) row.classList.add('added');
      this.added(result.title, keepOpen);
    } catch (e) {
      console.error(e);
      this.setError(`Couldn't add ${result.title}: ${e.message}`);
    } finally {
      row.style.opacity = '';
    }
  }
  addFromURL(keepOpen) {
    let url = this.field('url').value.trim();
    if (!url) return this.setError('A URL is required.');
    let filename = url.split('?')[0].split('/').pop() || 'software';
    let item = this.add({
      title: this.field('title').value.trim() || filename,
      source: 'url',
      url: url,
      filename: filename,
      exe: this.field('exe').value.trim(),
    });
    item.fetchSize(); // fill in size via HEAD in the background
    for (let name of ['url', 'title', 'exe']) this.field(name).value = '';
    this.added(item.record.title, keepOpen);
  }
  async addFromUpload(keepOpen) {
    let input = this.field('file');
    if (!input.files.length) return this.setError('Choose a file to upload.');
    let file = input.files[0];
    let item = this.add({
      title: this.field('uploadtitle').value.trim() || file.name,
      source: 'upload',
      filename: file.name,
      exe: this.field('uploadexe').value.trim(),
      size: file.size,
    });
    try {
      await LocalStore.uploadPut(item.record.id, file);
      for (let name of ['file', 'uploadtitle', 'uploadexe']) this.field(name).value = '';
      this.added(item.record.title, keepOpen);
    } catch (e) {
      console.error(e);
      this.collection.dropItem(item);
      this.setError('Failed to store the file in browser storage: ' + e.message);
    }
  }
}
customElements.define('emularity-add-dialog', AddDialog);


/* ===== Player =====

   Plays one collection item: a bar (back, title, session timer, mouse capture, mute,
   theater, fullscreen) above the item's emulator, and a "powered off" screen when the emulated
   program exits. Set `prefs` ({ muted, theater }, shared with the collection) before
   load(); changes to it are announced with a `prefschange` event. */
class CollectionPlayer extends HTMLElement {
  prefs = { muted: false, theater: false };

  /* Build the item's emulator and the player around it. Throws if the item can't be
     played. */
  async load(item) {
    this.item = item;
    this.emu = await item.buildEmulator();
    this.emu.addEventListener('exit', ev => this.showPoweredOff(ev.detail || {}));
    // Closing the tab (or window, or a stray Ctrl+W, which pages can't intercept) while
    // a machine runs asks first. Our own navigations set `leaving` to skip it.
    this.leaving = false;
    addEventListener('beforeunload', ev => {
      if (this.leaving || this.poweredOff) return;
      ev.preventDefault();
      ev.returnValue = ''; // older browsers need this to show the prompt
    });

    let bar = document.createElement('div');
    bar.className = 'player-bar';
    bar.innerHTML = `
      <button class="pb-back">◀ Back to collection</button>
      <span class="player-title"></span>
      <span class="pb-timer" title="Time played this session">0:00</span>
      <span class="pb-controls">
        <span class="pb-media-wrap">
          <div class="pb-media-popup" hidden></div>
          <input type="file" class="pb-media-file" multiple hidden>
          <input type="file" class="pb-media-folder" webkitdirectory hidden>
        </span>
        <span class="pb-keys-wrap">
          <button class="pb-keys" title="Send keys your computer would keep for itself (Ctrl+Alt+Del, function keys…)">⌨</button>
          <div class="pb-media-popup pb-keys-popup" hidden></div>
        </span>
        <button class="pb-network" title="Show the machines on the local network">🖧</button>
        <button class="pb-capture" title="Capture mouse (Esc releases it)">🖱</button>
        <button class="pb-mute"></button>
        <button class="pb-theater" title="Theater mode">▭</button>
        <button class="pb-fullscreen" title="Fullscreen">⛶</button>
      </span>`;
    bar.querySelector('.player-title').textContent = item.record.title;
    // To the platform's library (replacing this entry, so Back still behaves); leaving
    // on purpose, so no "leave site?" prompt
    bar.querySelector('.pb-back').addEventListener('click', () => {
      this.leaving = true;
      location.replace('#' + item.record.platform);
    });

    // Count up play time for this session (it ends with the reload that leaving the
    // player triggers).
    let start = Date.now(), timerEl = bar.querySelector('.pb-timer');
    let tick = () => { timerEl.textContent = Format.duration(Date.now() - start); };
    tick();
    this.timer = setInterval(tick, 1000);

    let muteBtn = bar.querySelector('.pb-mute');
    let updateMute = () => { muteBtn.textContent = this.prefs.muted ? '🔇' : '🔊'; muteBtn.title = this.prefs.muted ? 'Unmute' : 'Mute'; };
    updateMute();
    muteBtn.addEventListener('click', () => {
      this.prefs.muted = !this.prefs.muted;
      AudioMute.set(this.prefs.muted);
      updateMute();
      this.dispatchEvent(new CustomEvent('prefschange'));
    });

    let theaterBtn = bar.querySelector('.pb-theater');
    let updateTheater = () => {
      this.classList.toggle('theater', this.prefs.theater);
      theaterBtn.classList.toggle('active', this.prefs.theater);
    };
    updateTheater();
    theaterBtn.addEventListener('click', () => {
      this.prefs.theater = !this.prefs.theater;
      updateTheater();
      this.dispatchEvent(new CustomEvent('prefschange'));
    });

    // Pointer lock, for emulators that support it: raw relative mouse movement
    bar.querySelector('.pb-network').addEventListener('click', () => this.dispatchEvent(new CustomEvent('shownetwork', { bubbles: true })));
    let captureBtn = bar.querySelector('.pb-capture');
    if (typeof this.emu.lockPointer == 'function') {
      captureBtn.addEventListener('click', () => this.emu.lockPointer().catch(e => console.warn('Emularity: pointer lock failed', e)));
    } else {
      captureBtn.remove();
    }

    // CPU graphs, and drive and network lights, for what the emulator reports on. The
    // drive lights double as the disk menus: click the floppy to change floppies.
    await Promise.all([import('../src/ui/activity-lights.js'), import('../src/ui/performance-graphs.js')]);
    let graphs = document.createElement('emularity-performance-graphs');
    graphs.className = 'pb-graphs';
    graphs.emulator = this.emu;
    let lights = document.createElement('emularity-activity-lights');
    lights.className = 'pb-lights';
    lights.emulator = this.emu;
    bar.querySelector('.pb-media-wrap').prepend(lights);
    bar.querySelector('.pb-controls').prepend(graphs);

    this.setUpMediaMenu(bar, lights);
    this.setUpKeysMenu(bar);

    bar.querySelector('.pb-fullscreen').addEventListener('click', () => {
      let c = this.emu.canvas;
      if (document.fullscreenElement) document.exitFullscreen();
      else if (c && c.requestFullscreen) c.requestFullscreen().catch(e => console.warn('Emularity: fullscreen failed', e));
    });

    this.replaceChildren(bar, this.emu);
  }

  /* The disk menus, one per removable drive, opened from its light: what's in it, and
     the title's disks that fit */
  setUpMediaMenu(bar, lights) {
    let item = this.item, emu = this.emu;
    let wrap = bar.querySelector('.pb-media-wrap'), popup = wrap.querySelector('.pb-media-popup');
    if (!item.constructor.mediaDrives || !('mediaDrives' in emu)) { popup.remove(); return; }
    let fileInput = wrap.querySelector('.pb-media-file'), folderInput = wrap.querySelector('.pb-media-folder');
    let note = '', fileDrive = null, open = null; // open: the id of the drive whose menu is showing
    lights.drives = emu.mediaDrives;

    // time. Disks the title doesn't own (its main image, the machine's own) aren't kept.
    emu.addEventListener('mediachange', ev => {
      let { drive, current } = ev.detail;
      let id = current && item.disks.some(d => d.id == current.id) ? current.id : null;
      if (id || item.inserted[drive]) item.setInserted(drive, id);
      lights.drives = emu.mediaDrives;

    let run = async (label, fn) => {
      note = label + '…';
      render();
      try { await fn(); note = ''; }
      catch (e) {

      }
      render();
    };
    let insert = (drive, disk) => run('Inserting ' + disk.name, async () => {
      // A disk can only be in one drive at a time: take it out of the other
      let elsewhere = emu.mediaDrives.find(d => d.id != drive.id && d.current && d.current.id == disk.id && d.canEject !== false);
      if (elsewhere) await emu.ejectMedia(elsewhere.id);
      try {
        await emu.insertMedia(drive.id, await item.diskMedia(disk, drive.id));
      } catch (e) {
        if (!e.needsRestart) throw e;

        item.setInserted(drive.id, disk.id);

      }
    });
