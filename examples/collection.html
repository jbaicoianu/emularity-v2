  <body>
    <emularity-collection></emularity-collection>

    <script>
const STORAGE_KEY = 'emularity-collection';

const PLATFORMS = {
  "dos": {
    label: 'IBM PC',
    sublabel: 'DOSBox',
    query: 'emulator:(dosbox)',
    accept: '.zip,.img,.ima',
    urlHint: 'A zip file, mounted as drive C:',
    exeField: true,
  },
  "apple2e": {
    label: 'Apple IIe',
    sublabel: 'MAME',
    query: 'emulator:(apple2ee)',
    accept: '.dsk,.do,.po,.nib,.woz',
    urlHint: 'A floppy disk image (.dsk, .do, .po, .nib, .woz)',
    exeField: false,
  },
};

/* Sort options for the installed-software grid */
const SORTS = {
  'added-desc':  { label: 'Recently added', cmp: (a, b) => (b.added || 0) - (a.added || 0) },
  'played-desc': { label: 'Last played',    cmp: (a, b) => (b.lastPlayed || 0) - (a.lastPlayed || 0) },
  'title-asc':   { label: 'Title (A–Z)', cmp: (a, b) => (a.title || '').localeCompare(b.title || '') },
  'rating-desc': { label: 'Rating',         cmp: (a, b) => (b.rating || 0) - (a.rating || 0) },
};

/* Master mute. Routes every emulator's audio through gain nodes we can silence,
   installed globally so it catches audio graphs built after a game boots. Uses a
   gain (not AudioContext.suspend) so the audio callback keeps firing and emulator
   timing is unaffected. */
const audioMute = {
  gains: [],
  muted: false,
  _installed: false,
  install() {
    if (this._installed) return;
    this._installed = true;
    let orig = AudioNode.prototype.connect, self = this;
    AudioNode.prototype.connect = function(target, ...rest) {
      if (target instanceof AudioDestinationNode) {
        try {
          let gain = this.context.createGain();
          gain.gain.value = self.muted ? 0 : 1;
          self.gains.push(gain);
          orig.call(this, gain);
          return orig.call(gain, target);
        } catch (e) { /* fall through to a plain connect */ }
      }
      return orig.call(this, target, ...rest);
    };
  },
  set(muted) {
    this.muted = muted;
    this.gains.forEach(g => { try { g.gain.value = muted ? 0 : 1; } catch (e) {} });
  }
};
audioMute.install();

/* Tiny promise wrapper around IndexedDB, used to persist uploaded software */
const filedb = {
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((resolve, reject) => {
      let req = indexedDB.open('emularity-collection', 1);
      req.onupgradeneeded = ev => ev.target.result.createObjectStore('files');
      req.onsuccess = ev => { this._db = ev.target.result; resolve(this._db); };
      req.onerror = ev => reject(req.error);
    });
  },
  async put(id, blob) {
    let db = await this.open();
    return new Promise((resolve, reject) => {
      let tx = db.transaction('files', 'readwrite');
      tx.objectStore('files').put(blob, id);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  },
  async get(id) {
    let db = await this.open();
    return new Promise((resolve, reject) => {
      let req = db.transaction('files').objectStore('files').get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  async delete(id) {
    let db = await this.open();
    return new Promise((resolve, reject) => {
      let tx = db.transaction('files', 'readwrite');
      tx.objectStore('files').delete(id);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  },
};

const SEARCH_ROWS = 50;

async function searchArchive(query, page = 1, rows = SEARCH_ROWS) {
  let params = new URLSearchParams();
  params.append('q', query);
  ['identifier', 'title', 'year', 'avg_rating'].forEach(f => params.append('fl[]', f));
  params.append('sort[]', 'downloads desc');
  params.append('rows', String(rows));
  params.append('page', String(page));
  params.append('output', 'json');
  let res = await fetch('https://archive.org/advancedsearch.php?' + params);
  let data = await res.json();
  return { docs: data.response.docs, total: data.response.numFound };
}

/* Recover the archive.org identifier from a stored item's download URL */
function archiveIdFromUrl(url) {
  if (!url) return null;
  let m = url.match(/cors\.archive\.org\/cors\/([^\/?#]+)/);
  return m ? decodeURIComponent(m[1]) : null;
}

/* Human-friendly "time ago" for a timestamp (ms), or "never" if unset */
function relativeTime(ts) {
  if (!ts) return 'never';
  let sec = Math.max(0, Math.round((Date.now() - ts) / 1000));
  let fmt = (n, u) => n + ' ' + u + (n == 1 ? '' : 's') + ' ago';
  if (sec < 45) return 'just now';
  let min = Math.round(sec / 60);
  if (min < 60) return fmt(min, 'minute');
  let hr = Math.round(min / 60);
  if (hr < 24) return fmt(hr, 'hour');
  let day = Math.round(hr / 24);
  if (day < 7) return fmt(day, 'day');
  if (day < 70) return fmt(Math.round(day / 7), 'week');
  let mo = Math.round(day / 30.44);
  if (mo < 12) return fmt(mo, 'month');
  return fmt(Math.round(day / 365.25), 'year');
}

/* Format an elapsed duration (ms) as M:SS, or H:MM:SS past an hour */
function formatDuration(ms) {
  let s = Math.floor(Math.max(0, ms) / 1000);
  let h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  let pad = n => String(n).padStart(2, '0');
  return (h > 0 ? h + ':' + pad(m) : m) + ':' + pad(sec);
}

/* The archive.org thumbnail URL for a collection item, if it came from archive.org */
function itemThumb(item) {
  if (item.thumb) return item.thumb;
  let id = item.identifier || archiveIdFromUrl(item.url);
  return id ? 'https://archive.org/services/img/' + id : null;
}

/* Given an archive.org identifier, figure out the software file to load and how to start it */
async function resolveArchiveItem(identifier) {
  let res = await fetch('https://archive.org/metadata/' + identifier);
  let data = await res.json();
  let meta = data.metadata || {};
  let ext = (meta.emulator_ext || '').toLowerCase();
  let file = ext ? data.files.find(f => f.name.toLowerCase().endsWith('.' + ext)) : null;
  if (!file) file = data.files.find(f => /\.(zip|dsk|do|po|nib|woz|img|ima)$/i.test(f.name));
  if (!file) throw new Error('No usable software file found in this item');
  return {
    title: (Array.isArray(meta.title) ? meta.title[0] : meta.title) || identifier,
    filename: file.name,
    url: `https://cors.archive.org/cors/${identifier}/${encodeURIComponent(file.name)}`,
    exe: meta.emulator_start || '',
  };
}

/* Convert an archive.org-style start path ('GAMEDIR/GAME.EXE') into autoexec commands */
function exeToAutoexec(exe) {
  if (!exe) return '';
  if (exe.includes('\n') || /^[a-z]:/i.test(exe)) return exe; // already explicit commands
  let parts = exe.replace(/\\/g, '/').split('/').filter(p => p.length);
  let prog = parts.pop();
  let lines = ['c:'];
  if (parts.length) lines.push('cd \\' + parts.join('\\'));
  lines.push(prog);
  return lines.join('\n');
}

class EmularityCollection extends HTMLElement {
  connectedCallback() {
    let stored = {};
    try { stored = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) {}
    this.items = stored.items || [];
    this.platform = PLATFORMS[stored.platform] ? stored.platform : Object.keys(PLATFORMS)[0];
    this.sort = SORTS[stored.sort] ? stored.sort : 'added-desc';
    this.muted = !!stored.muted;
    this.theater = !!stored.theater;
    audioMute.muted = this.muted;
    this.playing = false;
    // Fill in derived/looked-up fields (thumbnail, added date, rating) for items
    // saved before those existed, then keep enriching in the background.
    this.backfillItems();
    // Close any open card menu when clicking elsewhere
    document.addEventListener('click', () => this.closeMenus());
    // Drive platform/game selection from the URL hash so views are bookmarkable
    // and the browser Back button behaves as users expect.
    window.addEventListener('hashchange', () => this.renderRoute());
    if (!location.hash) history.replaceState(null, '', '#' + this.platform);
    this.renderRoute();
    this.fetchMissingRatings();
  }
  // Derive thumbnail and added-date for older items from what we already have.
  backfillItems() {
    let changed = false;
    for (let item of this.items) {
      if (!item.thumb) {
        let id = item.identifier || archiveIdFromUrl(item.url);
        if (id) { item.identifier = item.identifier || id; item.thumb = 'https://archive.org/services/img/' + id; changed = true; }
      }
      if (!item.added) {
        // item ids look like "sw-<timestamp>-<n>"; recover the creation time
        let m = /^sw-(\d+)-/.exec(item.id || '');
        item.added = m ? +m[1] : 0;
        changed = true;
      }
    }
    if (changed) this.save();
  }
  // Look up archive.org ratings for archive-sourced items that don't have one yet.
  // avg_rating is only exposed by the advancedsearch API, so batch-query all the
  // missing identifiers at once (client-side, same API as search).
  async fetchMissingRatings() {
    let pending = this.items.filter(i => i.rating === undefined)
      .map(i => ({ item: i, id: i.identifier || archiveIdFromUrl(i.url) }))
      .filter(p => p.id);
    if (!pending.length) return;
    try {
      let q = 'identifier:(' + pending.map(p => p.id).join(' OR ') + ')';
      let params = new URLSearchParams();
      params.append('q', q);
      ['identifier', 'avg_rating'].forEach(f => params.append('fl[]', f));
      params.append('rows', String(pending.length));
      params.append('output', 'json');
      let res = await fetch('https://archive.org/advancedsearch.php?' + params);
      let ratings = {};
      (await res.json()).response.docs.forEach(d => { ratings[d.identifier] = d.avg_rating != null ? +d.avg_rating : 0; });
      pending.forEach(p => { p.item.rating = ratings[p.id] != null ? ratings[p.id] : 0; });
    } catch (e) {
      console.error('Failed to fetch ratings', e);
      pending.forEach(p => { p.item.rating = 0; }); // don't retry endlessly
    }
    this.save();
    if (!this.playing) this.renderGrid();
  }
  // Routes: #<platform> shows that platform's library; #play/<itemId> plays a game.
  renderRoute() {
    let hash = decodeURIComponent(location.hash.replace(/^#/, ''));
    let slash = hash.indexOf('/');
    let head = slash >= 0 ? hash.slice(0, slash) : hash;
    let rest = slash >= 0 ? hash.slice(slash + 1) : '';

    if (head == 'play' && rest) {
      let item = this.items.find(i => i.id == rest);
      if (item) {
        if (this.playing) return; // a player is already showing
        this.platform = item.platform;
        this.playing = true;
        this.play(item);
        return;
      }
      // unknown game id falls through to the library below
    }

    // Library route. Leaving a running emulator requires a reload (emscripten
    // runtimes don't tear down cleanly); the hash is already updated, so we just
    // reload and re-render the library from scratch.
    if (this.playing) { location.reload(); return; }
    if (PLATFORMS[head]) this.platform = head;
    if (this.querySelector('.platform-tabs')) {
      this.renderTabs();
      this.renderGrid();
    } else {
      this.render();
    }
    this.save();
  }
  save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ platform: this.platform, sort: this.sort, muted: this.muted, theater: this.theater, items: this.items }));
    } catch (e) {
      console.error('Failed to save collection', e);
    }
  }
  render() {
    this.innerHTML = `
      <header>
        <img src="../logos/emularity-transparent.png" alt="Emularity">
        <p>Your personal software collection. Pick a platform, add software, click to play.</p>
      </header>
      <div class="platform-tabs"></div>
      <div class="sort-bar"></div>
      <div class="game-grid"></div>
      <p class="empty-note" style="display: none">No software installed for this platform yet. Click "Add software" to get started.</p>
    `;
    this.renderTabs();
    this.renderSortBar();
    this.renderGrid();
    this.buildDialog();
    this.buildEditDialog();
  }
  renderTabs() {
    let tabs = this.querySelector('.platform-tabs');
    tabs.innerHTML = '';
    for (let key in PLATFORMS) {
      let btn = document.createElement('button');
      btn.innerHTML = '<span class="label"></span><span class="sublabel"></span>';
      btn.querySelector('.label').textContent = PLATFORMS[key].label;
      btn.querySelector('.sublabel').textContent = PLATFORMS[key].sublabel;
      if (key == this.platform) btn.classList.add('active');
      btn.addEventListener('click', () => { location.hash = key; });
      tabs.appendChild(btn);
    }
  }
  renderSortBar() {
    let bar = this.querySelector('.sort-bar');
    bar.innerHTML = '<label>Sort by <select class="sort-select"></select></label>';
    let sel = bar.querySelector('.sort-select');
    for (let key in SORTS) {
      let opt = document.createElement('option');
      opt.value = key;
      opt.textContent = SORTS[key].label;
      if (key == this.sort) opt.selected = true;
      sel.appendChild(opt);
    }
    sel.addEventListener('change', () => {
      this.sort = sel.value;
      this.save();
      this.renderGrid();
    });
  }
  renderGrid() {
    if (this.querySelector('.sort-bar')) this.renderSortBar();
    let grid = this.querySelector('.game-grid');
    grid.innerHTML = '';
    let items = this.items.filter(item => item.platform == this.platform);
    items.sort((SORTS[this.sort] || SORTS['added-desc']).cmp);
    items.forEach(item => {
      let card = document.createElement('div');
      card.className = 'game-card';
      card.innerHTML = `
        <img class="game-thumb" loading="lazy">
        <div class="game-info">
          <span class="game-title"></span>
          <span class="game-detail"></span>
          <span class="game-lastplayed"></span>
        </div>
        <button class="game-menu" title="More options">⋮</button>
        <div class="game-menu-popup">
          <button class="menu-edit">✎ Edit info</button>
          <button class="menu-reset">⟲ Reset saved data</button>
          <button class="menu-delete">✕ Remove from collection</button>
        </div>`;
      let thumb = itemThumb(item), img = card.querySelector('.game-thumb');
      if (thumb) { img.src = thumb; img.addEventListener('error', () => img.remove()); }
      else img.remove();
      card.querySelector('.game-title').textContent = item.title;
      card.querySelector('.game-detail').textContent = item.source == 'upload' ? item.filename + ' (uploaded)' : item.filename;
      card.querySelector('.game-lastplayed').textContent = item.lastPlayed ? 'Played ' + relativeTime(item.lastPlayed) : 'Never played';
      card.addEventListener('click', () => { location.hash = 'play/' + item.id; });

      let popup = card.querySelector('.game-menu-popup');
      card.querySelector('.game-menu').addEventListener('click', ev => {
        ev.stopPropagation();
        let wasOpen = popup.classList.contains('open');
        this.closeMenus();
        if (!wasOpen) popup.classList.add('open');
      });
      popup.addEventListener('click', ev => ev.stopPropagation());
      card.querySelector('.menu-edit').addEventListener('click', () => { this.closeMenus(); this.editItem(item); });
      card.querySelector('.menu-reset').addEventListener('click', () => { this.closeMenus(); this.resetSaves(item); });
      card.querySelector('.menu-delete').addEventListener('click', () => { this.closeMenus(); this.remove(item); });
      grid.appendChild(card);
    });

    let addcard = document.createElement('div');
    addcard.className = 'game-card add-card';
    addcard.textContent = '+ Add software';
    addcard.addEventListener('click', () => this.openDialog());
    grid.appendChild(addcard);

    this.querySelector('.empty-note').style.display = items.length ? 'none' : 'block';
    this.querySelector('.sort-bar').style.display = items.length ? '' : 'none';
  }
  closeMenus() {
    this.querySelectorAll('.game-menu-popup.open').forEach(p => p.classList.remove('open'));
  }
  buildEditDialog() {
    let dialog = document.createElement('dialog');
    dialog.className = 'edit-dialog';
    dialog.innerHTML = `
      <button class="close-dialog" title="Close">✕</button>
      <h3>Edit software</h3>
      <label>Title <input type="text" name="edit-title"></label>
      <label class="edit-exe-field">Program to run <input type="text" name="edit-exe" placeholder="GAMEDIR/GAME.EXE"></label>
      <label class="edit-url-field">URL <input type="url" name="edit-url"></label>
      <label>Thumbnail URL <input type="url" name="edit-thumb" placeholder="https://archive.org/services/img/..."></label>
      <button class="primary edit-save">Save changes</button>
    `;
    this.appendChild(dialog);
    this.editDialog = dialog;
    dialog.querySelector('.close-dialog').addEventListener('click', () => dialog.close());
    dialog.querySelector('.edit-save').addEventListener('click', () => this.saveEdit());
  }
  editItem(item) {
    this.editing = item;
    let d = this.editDialog, platform = PLATFORMS[item.platform];
    d.querySelector('[name="edit-title"]').value = item.title || '';
    d.querySelector('[name="edit-exe"]').value = item.exe || '';
    d.querySelector('[name="edit-url"]').value = item.url || '';
    d.querySelector('[name="edit-thumb"]').value = item.thumb || '';
    d.querySelector('.edit-exe-field').style.display = platform && platform.exeField ? '' : 'none';
    d.querySelector('.edit-url-field').style.display = item.source == 'url' ? '' : 'none';
    d.showModal();
  }
  saveEdit() {
    let item = this.editing, d = this.editDialog;
    if (!item) return;
    item.title = d.querySelector('[name="edit-title"]').value.trim() || item.title;
    item.exe = d.querySelector('[name="edit-exe"]').value.trim();
    if (item.source == 'url') item.url = d.querySelector('[name="edit-url"]').value.trim() || item.url;
    item.thumb = d.querySelector('[name="edit-thumb"]').value.trim() || undefined;
    this.save();
    this.renderGrid();
    d.close();
  }
  add(item) {
    item.id = 'sw-' + Date.now() + '-' + this.items.length;
    item.platform = this.platform;
    item.added = Date.now();
    this.items.push(item);
    this.save();
    this.renderGrid();
    return item;
  }
  async resetSaves(item) {
    if (!confirm(`Reset saved data for "${item.title}"? Saves, high scores, and settings written by this title will be permanently erased. The software itself stays in your collection.`)) return;
    await new Promise((resolve, reject) => {
      let req = indexedDB.deleteDatabase('collection-' + item.id);
      req.onsuccess = resolve;
      req.onblocked = resolve; // nothing holds the db open in the library view
      req.onerror = () => reject(req.error);
    }).catch(e => alert('Failed to reset saved data: ' + e));
  }
  async remove(item) {
    if (!confirm(`Remove "${item.title}" from your collection?`)) return;
    this.items = this.items.filter(i => i != item);
    if (item.source == 'upload') {
      try { await filedb.delete(item.id); } catch (e) { console.error(e); }
    }
    this.save();
    this.renderGrid();
  }

  /* ===== Playing ===== */

  async play(item) {
    item.lastPlayed = Date.now();
    this.save();
    let url = item.url;
    if (item.source == 'upload') {
      let blob = await filedb.get(item.id);
      if (!blob) {
        alert('The uploaded file for this title is missing from browser storage. Remove it and add it again.');
        return;
      }
      url = URL.createObjectURL(blob);
    }

    let emu;
    if (item.platform == 'dos') {
      emu = document.createElement('emularity-dosbox');
      emu.setAttribute('wasmroot', '../emulators/dosbox');
      emu.setAttribute('splashlogo', '../logos/emularity-transparent.png');
      // Append `exit` so DOSBox quits when the program exits (fires the emulator's
      // exit event) instead of dropping the user to a bare DOS prompt.
      if (item.exe) emu.setAttribute('exe', exeToAutoexec(item.exe) + '\nexit');
      let media = document.createElement(/\.(img|ima)$/i.test(item.filename) ? 'emularity-dosbox-floppy' : 'emularity-dosbox-drive');
      media.setAttribute('letter', media.tagName.toLowerCase().includes('floppy') ? 'a' : 'c');
      media.setAttribute('url', url);
      media.setAttribute('label', item.title);
      emu.appendChild(media);
    } else if (item.platform == 'apple2e') {
      let ext = item.filename.match(/\.([a-z0-9]+)$/i);
      let path = '/software.' + (ext ? ext[1].toLowerCase() : 'dsk');
      emu = document.createElement('emularity-mame');
      emu.setAttribute('wasmroot', '../emulators/mame');
      emu.setAttribute('wasmscript', 'mameapple2e.module.js');
      emu.setAttribute('wasminit', 'MAMEAPPLE2E');
      emu.setAttribute('system', 'apple2e');
      emu.setAttribute('arguments', '-flop1 /emulator' + path);
      emu.setAttribute('splashlogo', '../logos/emularity-transparent.png');
      let bios = document.createElement('emularity-file');
      bios.setAttribute('url', 'https://emularity-bios.ux-b.archive.org/apple2e.zip');
      bios.setAttribute('path', '/apple2e.zip');
      bios.setAttribute('label', 'Apple IIe BIOS');
      emu.appendChild(bios);
      let software = document.createElement('emularity-file');
      software.setAttribute('url', url);
      software.setAttribute('path', path);
      software.setAttribute('label', item.title);
      emu.appendChild(software);
    } else {
      alert('Unknown platform: ' + item.platform);
      return;
    }
    // Persist each title's writes (saves, high scores, NVRAM) under its own store,
    // so titles sharing a mountpoint can't contaminate each other
    emu.setAttribute('persist', 'collection-' + item.id);

    let keyboard = document.createElement('emularity-keyboard');
    keyboard.setAttribute('layout', 'pc101');
    emu.appendChild(keyboard);

    // Swap the library UI out for the player. "Back to collection" navigates history
    // (same as the browser Back button), which returns to the library route.
    let bar = document.createElement('div');
    bar.className = 'player-bar';
    bar.innerHTML = `
      <button class="pb-back">◀ Back to collection</button>
      <span class="player-title"></span>
      <span class="pb-timer" title="Time played this session">0:00</span>
      <span class="pb-controls">
        <button class="pb-mute"></button>
        <button class="pb-theater" title="Theater mode">▭</button>
        <button class="pb-fullscreen" title="Fullscreen">⛶</button>
      </span>`;
    bar.querySelector('.player-title').textContent = item.title;
    bar.querySelector('.pb-back').addEventListener('click', () => history.back());

    // Count up play time for this session (the interval dies on the reload that
    // "Back to collection" triggers).
    let start = Date.now(), timerEl = bar.querySelector('.pb-timer');
    let tick = () => { timerEl.textContent = formatDuration(Date.now() - start); };
    tick();
    this.playTimer = setInterval(tick, 1000);

    // When the emulated program exits, show a "powered off" screen instead of a
    // bare DOS prompt.
    emu.addEventListener('exit', () => this.showPoweredOff(item));

    let muteBtn = bar.querySelector('.pb-mute');
    let updateMute = () => { muteBtn.textContent = this.muted ? '🔇' : '🔊'; muteBtn.title = this.muted ? 'Unmute' : 'Mute'; };
    updateMute();
    muteBtn.addEventListener('click', () => { this.muted = !this.muted; audioMute.set(this.muted); this.save(); updateMute(); });

    let theaterBtn = bar.querySelector('.pb-theater');
    theaterBtn.classList.toggle('active', this.theater);
    theaterBtn.addEventListener('click', () => {
      this.theater = !this.theater;
      this.classList.toggle('theater', this.theater);
      theaterBtn.classList.toggle('active', this.theater);
      this.save();
    });

    bar.querySelector('.pb-fullscreen').addEventListener('click', () => {
      let c = this.currentEmu && this.currentEmu.canvas;
      if (document.fullscreenElement) document.exitFullscreen();
      else if (c && c.requestFullscreen) c.requestFullscreen().catch(e => console.warn('Emularity: fullscreen failed', e));
    });

    this.currentEmu = emu;
    this.classList.add('playing');
    this.classList.toggle('theater', this.theater);
    this.innerHTML = '';
    this.appendChild(bar);
    this.appendChild(emu);
  }
  showPoweredOff(item) {
    if (this.poweredOff) return;
    this.poweredOff = true;
    clearInterval(this.playTimer);
    if (document.fullscreenElement) { try { document.exitFullscreen(); } catch (e) {} }
    let overlay = document.createElement('div');
    overlay.className = 'powered-off';
    overlay.innerHTML = `
      <div class="po-title"></div>
      <p class="po-sub">The game has powered off.</p>
      <button class="po-power" title="Power on">⏻</button>
      <span class="po-label">Power on</span>`;
    overlay.querySelector('.po-title').textContent = item.title;
    let powerOn = () => { location.reload(); };
    overlay.querySelector('.po-power').addEventListener('click', powerOn);
    overlay.querySelector('.po-label').addEventListener('click', powerOn);
    this.appendChild(overlay);
  }

  /* ===== Add-software dialog ===== */

  buildDialog() {
    let dialog = document.createElement('dialog');
    dialog.innerHTML = `
      <button class="close-dialog" title="Close">✕</button>
      <h3>Add software</h3>
      <div class="add-tabs">
        <button data-tab="search" class="active">Search archive.org</button>
        <button data-tab="url">From URL</button>
        <button data-tab="upload">Upload</button>
      </div>

      <div class="tab-panel" data-panel="search">
        <div class="search-row">
          <span class="search-filter" title="Results are filtered to software for this platform"></span>
          <input type="search" name="query" placeholder="Search titles...">
        </div>
        <p class="field-hint">Results from archive.org's software library. Click one to add it to your collection.</p>
        <div class="search-results"></div>
      </div>

      <div class="tab-panel" data-panel="url" style="display: none">
        <label>Title <input type="text" name="title"></label>
        <label>URL <input type="url" name="url" placeholder="https://example.com/game.zip"></label>
        <p class="field-hint url-hint"></p>
        <label class="exe-field">Program to run <input type="text" name="exe" placeholder="GAMEDIR/GAME.EXE"></label>
        <button class="primary add-url">Add to collection</button>
      </div>

      <div class="tab-panel" data-panel="upload" style="display: none">
        <label>Title <input type="text" name="uploadtitle"></label>
        <label>File <input type="file" name="file"></label>
        <p class="field-hint upload-hint"></p>
        <label class="exe-field">Program to run <input type="text" name="uploadexe" placeholder="GAMEDIR/GAME.EXE"></label>
        <button class="primary add-upload">Add to collection</button>
      </div>
      <p class="error-note"></p>
    `;
    this.appendChild(dialog);
    this.dialog = dialog;

    dialog.querySelector('.close-dialog').addEventListener('click', () => dialog.close());
    dialog.querySelectorAll('.add-tabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        dialog.querySelectorAll('.add-tabs button').forEach(b => b.classList.toggle('active', b == btn));
        dialog.querySelectorAll('.tab-panel').forEach(p => {
          p.style.display = (p.dataset.panel == btn.dataset.tab) ? '' : 'none';
        });
      });
    });

    let query = dialog.querySelector('[name="query"]');
    // Debounce as-you-type searches so we don't hit archive.org on every keystroke
    query.addEventListener('input', () => {
      clearTimeout(this.searchtimer);
      this.searchtimer = setTimeout(() => this.runSearch(), 500);
    });
    query.addEventListener('keydown', ev => {
      if (ev.key == 'Enter') {
        clearTimeout(this.searchtimer);
        this.runSearch();
      }
    });
    // Infinite scroll: fetch the next page as the list nears the bottom
    dialog.querySelector('.search-results').addEventListener('scroll', ev => {
      let el = ev.target;
      if (el.scrollTop + el.clientHeight >= el.scrollHeight - 150) this.loadMoreResults();
    });
    dialog.querySelector('.add-url').addEventListener('click', () => this.addFromURL());
    dialog.querySelector('.add-upload').addEventListener('click', () => this.addFromUpload());
  }
  openDialog() {
    let platform = PLATFORMS[this.platform];
    this.dialog.querySelector('[name="query"]').value = '';
    this.dialog.querySelector('.search-filter').textContent = platform.query;
    this.dialog.querySelector('.search-results').innerHTML = '';
    this.dialog.querySelector('.error-note').textContent = '';
    this.dialog.querySelector('.url-hint').textContent = platform.urlHint;
    this.dialog.querySelector('.upload-hint').textContent = platform.urlHint;
    this.dialog.querySelector('[name="file"]').accept = platform.accept;
    this.dialog.querySelectorAll('.exe-field').forEach(el => {
      el.style.display = platform.exeField ? '' : 'none';
    });
    this.dialog.showModal();
    this.dialog.querySelector('[name="query"]').focus();
    this.runSearch(); // pre-populate with this platform's most popular software
  }
  setError(msg) {
    this.dialog.querySelector('.error-note').textContent = msg || '';
  }
  appendResults(docs) {
    let results = this.dialog.querySelector('.search-results');
    docs.forEach(doc => {
      let row = document.createElement('div');
      row.className = 'search-result';
      row.innerHTML = '<img loading="lazy"><div><div class="result-title"></div><div class="result-detail"></div></div>';
      row.querySelector('img').src = 'https://archive.org/services/img/' + doc.identifier;
      row.querySelector('.result-title').textContent = Array.isArray(doc.title) ? doc.title[0] : (doc.title || doc.identifier);
      row.querySelector('.result-detail').textContent = doc.identifier + (doc.year ? ' · ' + doc.year : '');
      row.addEventListener('click', () => this.addFromArchive(doc, row));
      results.appendChild(row);
    });
  }
  async runSearch() {
    let results = this.dialog.querySelector('.search-results');
    let text = this.dialog.querySelector('[name="query"]').value.trim();
    let query = PLATFORMS[this.platform].query + (text ? ' ' + text : '');
    let seq = this.searchseq = (this.searchseq || 0) + 1;
    this.searchState = { seq, query, page: 1, total: Infinity, loading: true };
    if (!results.children.length) results.innerHTML = '<p class="field-hint">Searching...</p>';
    results.classList.add('loading');
    this.setError('');
    try {
      let { docs, total } = await searchArchive(query, 1);
      if (seq != this.searchseq) return; // a newer search superseded this one
      results.classList.remove('loading');
      results.innerHTML = '';
      this.searchState.total = total;
      this.searchState.loading = false;
      if (!docs.length) { results.innerHTML = '<p class="field-hint">No results.</p>'; return; }
      this.appendResults(docs);
      results.scrollTop = 0;
    } catch (e) {
      if (seq != this.searchseq) return;
      console.error(e);
      results.classList.remove('loading');
      results.innerHTML = '';
      this.setError('Search failed: ' + e.message);
    }
  }
  async loadMoreResults() {
    let st = this.searchState;
    if (!st || st.loading) return;
    let results = this.dialog.querySelector('.search-results');
    if (results.querySelectorAll('.search-result').length >= st.total) return; // all loaded
    st.loading = true;
    let seq = st.seq, nextPage = st.page + 1;
    let loader = document.createElement('div');
    loader.className = 'search-more';
    loader.textContent = 'Loading more...';
    results.appendChild(loader);
    try {
      let { docs } = await searchArchive(st.query, nextPage);
      loader.remove();
      if (seq != this.searchseq) return; // superseded by a newer search
      st.page = nextPage;
      st.loading = false;
      this.appendResults(docs);
    } catch (e) {
      loader.remove();
      if (seq != this.searchseq) return;
      st.loading = false;
      console.error(e);
    }
  }
  async addFromArchive(doc, row) {
    let identifier = doc.identifier;
    this.setError('');
    row.style.opacity = .5;
    try {
      let resolved = await resolveArchiveItem(identifier);
      this.add({
        title: resolved.title,
        source: 'url',
        url: resolved.url,
        filename: resolved.filename,
        exe: resolved.exe,
        identifier: identifier,
        thumb: 'https://archive.org/services/img/' + identifier,
        rating: doc.avg_rating != null ? +doc.avg_rating : 0,
      });
      this.dialog.close();
    } catch (e) {
      console.error(e);
      this.setError(`Couldn't add ${identifier}: ${e.message}`);
    } finally {
      row.style.opacity = '';
    }
  }
  addFromURL() {
    let url = this.dialog.querySelector('[name="url"]').value.trim();
    let title = this.dialog.querySelector('[name="title"]').value.trim();
    if (!url) return this.setError('A URL is required.');
    let filename = url.split('?')[0].split('/').pop() || 'software';
    this.add({
      title: title || filename,
      source: 'url',
      url: url,
      filename: filename,
      exe: this.dialog.querySelector('[name="exe"]').value.trim(),
    });
    this.dialog.close();
  }
  async addFromUpload() {
    let input = this.dialog.querySelector('[name="file"]');
    let title = this.dialog.querySelector('[name="uploadtitle"]').value.trim();
    if (!input.files.length) return this.setError('Choose a file to upload.');
    let file = input.files[0];
    let item = this.add({
      title: title || file.name,
      source: 'upload',
      filename: file.name,
      exe: this.dialog.querySelector('[name="uploadexe"]').value.trim(),
    });
    try {
      await filedb.put(item.id, file);
      this.dialog.close();
    } catch (e) {
      console.error(e);
      this.items = this.items.filter(i => i != item);
      this.save();
      this.renderGrid();
      this.setError('Failed to store the file in browser storage: ' + e.message);
    }
  }
}
customElements.define('emularity-collection', EmularityCollection);
    </script>
  </body>
</html>
