    <script>
      function initCustomWad(emu) {
        let urlargs = new URLSearchParams(document.location.search),
            wadname = urlargs.get('wadname'),
            wadurl = urlargs.get('wadurl'),
            warp = urlargs.get('warp');
        if (wadname && wadurl) {
          let wadfile = document.createElement('emularity-file');
          wadfile.setAttribute('url', wadurl);
          wadfile.path = `/${wadname}.wad`;
          emu.addFile(wadfile.path, wadfile);
          emu.addArgument('-file', `/emulator/${wadname}.wad`);
          if (warp) {
            let w = warp.split(' ');
            if (w.length > 0) {
              emu.addArgument('-warp');
              emu.addArgument(w[0]);
            }
            if (w.length > 1) {
              emu.addArgument(w[1]);
            }
          }
        }
      }
class DoomSelector extends HTMLElement {
  games = {
    "doomsw": { "label": "Doom (Shareware)", "description": "Episode 1: Knee-Deep in the Dead", "url": "https://ia801404.us.archive.org/cors_get.php?path=/1/items/DoomsharewareEpisode/doom.ZIP", "mountpoint": "/doomsw", "wadpath": "/emulator/doomsw/DOOM1.WAD" },
    "freedoom": { "label": "Freedoom: Phase 1", "description": "Free Doom-style replacement episodes", "url": "https://ia800800.us.archive.org/cors_get.php?path=/18/items/fdprev-v13/FDPREV-v13.zip", "mountpoint": "/freedoom", "wadpath": "/emulator/freedoom/FREEDM1.WAD" },
    "freedoom2": { "label": "Freedoom: Phase 2", "description": "Free Doom II-style replacement game", "url": "https://ia800800.us.archive.org/cors_get.php?path=/18/items/fdprev-v13/FDPREV-v13.zip", "mountpoint": "/freedoom", "wadpath": "/emulator/freedoom/FREEDM2.WAD" },
  }
  connectedCallback() {
    this.addEventListener('dragover', ev => this.handleDragOver(ev));
    this.addEventListener('dragleave', ev => this.handleDragLeave(ev));
    this.addEventListener('drop', ev => this.handleDrop(ev));

    this.innerHTML = `
      <h2>Choose a game</h2>
      <p class="selector-intro">Chocolate Doom needs a game data file (an IWAD) to play. Pick one of these free games to get started:</p>
    `;
    let list = document.createElement('div');
    list.className = 'selector-games';
    for (let game in this.games) {
      let item = document.createElement('doom-selector-item');
      item.set(this.games[game]);
      list.appendChild(item);
      item.addEventListener('click', ev => this.handleSelectItem(this.games[game]));
    }
    this.appendChild(list);

    this.fileinput = document.createElement('input');
    this.fileinput.type = 'file';
    this.fileinput.accept = '.wad,.WAD';
    this.fileinput.style.display = 'none';
    this.fileinput.addEventListener('change', ev => this.handleFiles(this.fileinput.files));

    let dropzone = document.createElement('div');
    dropzone.className = 'selector-dropzone';
    dropzone.innerHTML = 'Own the real thing? Drag and drop the <strong>DOOM.WAD</strong> or <strong>DOOM2.WAD</strong> from your copy of Doom, Doom&nbsp;II, or Final Doom onto this page (or click here to browse) to play the full game. Your file stays on your computer.';
    dropzone.addEventListener('click', ev => this.fileinput.click());
    this.appendChild(dropzone);
    this.appendChild(this.fileinput);
  }
  handleSelectItem(item) {
    let emu = this.parentNode;
    let wadfile = document.createElement('emularity-file');
    wadfile.setAttribute('url', item.url);
    if (item.mountpoint) wadfile.setAttribute('mountpoint', item.mountpoint);
    if (item.path) {
      wadfile.setAttribute('path', item.path);
      wadfile.path = item.path; // FIXME - weird
    }

    emu.addFile(wadfile.path, wadfile);
    emu.addArgument('-iwad', item.wadpath);
    emu.start();
    if (this.parentNode) this.parentNode.removeChild(this);
  }
  handleFiles(files) {
    [...files].forEach(file => {
      let item = { label: file.name, url: URL.createObjectURL(file), path: '/' + file.name, wadpath: '/emulator/' + file.name };
      this.handleSelectItem(item);
    });
  }
  handleDragOver(ev) {
    this.classList.add('dragging');
    ev.preventDefault();
  }
  handleDragLeave(ev) {
    this.classList.remove('dragging');
  }
  handleDrop(ev) {
    this.classList.remove('dragging');
    if (ev.dataTransfer.files && ev.dataTransfer.files.length > 0) {
      this.handleFiles(ev.dataTransfer.files);
    }
    ev.preventDefault();
  }
}
class DoomSelectorItem extends HTMLElement {
  set(item) {
    this.innerHTML = '<span class="game-label"></span><span class="game-description"></span>';
    this.querySelector('.game-label').textContent = item.label;
    this.querySelector('.game-description').textContent = item.description || '';
  }
}
customElements.define('doom-selector', DoomSelector);
customElements.define('doom-selector-item', DoomSelectorItem);
    </script>
